    post:
      tags: [Delivery]
      summary: Assign a run to an agent
      operationId: assignDeliveryRun
      description: |
        Only before dispatch.

        Requires the `delivery.assign` permission.
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignRunRequest' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/delivery-runs/{runId}/dispatch:
    post:
      tags: [Delivery]
      summary: Dispatch a run
      operationId: dispatchDeliveryRun
      description: |
        The only place OUT_FOR_DELIVERY is set. The transition carries a destination-branch custody rule, so a run at the wrong branch cannot dispatch a parcel it does not hold.

        Requires the `delivery.dispatch` permission.
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/DeviceId' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/deliveries/queue:
    get:
      tags: [Delivery]
      summary: Delivery-ready queue at a branch
      operationId: getDeliveryQueue
      description: |
        Everything at this branch that could go out today, most urgent first, with the NDR context attached where there is a case.

        Requires the `delivery.read` permission.
      parameters:
        - { name: operatingUnitId, in: query, schema: { type: string }, description: The operating unit you are working at. Optional when your role covers exactly one. }
        - { $ref: '#/components/parameters/Limit' }
        - { name: status, in: query, schema: { type: string }, description: Filter by status. }
        - { name: includeHeld, in: query, schema: { type: boolean, default: false } }
        - { name: excludeAssigned, in: query, schema: { type: boolean, default: true } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryQueue' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/deliveries/attempts:
    post:
      tags: [Delivery]
      summary: Record a delivery attempt
      operationId: recordDeliveryAttempt
      description: |
        The most concurrency-sensitive call in the system. Supply either an `Idempotency-Key` or an `X-Device-Id`/`X-Device-Event-Id` pair; the request is refused without one.

        On success or failure it records the attempt, moves the shipment, and — on a failure — opens or advances an NDR case, returning its id.

        Guarantees: exactly one successful attempt can ever exist per shipment (`ALREADY_DELIVERED` for the rest), a replayed device event returns the original attempt with `replayed: true`, and only the agent holding the parcel may complete it.

        A COD shipment refuses completion unless the collected amount matches the amount due, in integer minor units.

        Requires the `delivery.complete` permission.
      parameters:
        - { name: operatingUnitId, in: query, schema: { type: string }, description: The operating unit you are working at. Optional when your role covers exactly one. }
        - { $ref: '#/components/parameters/DeviceId' }
        - { $ref: '#/components/parameters/DeviceEventId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliveryAttemptRequest' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryAttemptResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/deliveries/otp:
    post:
      tags: [Delivery]
      summary: Issue a delivery OTP
      operationId: issueDeliveryOTP
      description: |
        Generates a single-use code for the consignee. **The code is returned exactly once** — only its SHA-256 digest is stored, so it can never be read back from the API, the database or a log. Issuing a second code invalidates the first.

        Requires the `delivery.otp_issue` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueOTPRequest' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedOTP' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/ndr:
    get:
      tags: [NDR]
      summary: List NDR cases
      operationId: listNDRCases
      description: |
        Open and resolved delivery exceptions.

        Requires the `ndr.read` permission.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: status, in: query, schema: { type: string }, description: Filter by status. }
        - { name: reasonCode, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { $ref: '#/components/schemas/NDRAction' } }
        - { name: branchId, in: query, schema: { type: string } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NDRCasePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/ndr/{caseId}:
    get:
      tags: [NDR]
      summary: Get an NDR case
      operationId: getNDRCase
      description: |
        The case with every recorded attempt, every instruction, and any corrected address.

        A corrected address never replaces the shipment's booking snapshot: both are visible, so the record of where the parcel was originally sent survives.

        Requires the `ndr.read` permission.
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NDRCase' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/ndr/{caseId}/action:
    post:
      tags: [NDR]
      summary: Set the next action on a case
      operationId: setNDRAction
      description: |
        Records the decision currently in force, superseding any pending one so an agent is never shown two conflicting instructions.

        `REATTEMPT` returns the parcel to the branch shelf. `RTO` hands off to the returns workflow and resolves the case.

        Requires the `ndr.manage` permission.
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NDRActionRequest' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NDRCase' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/ndr/reasons:
    get:
      tags: [NDR]
      summary: List NDR reasons
      operationId: listNDRReasons
      description: |
        The tenant's configurable reason catalogue.

        Requires the `ndr.read` permission.
      parameters:
        - { name: activeOnly, in: query, schema: { type: boolean, default: true } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NDRReasonList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [NDR]
      summary: Create an NDR reason
      operationId: createNDRReason
      description: |
        Each reason carries a default action, an attempt budget and whether exhausting it triggers an automatic return.

        Requires the `ndr.config` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NDRReasonRequest' }
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NDRReason' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/ndr/reasons/{reasonId}:
    patch:
      tags: [NDR]
      summary: Update an NDR reason
      operationId: updateNDRReason
      description: |
        Deactivating a reason keeps historical cases intact.

        Requires the `ndr.config` permission.
      parameters:
        - { name: reasonId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NDRReasonRequest' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NDRReason' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/rto:
    get:
      tags: [RTO]
      summary: List RTO cases
      operationId: listRTOCases
      description: |
        Returns in progress and completed.

        Requires the `rto.read` permission.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: status, in: query, schema: { type: string }, description: Filter by status. }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RTOCasePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [RTO]
      summary: Start a return
      operationId: initiateRTO
      description: |
        Resolves the reverse route with the same routing engine used for booking, origin and destination swapped, and flips the shipment to reverse movement. From that point the state machine refuses forward transitions, which is what stops an RTO parcel being delivered to the original consignee by mistake.

        Requires the `rto.manage` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InitiateRTORequest' }
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RTOCase' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/rto/{caseId}:
    get:
      tags: [RTO]
      summary: Get an RTO case
      operationId: getRTOCase
      description: |
        The return with its planned legs, the sender's address from the booking snapshot, and how the reverse route was chosen.

        Requires the `rto.read` permission.
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RTOCase' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/rto/{caseId}/dispatch:
    post:
      tags: [RTO]
      summary: Dispatch a return
      operationId: dispatchRTO
      description: |
        Puts an initiated return into reverse transit.

        Requires the `rto.manage` permission.
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string } }
        - { name: operatingUnitId, in: query, schema: { type: string }, description: The operating unit you are working at. Optional when your role covers exactly one. }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RTOCase' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/rto/receive:
    post:
      tags: [RTO]
      summary: Receive a returning parcel
      operationId: receiveRTO
      description: |
        Records the parcel's arrival on the return leg. The shipment stays `RTO_IN_TRANSIT`: the reverse journey is tracked by legs and events rather than by a mirrored set of statuses, so "where is my return" is answerable without doubling the state machine.

        Requires the `rto.manage` permission.
      parameters:
        - { name: operatingUnitId, in: query, schema: { type: string }, description: The operating unit you are working at. Optional when your role covers exactly one. }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BarcodeRequest' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RTOCase' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/rto/{caseId}/complete:
    post:
      tags: [RTO]
      summary: Hand a return back to the sender
      operationId: completeRTO
      description: |
        `RETURNED` completes the case and moves the shipment to `RTO_DELIVERED`. `FAILED` keeps the case open: the parcel is still the network's problem.

        Requires the `rto.manage` permission.
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string } }
        - { name: operatingUnitId, in: query, schema: { type: string }, description: The operating unit you are working at. Optional when your role covers exactly one. }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteRTORequest' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RTOCase' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/pod:
    post:
      tags: [Proof of delivery]
      summary: Submit proof of delivery
      operationId: submitPOD
      description: |
        Accepts `multipart/form-data`: the evidence is binary, and base64 in JSON would cost a third more bytes over a mobile connection.

        File fields are named after the artifact type in lower case — `signature`, `photo`, `id_proof`, `document`, `audio` — and at least one is required. The content type is decided by **sniffing the bytes**, never from the filename or the declared `Content-Type`; only JPEG, PNG, WebP and PDF are accepted, up to the configured size limit.

        Each file is stored privately with a server-generated key and its SHA-256 recorded, which is what proves the file served in a dispute is the file uploaded on the day.

        The record is append-only: nobody edits a POD.

        Requires the `pod.submit` permission.
      parameters:
        - { name: operatingUnitId, in: query, schema: { type: string }, description: The operating unit you are working at. Optional when your role covers exactly one. }
        - { $ref: '#/components/parameters/DeviceId' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/SubmitPODRequest' }
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProofOfDelivery' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/pod/{podId}:
    get:
      tags: [Proof of delivery]
      summary: Get proof of delivery
      operationId: getPOD
      description: |
        The record with its artifacts. Each artifact carries its checksum and a `downloadUrl` pointing at the endpoint that issues a short-lived signed link — the link itself is never embedded in a listing.

        Requires the `pod.read` permission.
      parameters:
        - { name: podId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProofOfDelivery' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/pod/{podId}/artifacts/{artifactId}/download:
    get:
      tags: [Proof of delivery]
      summary: Download a POD artifact
      operationId: downloadPODArtifact
      description: |
        Returns `307` with a short-lived signed URL when the storage backend can presign, or streams the bytes otherwise. Every retrieval is authorized and logged: a delivery dispute frequently turns on who had access to the evidence.

        Requires the `pod.read` permission.
      parameters:
        - { name: podId, in: path, required: true, schema: { type: string } }
        - { name: artifactId, in: path, required: true, schema: { type: string } }
      responses:
        '307': { $ref: '#/components/responses/SignedRedirect' }
        '200': { $ref: '#/components/responses/BinaryStream' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/track/{awb}:
    get:
      tags: [Public tracking]
      summary: Track a shipment by AWB
      operationId: trackShipment
      security: []
      description: |
        The only unauthenticated endpoint that reads business data, and
        deliberately the narrowest.

        **Never returned**: internal identifiers of any kind (no `shp_`, `ou_`
        or `cus_` — the AWB is the only identifier a consignee gets), internal
        remarks, employee names, facility names or codes, and any financial
        figure other than the COD amount the recipient must have ready.

        Locations are reduced to a city, and only where the milestone
        configuration permits it: naming a facility would tell an observer where
        a network's sort hubs are and which one currently holds a given parcel.

        Consecutive events that map to the same milestone are collapsed unless
        the location changed, so a customer sees a journey rather than a scan
        log.

        An unknown AWB and a malformed one return an identical 404, so the
        endpoint cannot be used to discover which numbers exist.

        Rate limited far more tightly than the authenticated API, and cached for
        60 seconds.
      parameters:
        - { name: awb, in: path, required: true, schema: { type: string }, description: The air waybill number. }
      responses:
        '200':
          description: The public tracking timeline.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackingResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }


  # ==========================================================================
  # Release 3 — Finance
  # ==========================================================================

  /api/v1/ledger/accounts:
    get:
      tags: [Ledger]
      summary: List chart-of-accounts entries
      operationId: listLedgerAccounts
      description: |
        Requires `ledger.read`.

        Subsidiary accounts (one per counterparty) appear alongside their
        control accounts. A control account that has subsidiaries reports a
        zero balance of its own, because postings land on the subsidiary.
      parameters:
        - { name: accountType, in: query, schema: { type: string, enum: [ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE] } }
        - { name: partyType, in: query, schema: { type: string, enum: [FRANCHISE, CUSTOMER, OPERATING_UNIT, AGENT, CARRIER] } }
        - { name: search, in: query, schema: { type: string } }
        - { name: activeOnly, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: The chart of accounts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/LedgerAccount" } }
                  total: { type: integer }
    post:
      tags: [Ledger]
      summary: Create a ledger account
      operationId: createLedgerAccount
      description: |
        Requires `ledger.account_manage`. The normal balance is derived from the
        account type and cannot be supplied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, accountType]
              properties:
                code: { type: string, example: "5500" }
                name: { type: string, example: "Fuel Subsidy Expense" }
                accountType: { type: string, enum: [ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE] }
                description: { type: string }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerAccount" }
        "409":
          description: The code is already in use.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/ledger/accounts/{accountId}:
    parameters:
      - { name: accountId, in: path, required: true, schema: { type: string, pattern: '^lac_[0-9A-HJKMNP-TV-Z]{26}$' } }
    get:
      tags: [Ledger]
      summary: Get an account balance
      operationId: getLedgerAccountBalance
      description: |
        Requires `ledger.read`. `balanceMinor` is already signed by the
        account's normal balance: positive always means "more of what this
        account is for".
      parameters:
        - { name: asOf, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: The account and its balance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerAccount" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/ledger/accounts/{accountId}/statement:
    parameters:
      - { name: accountId, in: path, required: true, schema: { type: string, pattern: '^lac_[0-9A-HJKMNP-TV-Z]{26}$' } }
    get:
      tags: [Ledger]
      summary: Account statement with running balance
      operationId: getLedgerAccountStatement
      description: |
        Requires `ledger.read`. The running balance is computed in the database;
        do not accumulate it client-side.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Statement lines.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account: { $ref: "#/components/schemas/LedgerAccount" }
                  data: { type: array, items: { $ref: "#/components/schemas/StatementLine" } }
                  total: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/ledger/journals:
    get:
      tags: [Ledger]
      summary: List journal transactions
      operationId: listJournals
      description: Requires `ledger.read`.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, POSTED, REVERSED] } }
        - { name: sourceType, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: cursor, in: query, schema: { type: integer } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Journal register.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/JournalTransaction" } }
    post:
      tags: [Ledger]
      summary: Post a manual journal
      operationId: postJournal
      description: |
        Requires `ledger.post`. A reason is mandatory, and the posting is always
        recorded with source type `MANUAL` so an operator-entered journal is
        distinguishable from one a module produced.

        Debits must equal credits. An unbalanced set of legs is refused with
        `LEDGER_UNBALANCED` before anything is written.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostJournalRequest" }
      responses:
        "201":
          description: Posted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction: { $ref: "#/components/schemas/JournalTransaction" }
                  entries: { type: array, items: { $ref: "#/components/schemas/JournalEntry" } }
        "409":
          description: Unbalanced, or the accounting period is closed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/ledger/journals/{journalId}:
    parameters:
      - { name: journalId, in: path, required: true, schema: { type: string, pattern: '^jrn_[0-9A-HJKMNP-TV-Z]{26}$' } }
    get:
      tags: [Ledger]
      summary: Get a journal transaction with its entries
      operationId: getJournal
      description: Requires `ledger.read`.
      responses:
        "200":
          description: The transaction and its entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction: { $ref: "#/components/schemas/JournalTransaction" }
                  entries: { type: array, items: { $ref: "#/components/schemas/JournalEntry" } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/ledger/journals/{journalId}/reverse:
    parameters:
      - { name: journalId, in: path, required: true, schema: { type: string, pattern: '^jrn_[0-9A-HJKMNP-TV-Z]{26}$' } }
    post:
      tags: [Ledger]
      summary: Reverse a posted journal
      operationId: reverseJournal
      description: |
        Requires `ledger.reverse`. Writes the mirror image and marks the original
        `REVERSED`. The original is not deleted and both remain in the books —
        they cancel arithmetically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3 }
                postingDate: { type: string, format: date }
      responses:
        "200":
          description: The reversal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reversal: { $ref: "#/components/schemas/JournalTransaction" }
                  entries: { type: array, items: { $ref: "#/components/schemas/JournalEntry" } }
        "409":
          description: Already reversed, or the journal is a draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/ledger/trial-balance:
    get:
      tags: [Ledger]
      summary: Trial balance
      operationId: getTrialBalance
      description: |
        Requires `ledger.read`. The report checks itself: `balanced` must be
        true, and `differenceMinor` must be zero.
      parameters:
        - { name: asOf, in: query, schema: { type: string, format: date } }
        - { name: includeZero, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: The trial balance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrialBalance" }

  /api/v1/ledger/health:
    get:
      tags: [Ledger]
      summary: Whole-ledger invariant check
      operationId: getLedgerHealth
      description: |
        Requires `ledger.read`. Returns 200 with `balanced: false` when the books
        are inconsistent — the caller asked a question and gets a truthful
        answer. A false here is a production incident, not a client error.
      responses:
        "200":
          description: Ledger consistency.
          content:
            application/json:
              schema:
                type: object
                properties:
                  balanced: { type: boolean }
                  unbalancedCount: { type: integer }
                  unbalancedTransactions: { type: array, items: { type: object } }

  /api/v1/ledger/periods:
    get:
      tags: [Ledger]
      summary: List accounting periods
      operationId: listAccountingPeriods
      description: Requires `ledger.read`.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: The accounting calendar.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AccountingPeriod" } }

  /api/v1/ledger/periods/{periodId}/close:
    parameters:
      - { name: periodId, in: path, required: true, schema: { type: string, pattern: '^acp_[0-9A-HJKMNP-TV-Z]{26}$' } }
    post:
      tags: [Ledger]
      summary: Close an accounting period
      operationId: closeAccountingPeriod
      description: |
        Requires `ledger.period_manage`. Refuses to close over an unbalanced
        ledger: a trial balance that does not balance must be fixed before the
        period it belongs to is frozen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string, minLength: 3 } }
      responses:
        "200":
          description: Closed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountingPeriod" }
        "409":
          description: Already closed, or the ledger does not balance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/ledger/periods/{periodId}/reopen:
    parameters:
      - { name: periodId, in: path, required: true, schema: { type: string, pattern: '^acp_[0-9A-HJKMNP-TV-Z]{26}$' } }
    post:
      tags: [Ledger]
      summary: Reopen a closed accounting period
      operationId: reopenAccountingPeriod
      description: |
        Requires `ledger.period_manage` and a substantive reason (10 characters).
        Reopening changes numbers that have already been reported, and is
        audited accordingly. Treat it as destructive in the UI.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string, minLength: 10 } }
      responses:
        "200":
          description: Reopened.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountingPeriod" }
        "409":
          description: The period is not closed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/commission/rules:
    get:
      tags: [Commission]
      summary: List commission rules
      operationId: listCommissionRules
      description: |
        Requires `commission.read`. Ordered by specificity descending, which is
        the order the resolver considers them.
      parameters:
        - { name: commissionType, in: query, schema: { $ref: "#/components/schemas/CommissionType" } }
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, ACTIVE, INACTIVE] } }
        - { name: franchiseId, in: query, schema: { type: integer } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Rules.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/CommissionRule" } }
                  total: { type: integer }
    post:
      tags: [Commission]
      summary: Create a commission rule
      operationId: createCommissionRule
      description: |
        Requires `commission.config`. Scope fields are all optional; an unset
        field means "any". Specificity is computed by the server and cannot be
        supplied.

        A rule has no rates until a version is added.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommissionRuleRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommissionRule" }
        "409":
          description: The rule code is already in use.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/commission/rules/{ruleId}:
    parameters:
      - { name: ruleId, in: path, required: true, schema: { type: string, pattern: '^crl_[0-9A-HJKMNP-TV-Z]{26}$' } }
    get:
      tags: [Commission]
      summary: Get a rule with its version history
      operationId: getCommissionRule
      description: Requires `commission.read`.
      responses:
        "200":
          description: Rule and versions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rule: { $ref: "#/components/schemas/CommissionRule" }
                  versions: { type: array, items: { $ref: "#/components/schemas/CommissionRuleVersion" } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/commission/rules/{ruleId}/versions:
    parameters:
      - { name: ruleId, in: path, required: true, schema: { type: string, pattern: '^crl_[0-9A-HJKMNP-TV-Z]{26}$' } }
    post:
      tags: [Commission]
      summary: Add an effective-dated version
      operationId: createCommissionRuleVersion
      description: |
        Requires `commission.config`. Rates change by adding a version, never by
        editing: a version that has produced a calculation is frozen by the
        database. The predecessor is closed automatically.

        Slab bands must start at 0, be contiguous, and end open-ended.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommissionVersionRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommissionRuleVersion" }
        "409":
          description: The slab table has a gap, an overlap, or an unbounded middle band.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/commission/simulate:
    post:
      tags: [Commission]
      summary: Simulate a commission calculation
      operationId: simulateCommission
      description: |
        Requires `commission.simulate`. Writes nothing.

        Runs the same resolver and the same calculator as a real posting, so a
        preview cannot disagree with what will be paid. `candidates` lists every
        matching rule with `selected: true` on the winner, which is what lets a
        franchise be shown *why* a rule applied.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommissionSimulateRequest" }
      responses:
        "200":
          description: |
            The simulated outcome. `matched: false` with an explanation is a
            normal result, not an error — it means no rule covers these facts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommissionSimulateResult" }

        "422":
          description: The commission type is missing, or the slab table is invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /api/v1/commission/calculations:
    get:
      tags: [Commission]
      summary: List commission calculations
      operationId: listCommissionCalculations
      description: Requires `commission.read`.
      parameters:
        - { name: commissionType, in: query, schema: { $ref: "#/components/schemas/CommissionType" } }
        - { name: status, in: query, schema: { type: string, enum: [CALCULATED, POSTED, REVERSED, CANCELLED] } }
        - { name: franchiseId, in: query, schema: { type: integer } }
        - { name: cursor, in: query, schema: { type: integer } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Calculations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/CommissionCalculation" } }

  /api/v1/commission/calculations/{calculationId}:
    parameters:
      - { name: calculationId, in: path, required: true, schema: { type: string, pattern: '^ccl_[0-9A-HJKMNP-TV-Z]{26}$' } }
    get:
      tags: [Commission]
      summary: Get a calculation with its arithmetic trace
      operationId: getCommissionCalculation
      description: |
        Requires `commission.read`. `calculationTrace` explains how the number
        was reached, step by step; render it verbatim.
      responses:
        "200":
          description: The calculation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommissionCalculation" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/commission/calculations/{calculationId}/post:
    parameters:
      - { name: calculationId, in: path, required: true, schema: { type: string, pattern: '^ccl_[0-9A-HJKMNP-TV-Z]{26}$' } }
    post:
      tags: [Commission]
      summary: Post a calculated commission to the ledger
      operationId: postCommission
      description: |
        Requires `commission.post`. Credits Commission Payable (the accrual
        account), not the franchise's own payable — that transfer happens when a
        settlement containing this commission is approved.
      responses:
        "200":
          description: Posted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommissionCalculation" }
        "409":
          description: Already posted or reversed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/commission/calculations/{calculationId}/reverse:
    parameters:
      - { name: calculationId, in: path, required: true, schema: { type: string, pattern: '^ccl_[0-9A-HJKMNP-TV-Z]{26}$' } }
    post:
      tags: [Commission]
      summary: Reverse a posted commission
      operationId: reverseCommission
      description: |
        Requires `commission.reverse` and a substantive reason. Mirrors the
        ledger entries and writes a negative commission entry, so the franchise's
        history shows both the earning and its removal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string, minLength: 10 } }
      responses:
        "200":
          description: Reversed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommissionCalculation" }
        "409":
          description: Not posted, or already reversed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /api/v1/cod/obligations:
    get:
      tags: [COD]
      summary: List COD obligations
      operationId: listCODObligations
      description: |
        Requires `cod.read`. `status` says where the cash is in the custody
        chain; `custodianType`/`custodianId` say who is holding it.
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/CODStatus" } }
        - { name: custodianType, in: query, schema: { type: string, enum: [AGENT, OPERATING_UNIT, FRANCHISE, HEAD_OFFICE] } }
        - { name: custodianId, in: query, schema: { type: integer } }
        - { name: franchiseId, in: query, schema: { type: integer } }
        - { name: awb, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: integer } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: COD obligations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/CODObligation" } }

  /api/v1/cod/obligations/{obligationId}:
    parameters:
      - { name: obligationId, in: path, required: true, schema: { type: string, pattern: '^cod_[0-9A-HJKMNP-TV-Z]{26}$' } }
    get:
      tags: [COD]
      summary: Get a COD obligation with its collections
      operationId: getCODObligation
      description: Requires `cod.read`.
      responses:
        "200":
          description: The obligation and its collection history.
          content:
            application/json:
              schema:
                type: object
                properties:
                  obligation: { $ref: "#/components/schemas/CODObligation" }
                  collections: { type: array, items: { $ref: "#/components/schemas/CODCollection" } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/cod/summary:
    get:
      tags: [COD]
      summary: COD position summary
      operationId: getCODSummary
      description: Requires `cod.read`. One pass over obligations rather than a query per tile.
      parameters:
        - { name: franchiseId, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Counts and amounts by custody stage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CODSummary" }

  /api/v1/cod/custody/{partyType}/{partyId}:
    parameters:
      - { name: partyType, in: path, required: true, schema: { type: string, enum: [AGENT, OPERATING_UNIT, FRANCHISE] } }
      - { name: partyId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [COD]
      summary: What a party is holding, cross-checked
      operationId: getCODCustodyPosition
      description: |
        Requires `cod.read`.

        The holding is derived twice — once from the obligation rows and once
        from the ledger — by different code paths. `reconciled: false` means the
        operational record and the books have diverged, which is a finance
        incident rather than a rounding difference.
      responses:
        "200":
          description: The custody position.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CODCustodyPosition" }

  /api/v1/cod/collections:
    post:
      tags: [COD]
      summary: Record COD collected at the doorstep
      operationId: recordCODCollection
      description: |
        Requires `cod.collect`.

        The most-retried finance call in the platform. Send `X-Device-Id` and
        `X-Device-Event-Id`; a replay returns 200 with `duplicate: true` and the
        original collection, meaning the money was banked exactly once.

        Posts `DR COD Receivable — agent` / `CR COD Payable to Consignors`.
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/DeviceEventId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shipmentId, amountMinor, paymentMode]
              properties:
                shipmentId: { type: string, pattern: '^shp_[0-9A-HJKMNP-TV-Z]{26}$' }
                amountMinor: { type: integer, minimum: 1, example: 200000 }
                paymentMode: { type: string, enum: [CASH, UPI, CARD, WALLET, NET_BANKING, CHEQUE, DEMAND_DRAFT, OTHER] }
                reference: { type: string, description: Required for anything other than CASH. }
                collectedAt: { type: string, format: date-time }
      responses:
        "200":
          description: Collected, or a recognised replay.
          content:
            application/json:
              schema:
                type: object
                properties:
                  obligation: { $ref: "#/components/schemas/CODObligation" }
                  collection: { $ref: "#/components/schemas/CODCollection" }
                  duplicate: { type: boolean }
        "409":
          description: Already collected, or the shipment carries no COD.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/cod/transfers:
    post:
      tags: [COD]
      summary: Declare a COD custody hand-off
      operationId: declareCODTransfer
      description: |
        Requires `cod.transfer`. The giver's half of a two-sided hand-off; until
        the receiver accepts, the money remains the giver's liability.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromType, fromId, toType, toId, obligationIds]
              properties:
                fromType: { type: string, enum: [AGENT, OPERATING_UNIT, FRANCHISE, HEAD_OFFICE] }
                fromId: { type: integer }
                toType: { type: string, enum: [AGENT, OPERATING_UNIT, FRANCHISE, HEAD_OFFICE] }
                toId: { type: integer }
                obligationIds: { type: array, items: { type: string } }
                notes: { type: string }
      responses:
        "201":
          description: Declared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  transfer: { $ref: "#/components/schemas/CODCustodyTransfer" }
                  items: { type: array, items: { type: object } }
        "409":
          description: An obligation is not held by this party, or is already in an open transfer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/cod/transfers/{transferId}/accept:
    parameters:
      - { name: transferId, in: path, required: true, schema: { type: string, pattern: '^cdt_[0-9A-HJKMNP-TV-Z]{26}$' } }
    post:
      tags: [COD]
      summary: Accept a COD hand-off
      operationId: acceptCODTransfer
      description: |
        Requires `cod.accept`. The receiver's half.

        If `acceptedMinor` differs from what was declared, `varianceReason` is
        mandatory. A shortfall moves to COD Shortage Recoverable against the
        declaring party rather than disappearing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acceptedMinor]
              properties:
                acceptedMinor: { type: integer, minimum: 0 }
                varianceReason: { type: string }
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CODCustodyTransfer" }
        "422":
          description: The counted amount differs from the declaration and no reason was given.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/cod/reconciliations:
    post:
      tags: [COD]
      summary: Open a COD reconciliation
      operationId: openCODReconciliation
      description: |
        Requires `cod.reconcile`. Seeds one item per obligation the party holds.

        Only one open reconciliation per party: two simultaneous counts of the
        same cash would each see the other's uncounted rows and both look short.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partyType, partyId, periodStart, periodEnd]
              properties:
                partyType: { type: string, enum: [AGENT, OPERATING_UNIT, FRANCHISE] }
                partyId: { type: integer }
                periodStart: { type: string, format: date }
                periodEnd: { type: string, format: date }
                notes: { type: string }
      responses:
        "201":
          description: Opened, with the expected holdings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reconciliation: { $ref: "#/components/schemas/CODReconciliation" }
                  expected: { type: array, items: { type: object } }
        "409":
          description: This party already has an open reconciliation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/cod/reconciliations/{reconciliationId}/count:
    parameters:
      - { name: reconciliationId, in: path, required: true, schema: { type: string, pattern: '^cdr_[0-9A-HJKMNP-TV-Z]{26}$' } }
    post:
      tags: [COD]
      summary: Record a counted line
      operationId: recordCODCount
      description: Requires `cod.reconcile`. The outcome is derived from the counted amount.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [obligationId, countedMinor]
              properties:
                obligationId: { type: string }
                countedMinor: { type: integer, minimum: 0 }
                notes: { type: string }
      responses:
        "200":
          description: The counted item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CODReconciliationItem" }

        "409":
          description: The reconciliation is already completed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /api/v1/cod/reconciliations/{reconciliationId}/complete:
    parameters:
      - { name: reconciliationId, in: path, required: true, schema: { type: string, pattern: '^cdr_[0-9A-HJKMNP-TV-Z]{26}$' } }
    post:
      tags: [COD]
      summary: Complete a COD reconciliation
      operationId: completeCODReconciliation
      description: |
        Requires `cod.reconcile`. Totals the count and posts any variance. A
        shortage or excess requires a reason and results in
        `COMPLETED_WITH_VARIANCE`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { varianceReason: { type: string } }
      responses:
        "200":
          description: Completed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CODReconciliation" }
        "422":
          description: A variance was found and no reason was given.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/cod/remittances:
    post:
      tags: [COD]
      summary: Create a COD remittance
      operationId: createCODRemittance
      description: |
        Requires `cod.remit`. Records money leaving a party. The obligations are
        not marked remitted until the remittance is confirmed — initiating a
        bank transfer is not the same as the money arriving.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromType, fromId, beneficiaryType, obligationIds, paymentMode]
              properties:
                fromType: { type: string, enum: [OPERATING_UNIT, FRANCHISE, HEAD_OFFICE] }
                fromId: { type: integer }
                beneficiaryType: { type: string, enum: [HEAD_OFFICE, CONSIGNOR, CUSTOMER] }
                beneficiaryId: { type: integer }
                obligationIds: { type: array, items: { type: string } }
                paymentMode: { type: string, enum: [BANK_TRANSFER, UPI, CHEQUE, CASH_DEPOSIT, ADJUSTMENT, OTHER] }
                reference: { type: string }
                paidOn: { type: string, format: date }
      responses:
        "201":
          description: Initiated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CODRemittance" }

        "409":
          description: An obligation is not in a remittable state, or nothing is left to remit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /api/v1/cod/remittances/{remittanceId}/confirm:
    parameters:
      - { name: remittanceId, in: path, required: true, schema: { type: string, pattern: '^cdm_[0-9A-HJKMNP-TV-Z]{26}$' } }
    post:
      tags: [COD]
      summary: Confirm a COD remittance arrived
      operationId: confirmCODRemittance
      description: |
        Requires `cod.remit`. Posts the movement and marks the obligations
        remitted.

        Remitting to head office clears the holder's receivable; it does **not**
        clear the liability to the consignor, which is discharged only by a
        remittance to them.
      responses:
        "200":
          description: Confirmed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CODRemittance" }
        "409":
          description: Not in an initiated state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/cod/adjustments:
    post:
      tags: [COD]
      summary: Raise a COD adjustment (maker)
      operationId: requestCODAdjustment
      description: |
        Requires `cod.adjust_request`. Moves no money — an adjustment only posts
        once a **different** person approves it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adjustmentType, amountMinor, reason]
              properties:
                obligationId: { type: string }
                adjustmentType: { type: string, enum: [SHORTAGE_RECOVERY, SHORTAGE_WRITE_OFF, EXCESS_REFUND, EXCESS_RETAINED, WAIVER, CORRECTION, DISPUTE_RESOLUTION] }
                amountMinor: { type: integer }
                liablePartyType: { type: string, enum: [AGENT, OPERATING_UNIT, FRANCHISE, HEAD_OFFICE, CUSTOMER] }
                liablePartyId: { type: integer }
                reason: { type: string, minLength: 10 }
      responses:
        "201":
          description: Raised, pending approval.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CODAdjustment" }

        "422":
          description: The reason is too short, or the amount is zero.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /api/v1/cod/adjustments/{adjustmentId}/approve:
    parameters:
      - { name: adjustmentId, in: path, required: true, schema: { type: string, pattern: '^cda_[0-9A-HJKMNP-TV-Z]{26}$' } }
    post:
      tags: [COD]
      summary: Approve and post a COD adjustment (checker)
      operationId: approveCODAdjustment
      description: |
        Requires `cod.adjust_approve` **and** a different user from the one who
        raised it. Enforced in the service, in the SQL, and by a CHECK
        constraint, so it cannot be bypassed.
      responses:
        "200":
          description: Approved and posted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CODAdjustment" }
        "403":
          description: The approver raised this adjustment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/cod/disputes:
    post:
      tags: [COD]
      summary: Raise a COD dispute
      operationId: raiseCODDispute
      description: |
        Requires `cod.dispute`. Parks a contested amount without blocking the
        rest: other shipments in the same hand-in still settle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [obligationId, raisedByType, disputedMinor, category, description]
              properties:
                obligationId: { type: string }
                raisedByType: { type: string, enum: [AGENT, OPERATING_UNIT, FRANCHISE, CUSTOMER, HEAD_OFFICE] }
                raisedById: { type: integer }
                disputedMinor: { type: integer, minimum: 1 }
                category: { type: string, enum: [AMOUNT_MISMATCH, NOT_COLLECTED, ALREADY_REMITTED, FAKE_ENTRY, CUSTOMER_CLAIM, OTHER] }
                description: { type: string, minLength: 10 }
      responses:
        "201":
          description: Raised.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CODDispute" }
        "409":
          description: This obligation already has an open dispute.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/cod/disputes/{disputeId}/resolve:
    parameters:
      - { name: disputeId, in: path, required: true, schema: { type: string, pattern: '^cdd_[0-9A-HJKMNP-TV-Z]{26}$' } }
    post:
      tags: [COD]
      summary: Resolve a COD dispute
      operationId: resolveCODDispute
      description: |
        Requires `cod.dispute`. Records the outcome. Any money movement is a
        separate, approved adjustment — resolving a dispute and moving money are
        different authorisations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, resolution]
              properties:
                status: { type: string, enum: [RESOLVED, REJECTED] }
                resolution: { type: string, minLength: 10 }
                resolvedMinor: { type: integer }
                adjustmentId: { type: string }
      responses:
        "200":
          description: Resolved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CODDispute" }
        "409":
          description: The dispute is already closed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /api/v1/settlements:
    get:
      tags: [Settlement]
      summary: List settlements
      operationId: listSettlements
      description: Requires `settlement.read`.
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/SettlementStatus" } }
        - { name: franchiseId, in: query, schema: { type: integer } }
        - { name: cursor, in: query, schema: { type: integer } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Settlements.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Settlement" } }
    post:
      tags: [Settlement]
      summary: Generate a settlement for a franchise and period
      operationId: generateSettlement
      description: |
        Requires `settlement.calculate`.

        Idempotent: a franchise and period that already has a settlement returns
        **200** with `replayed: true` rather than 201. Nothing was created, so do
        not show a "created" confirmation.

        Recalculating over unchanged sources produces identical lines and an
        identical `calculationHash`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [franchiseId, periodStart, periodEnd]
              properties:
                franchiseId: { type: string, pattern: '^frn_[0-9A-HJKMNP-TV-Z]{26}$' }
                periodType: { type: string, enum: [WEEKLY, FORTNIGHTLY, MONTHLY, CUSTOM] }
                periodStart: { type: string, format: date }
                periodEnd: { type: string, format: date }
                notes: { type: string }
      responses:
        "200":
          description: An existing settlement for this period was returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettlementResult" }
        "201":
          description: Generated and calculated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettlementResult" }

        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The period ends before it starts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /api/v1/settlements/{settlementId}:
    parameters:
      - { name: settlementId, in: path, required: true, schema: { type: string, pattern: '^stl_[0-9A-HJKMNP-TV-Z]{26}$' } }
    get:
      tags: [Settlement]
      summary: Get a settlement with lines, approvals and payments
      operationId: getSettlement
      description: |
        Requires `settlement.read`. `byCategory` gives pre-grouped totals so a
        summary panel needs no client-side aggregation.

        Every line carries `sourceType` and `sourceId`; make them clickable
        through to the commission calculation or COD obligation behind them.
      responses:
        "200":
          description: The settlement.
          content:
            application/json:
              schema:
                type: object
                properties:
                  settlement: { $ref: "#/components/schemas/Settlement" }
                  lines: { type: array, items: { $ref: "#/components/schemas/SettlementLine" } }
                  byCategory: { type: array, items: { type: object } }
                  approvals: { type: array, items: { type: object } }
                  payments: { type: array, items: { type: object } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/settlements/{settlementId}/recalculate:
    parameters:
      - { name: settlementId, in: path, required: true, schema: { type: string, pattern: '^stl_[0-9A-HJKMNP-TV-Z]{26}$' } }
    post:
      tags: [Settlement]
      summary: Rebuild a settlement from its sources
      operationId: recalculateSettlement
      description: |
        Requires `settlement.calculate`. Only while `DRAFT`, `CALCULATED` or
        `UNDER_REVIEW`.

        An approved settlement never recalculates — it returns
        `SETTLEMENT_FROZEN`. Corrections after approval are adjustments.
      responses:
        "200":
          description: Recalculated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettlementResult" }
        "409":
          description: The settlement is approved or beyond.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/settlements/{settlementId}/submit:
    parameters:
      - { name: settlementId, in: path, required: true, schema: { type: string, pattern: '^stl_[0-9A-HJKMNP-TV-Z]{26}$' } }
    post:
      tags: [Settlement]
      summary: Submit a settlement for review
      operationId: submitSettlement
      description: Requires `settlement.submit`. Moves `CALCULATED` to `UNDER_REVIEW`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { comment: { type: string } }
      responses:
        "200":
          description: Submitted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settlement" }

        "409":
          description: The settlement is not in a calculated state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /api/v1/settlements/{settlementId}/approve:
    parameters:
      - { name: settlementId, in: path, required: true, schema: { type: string, pattern: '^stl_[0-9A-HJKMNP-TV-Z]{26}$' } }
    post:
      tags: [Settlement]
      summary: Approve a settlement (checker)
      operationId: approveSettlement
      description: |
        Requires `settlement.approve` **and** a different user from the one who
        calculated it.

        Approval posts the accrued commission to the franchise's own payable
        account. A negative net posts to Franchise Receivable instead, because
        the franchise owes head office.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { comment: { type: string } }
      responses:
        "200":
          description: Approved and posted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settlement" }
        "403":
          description: The approver calculated this settlement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/settlements/{settlementId}/payments:
    parameters:
      - { name: settlementId, in: path, required: true, schema: { type: string, pattern: '^stl_[0-9A-HJKMNP-TV-Z]{26}$' } }
    post:
      tags: [Settlement]
      summary: Record a settlement payment
      operationId: paySettlement
      description: |
        Requires `settlement.pay`. Only an approved settlement can be paid.

        Direction follows the net: a positive net pays the franchise
        (`OUTBOUND`), a negative net collects from them (`INBOUND`). Paying more
        than the outstanding amount is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountMinor, paymentMode]
              properties:
                amountMinor: { type: integer, minimum: 1 }
                paymentMode: { type: string, enum: [BANK_TRANSFER, UPI, CHEQUE, CASH, ADJUSTMENT, OTHER] }
                reference: { type: string }
                paidOn: { type: string, format: date }
      responses:
        "201":
          description: Recorded; the settlement advances to PARTIALLY_PAID or PAID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment: { type: object }
                  settlement: { $ref: "#/components/schemas/Settlement" }
        "409":
          description: Not approved, or the payment exceeds the outstanding amount.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/settlements/{settlementId}/cancel:
    parameters:
      - { name: settlementId, in: path, required: true, schema: { type: string, pattern: '^stl_[0-9A-HJKMNP-TV-Z]{26}$' } }
    post:
      tags: [Settlement]
      summary: Cancel a settlement before approval
      operationId: cancelSettlement
      description: |
        Requires `settlement.cancel` and a substantive reason. Only before
        approval; afterwards the correction is an adjustment.

        Cancelling releases the commission it swept back to the pool, so a fresh
        statement picks it up rather than stranding it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string, minLength: 10 } }
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settlement" }
        "409":
          description: Already approved; raise an adjustment instead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/invoices:
    get:
      tags: [Billing]
      summary: List invoices
      operationId: listInvoices
      description: Requires `invoice.read`.
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/InvoiceStatus" } }
        - { name: customerId, in: query, schema: { type: integer } }
        - { name: cursor, in: query, schema: { type: integer } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Invoices.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Invoice" } }
    post:
      tags: [Billing]
      summary: Draft an invoice from unbilled shipments
      operationId: draftInvoice
      description: |
        Requires `invoice.create`.

        Creates a **draft** only. No statutory number is allocated and nothing is
        posted until the invoice is issued, so an abandoned draft does not burn a
        number. Until issued, `invoiceNumber` is a `DRAFT-…` placeholder that must
        not be displayed as a real number.

        Lines are copied from each shipment's immutable charge snapshot, never
        recomputed from a rate card.

        Tax is configuration: two 9% components make Indian intra-state GST, one
        18% component makes inter-state.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftInvoiceRequest" }
      responses:
        "201":
          description: Drafted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceResult" }
        "409":
          description: The customer has no unbilled shipments in this period.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/invoices/{invoiceId}:
    parameters:
      - { name: invoiceId, in: path, required: true, schema: { type: string, pattern: '^inv_[0-9A-HJKMNP-TV-Z]{26}$' } }
    get:
      tags: [Billing]
      summary: Get an invoice with lines and tax breakdown
      operationId: getInvoice
      description: Requires `invoice.read`.
      responses:
        "200":
          description: The invoice.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceResult" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/invoices/{invoiceId}/issue:
    parameters:
      - { name: invoiceId, in: path, required: true, schema: { type: string, pattern: '^inv_[0-9A-HJKMNP-TV-Z]{26}$' } }
    post:
      tags: [Billing]
      summary: Issue a draft invoice
      operationId: issueInvoice
      description: |
        Requires `invoice.issue`. Allocates the statutory number and posts the
        receivable, revenue and tax.

        Numbers look like `INV/2026-27/000042` and are gapless within a financial
        year even under concurrent issue. Once issued the invoice is immutable —
        corrections are credit or debit notes.
      responses:
        "200":
          description: Issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "409":
          description: Already issued, or the total is zero.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/invoices/{invoiceId}/payments:
    parameters:
      - { name: invoiceId, in: path, required: true, schema: { type: string, pattern: '^inv_[0-9A-HJKMNP-TV-Z]{26}$' } }
    post:
      tags: [Billing]
      summary: Record a customer payment
      operationId: payInvoice
      description: |
        Requires `invoice.payment`. Idempotent on `reference`: a gateway
        retrying a webhook with the same reference returns the original payment
        rather than banking twice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountMinor, paymentMode]
              properties:
                amountMinor: { type: integer, minimum: 1 }
                paymentMode: { type: string, enum: [BANK_TRANSFER, UPI, CARD, CHEQUE, CASH, WALLET, ADJUSTMENT, OTHER] }
                reference: { type: string }
                receivedOn: { type: string, format: date }
      responses:
        "200":
          description: Recorded, or a recognised replay.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment: { type: object }
                  invoice: { $ref: "#/components/schemas/Invoice" }
        "409":
          description: Already settled, or the payment exceeds the outstanding amount.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/invoices/outstanding/{customerId}:
    parameters:
      - { name: customerId, in: path, required: true, schema: { type: string, pattern: '^cus_[0-9A-HJKMNP-TV-Z]{26}$' } }
    get:
      tags: [Billing]
      summary: What a customer owes
      operationId: getCustomerOutstanding
      description: |
        Requires `invoice.read`. A SUM over open invoices computed at read time,
        never a stored balance.
      responses:
        "200":
          description: Outstanding and overdue amounts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  outstandingMinor: { type: integer }
                  overdueMinor: { type: integer }
                  invoiceCount: { type: integer }
                  currency: { type: string }

  /api/v1/credit-notes:
    post:
      tags: [Billing]
      summary: Raise a credit or debit note (maker)
      operationId: raiseCreditNote
      description: |
        Requires `creditnote.create`. Creates a draft; nothing is posted until a
        **different** person issues it.

        A credit note cannot exceed the outstanding amount on the invoice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoiceId, reasonCode, reason, amountMinor]
              properties:
                invoiceId: { type: string, pattern: '^inv_[0-9A-HJKMNP-TV-Z]{26}$' }
                noteType: { type: string, enum: [CREDIT, DEBIT], default: CREDIT }
                reasonCode: { type: string, enum: [BILLING_ERROR, SERVICE_FAILURE, RATE_CORRECTION, GOODWILL, RETURN, TAX_CORRECTION, SHORT_SHIPMENT, OTHER] }
                reason: { type: string, minLength: 5 }
                amountMinor: { type: integer, minimum: 1 }
                taxMinor: { type: integer }
                issueDate: { type: string, format: date }
      responses:
        "201":
          description: Drafted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditNote" }
        "409":
          description: The credit exceeds the outstanding amount.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/credit-notes/{noteId}/issue:
    parameters:
      - { name: noteId, in: path, required: true, schema: { type: string, pattern: '^crn_[0-9A-HJKMNP-TV-Z]{26}$' } }
    post:
      tags: [Billing]
      summary: Approve, number and post a credit or debit note (checker)
      operationId: issueCreditNote
      description: |
        Requires `creditnote.approve` **and** a different user from the one who
        raised it. Anything that reduces a receivable needs a second person.

        A credit note reduces what the invoice still asks for and can settle it
        outright without any payment.
      responses:
        "200":
          description: Issued and posted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditNote" }
        "403":
          description: The issuer raised this note.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  # ------------------------------------------------------- Partner API --
  /api/v1/partner/whoami:
    get:
      tags: [Partner API]
      summary: Describe the calling API key
      operationId: partnerWhoami
      security: [{ partnerKey: [] }]
      description: |
        Returns the key's name, organization, scopes and rate limit. Needs no
        scope: it reveals only what the caller already holds, and it is how an
        integrator confirms their credential without opening a support ticket.
      responses:
        "200":
          description: The key's own description.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerIdentity" }
        "401":
          description: The credential is missing, malformed, revoked, suspended or expired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/partner/serviceability:
    post:
      tags: [Partner API]
      summary: Check serviceability between two pincodes
      operationId: partnerServiceability
      security: [{ partnerKey: [] }]
      description: |
        Requires the `serviceability:read` scope.

        The response omits the routing explanation the internal endpoint can
        return: it names internal rules and facility codes, which is operational
        detail another company has no business seeing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [originPincode, destinationPincode, serviceCode]
              properties:
                originPincode: { type: string, pattern: '^[1-9][0-9]{5}$' }
                destinationPincode: { type: string, pattern: '^[1-9][0-9]{5}$' }
                serviceCode: { type: string }
                at: { type: string, format: date-time }
      responses:
        "200":
          description: The routing decision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceabilityResult" }
        "403":
          $ref: "#/components/responses/PartnerScopeMissing"
        "422":
          description: The request failed validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/partner/quotes:
    post:
      tags: [Partner API]
      summary: Price a shipment
      operationId: partnerQuote
      security: [{ partnerKey: [] }]
      description: |
        Requires the `pricing:read` scope. Computed by the same engine and the
        same rate card version as the internal quote: a partner and a branch
        pricing the same parcel must never see different numbers.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteRequest" }
      responses:
        "200":
          description: The priced quote, with its full breakdown.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
        "403":
          $ref: "#/components/responses/PartnerScopeMissing"
        "422":
          description: The request failed validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/partner/shipments:
    post:
      tags: [Partner API]
      summary: Book a shipment
      operationId: partnerCreateShipment
      security: [{ partnerKey: [] }]
      description: |
        Requires the `shipment:create` scope.

        **`Idempotency-Key` is mandatory here**, unlike on the internal
        endpoint. A clerk who double-submits sees the duplicate and cancels it;
        an automated retry loop does not, so an unkeyed retry after a timeout
        would quietly produce two parcels and two invoices. A repeat with the
        same key returns the original response with `Idempotent-Replay: true`;
        the same key with a different body is rejected.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingRequest" }
      responses:
        "201":
          description: Booked, or the replay of an earlier identical request.
          headers:
            Idempotent-Replay:
              description: Present and `true` when this is the replay of an earlier call.
              schema: { type: string }
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }
        "400":
          description: The `Idempotency-Key` header is missing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403":
          $ref: "#/components/responses/PartnerScopeMissing"
        "409":
          description: The same key was reused with a different body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          description: The request failed validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/partner/shipments/{shipmentId}:
    parameters:
      - name: shipmentId
        in: path
        required: true
        schema: { type: string, pattern: '^shp_[0-9A-HJKMNP-TV-Z]{26}$' }
    get:
      tags: [Partner API]
      summary: Read a shipment
      operationId: partnerGetShipment
      security: [{ partnerKey: [] }]
      description: |
        Requires the `shipment:read` scope. A shipment belonging to another
        organization returns **404**, not 403, so the endpoint cannot be used to
        confirm that an identifier exists somewhere.
      responses:
        "200":
          description: The shipment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }
        "403":
          $ref: "#/components/responses/PartnerScopeMissing"
        "404":
          description: No such shipment in this organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/partner/shipments/{shipmentId}/cancel:
    parameters:
      - name: shipmentId
        in: path
        required: true
        schema: { type: string, pattern: '^shp_[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      tags: [Partner API]
      summary: Cancel a shipment
      operationId: partnerCancelShipment
      security: [{ partnerKey: [] }]
      description: |
        Requires the `shipment:cancel` scope. Legal only while the parcel has
        not physically moved; the shipment row is locked and the transition is a
        compare-and-swap, so two concurrent cancellations produce one
        cancellation and one conflict.

        The resulting audit record and shipment event are attributed to the API
        key — `actor_type` `API_KEY` and `PARTNER` respectively — with no user,
        because there is no person behind the credential.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }
        "403":
          $ref: "#/components/responses/PartnerScopeMissing"
        "404":
          description: No such shipment in this organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: The shipment has moved and can no longer be cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/partner/shipments/{shipmentId}/label:
    parameters:
      - name: shipmentId
        in: path
        required: true
        schema: { type: string, pattern: '^shp_[0-9A-HJKMNP-TV-Z]{26}$' }
    get:
      tags: [Partner API]
      summary: Fetch the shipping label
      operationId: partnerGetLabel
      security: [{ partnerKey: [] }]
      description: |
        Requires the `label:read` scope. `format=ZPL` returns ZPL II as
        `text/plain` for a thermal printer; the default returns the structured
        label as JSON. A cancelled shipment produces no label.
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [JSON, ZPL], default: JSON }
      responses:
        "200":
          description: The label.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
            text/plain:
              schema: { type: string }
        "403":
          $ref: "#/components/responses/PartnerScopeMissing"
        "404":
          description: No such shipment in this organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: The shipment is cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/partner/shipments/{shipmentId}/pod:
    parameters:
      - name: shipmentId
        in: path
        required: true
        schema: { type: string, pattern: '^shp_[0-9A-HJKMNP-TV-Z]{26}$' }
    get:
      tags: [Partner API]
      summary: Fetch the proof of delivery
      operationId: partnerGetPOD
      security: [{ partnerKey: [] }]
      description: |
        Requires the `pod:read` scope. Addressed by shipment rather than by POD
        identifier, because a partner knows the shipment it booked and has no
        way to learn a POD id otherwise.
      responses:
        "200":
          description: The delivery evidence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProofOfDelivery" }
        "403":
          $ref: "#/components/responses/PartnerScopeMissing"
        "404":
          description: The shipment does not exist here, or has no delivery POD yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/partner/tracking/{awb}:
    parameters:
      - name: awb
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Partner API]
      summary: Track by AWB
      operationId: partnerTrack
      security: [{ partnerKey: [] }]
      description: |
        Requires the `tracking:read` scope.

        Unlike the unauthenticated `/api/v1/track/{awb}`, this is confined to
        the key's own organization: the AWB is confirmed to belong to the tenant
        before anything is returned, and a miss is an indistinguishable 404.
      responses:
        "200":
          description: The tracking timeline.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackingResult" }
        "403":
          $ref: "#/components/responses/PartnerScopeMissing"
        "404":
          description: No such AWB in this organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/partner/pickups:
    post:
      tags: [Partner API]
      summary: Raise a pickup request
      operationId: partnerCreatePickup
      security: [{ partnerKey: [] }]
      description: |
        Requires the `pickup:create` scope. Either `addressId` or a full address
        must be supplied.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePickupRequest" }
      responses:
        "201":
          description: The pickup request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PickupRequest" }
        "403":
          $ref: "#/components/responses/PartnerScopeMissing"
        "422":
          description: The request failed validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/partner/pickups/{pickupId}:
    parameters:
      - name: pickupId
        in: path
        required: true
        schema: { type: string, pattern: '^pkr_[0-9A-HJKMNP-TV-Z]{26}$' }
    get:
      tags: [Partner API]
      summary: Read a pickup request
      operationId: partnerGetPickup
      security: [{ partnerKey: [] }]
      description: Requires the `pickup:read` scope.
      responses:
        "200":
          description: The pickup request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PickupRequest" }
        "403":
          $ref: "#/components/responses/PartnerScopeMissing"
        "404":
          description: No such pickup request in this organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/partner/webhooks/endpoints:
    get:
      tags: [Partner API]
      summary: List the organization's webhook endpoints
      operationId: partnerListEndpoints
      security: [{ partnerKey: [] }]
      description: Requires the `webhook:manage` scope. Never returns signing secrets.
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: The endpoints.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookEndpoint" }
                  pagination: { $ref: "#/components/schemas/OffsetPagination" }
        "403":
          $ref: "#/components/responses/PartnerScopeMissing"
    post:
      tags: [Partner API]
      summary: Register a webhook endpoint
      operationId: partnerCreateEndpoint
      security: [{ partnerKey: [] }]
      description: |
        Requires the `webhook:manage` scope, so an integration can configure
        itself without a person logging in.

        The URL must be HTTPS — payloads carry customer data — and the signing
        secret is returned **once**.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWebhookEndpointRequest" }
      responses:
        "201":
          description: Registered. The signing secret is in this response and nowhere else.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedWebhookEndpoint" }
        "403":
          $ref: "#/components/responses/PartnerScopeMissing"
        "422":
          description: The URL is not HTTPS, or an event type is unknown.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/partner/webhooks/deliveries:
    get:
      tags: [Partner API]
      summary: List delivery attempts
      operationId: partnerListDeliveries
      security: [{ partnerKey: [] }]
      description: |
        Requires the `webhook:manage` scope. Keyset paginated: pass the returned
        `nextCursor` as `cursor` for the following page.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, SENDING, DELIVERED, FAILED, DEAD_LETTER, CANCELLED] } }
        - { name: eventType, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: The deliveries, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDeliveryPage" }
        "403":
          $ref: "#/components/responses/PartnerScopeMissing"

  # ---------------------------------------------------------- API keys --
  /api/v1/api-keys:
    get:
      tags: [API keys]
      summary: List API keys
      operationId: listAPIKeys
      description: |
        Requires `apikey.read`. Returns the hint (the first characters of the
        secret) so two keys can be told apart, never the secret or its hash.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, SUSPENDED, REVOKED, EXPIRED] } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: The keys.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/APIKey" }
                  pagination: { $ref: "#/components/schemas/OffsetPagination" }
    post:
      tags: [API keys]
      summary: Issue an API key
      operationId: issueAPIKey
      description: |
        Requires `apikey.manage`.

        The plaintext secret is in this response and nowhere else — it is stored
        only as an Argon2id hash and cannot be recovered. A key with no scopes
        can do nothing, which is the safe default for one created by mistake.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueAPIKeyRequest" }
      responses:
        "201":
          description: Issued. Store the token now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedAPIKey" }
        "403":
          description: The caller does not hold `apikey.manage`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          description: An unknown scope, or a malformed CIDR.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/api-keys/{keyId}/revoke:
    parameters:
      - name: keyId
        in: path
        required: true
        schema: { type: string, pattern: '^apk_[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      tags: [API keys]
      summary: Revoke an API key
      operationId: revokeAPIKey
      description: |
        Requires `apikey.manage` and a reason.

        Irreversible. A database trigger refuses to move a revoked key back to
        any other status, because a leaked credential must never come back —
        issue a new one instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3 }
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/APIKey" }
        "404":
          description: No such key in this organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: Already revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/api-keys/{keyId}/suspend:
    parameters:
      - name: keyId
        in: path
        required: true
        schema: { type: string, pattern: '^apk_[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      tags: [API keys]
      summary: Suspend or resume an API key
      operationId: suspendAPIKey
      description: |
        Requires `apikey.manage`. Reversible, unlike revocation: a suspected
        leak that turns out to be a misconfigured proxy should not force a
        partner through a key rotation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suspend]
              properties:
                suspend: { type: boolean }
                reason: { type: string }
      responses:
        "200":
          description: The updated key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/APIKey" }
        "404":
          description: No such key in this organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: The key is revoked or expired, which is permanent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/api-keys/{keyId}/usage:
    parameters:
      - name: keyId
        in: path
        required: true
        schema: { type: string, pattern: '^apk_[0-9A-HJKMNP-TV-Z]{26}$' }
    get:
      tags: [API keys]
      summary: Summarise a key's traffic
      operationId: getAPIKeyUsage
      description: Requires `apikey.read`.
      parameters:
        - { name: hours, in: query, schema: { type: integer, default: 24, minimum: 1, maximum: 720 } }
      responses:
        "200":
          description: The summary and the most recent calls.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/APIKeyUsage" }
        "404":
          description: No such key in this organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  # ---------------------------------------------------------- Webhooks --
  /api/v1/webhooks/events:
    get:
      tags: [Webhooks]
      summary: List subscribable event types
      operationId: listWebhookEventTypes
      description: Requires `webhook.read`.
      responses:
        "200":
          description: The catalogue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookEventType" }

  /api/v1/webhooks/endpoints:
    get:
      tags: [Webhooks]
      summary: List webhook endpoints
      operationId: listWebhookEndpoints
      description: Requires `webhook.read`. Never returns signing secrets.
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: The endpoints.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookEndpoint" }
                  pagination: { $ref: "#/components/schemas/OffsetPagination" }
    post:
      tags: [Webhooks]
      summary: Register a webhook endpoint
      operationId: createWebhookEndpoint
      description: |
        Requires `webhook.manage`. The URL must be HTTPS. The signing secret is
        returned once and is not recoverable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWebhookEndpointRequest" }
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedWebhookEndpoint" }
        "422":
          description: The URL is not HTTPS, or an event type is unknown.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/webhooks/endpoints/{endpointId}/status:
    parameters:
      - name: endpointId
        in: path
        required: true
        schema: { type: string, pattern: '^whe_[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      tags: [Webhooks]
      summary: Pause, resume or disable an endpoint
      operationId: setWebhookEndpointStatus
      description: |
        Requires `webhook.manage`. Resuming clears the consecutive-failure
        counter, so an operator who has fixed their server gets the full failure
        budget back rather than the one attempt left over from before.

        An endpoint is paused automatically after 20 consecutive failures.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACTIVE, PAUSED, DISABLED] }
                reason: { type: string }
      responses:
        "200":
          description: The updated endpoint.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpoint" }
        "404":
          description: No such endpoint in this organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/webhooks/endpoints/{endpointId}/subscriptions:
    parameters:
      - name: endpointId
        in: path
        required: true
        schema: { type: string, pattern: '^whe_[0-9A-HJKMNP-TV-Z]{26}$' }
    get:
      tags: [Webhooks]
      summary: List an endpoint's subscriptions
      operationId: listWebhookSubscriptions
      description: Requires `webhook.read`.
      responses:
        "200":
          description: The subscriptions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookSubscription" }
    post:
      tags: [Webhooks]
      summary: Subscribe an endpoint to an event
      operationId: createWebhookSubscription
      description: |
        Requires `webhook.manage`. Idempotent: re-subscribing to an event the
        endpoint already holds reactivates it rather than failing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventType]
              properties:
                eventType: { $ref: "#/components/schemas/WebhookEventType" }
      responses:
        "200":
          description: The subscription.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookSubscription" }
        "404":
          description: No such endpoint in this organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          description: Unknown event type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/webhooks/endpoints/{endpointId}/subscriptions/{eventType}:
    parameters:
      - name: endpointId
        in: path
        required: true
        schema: { type: string, pattern: '^whe_[0-9A-HJKMNP-TV-Z]{26}$' }
      - name: eventType
        in: path
        required: true
        schema: { $ref: "#/components/schemas/WebhookEventType" }
    delete:
      tags: [Webhooks]
      summary: Unsubscribe an endpoint from an event
      operationId: deleteWebhookSubscription
      description: Requires `webhook.manage`.
      responses:
        "204":
          description: Unsubscribed.
        "404":
          description: No such endpoint in this organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/webhooks/deliveries:
    get:
      tags: [Webhooks]
      summary: List webhook deliveries
      operationId: listWebhookDeliveries
      description: |
        Requires `webhook.read`. Keyset paginated: this table grows with every
        event times every subscriber, and an operator debugging an integration
        always starts at the newest page.
      parameters:
        - { name: endpointId, in: query, schema: { type: string, pattern: '^whe_[0-9A-HJKMNP-TV-Z]{26}$' } }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, SENDING, DELIVERED, FAILED, DEAD_LETTER, CANCELLED] } }
        - { name: eventType, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: The deliveries, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDeliveryPage" }

  /api/v1/webhooks/deliveries/{deliveryId}:
    parameters:
      - name: deliveryId
        in: path
        required: true
        schema: { type: string, pattern: '^whd_[0-9A-HJKMNP-TV-Z]{26}$' }
    get:
      tags: [Webhooks]
      summary: Read one delivery
      operationId: getWebhookDelivery
      description: |
        Requires `webhook.read`. Includes the exact payload bytes that were
        signed and sent, which is what makes a signature dispute settleable.
      responses:
        "200":
          description: The delivery.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDeliveryDetail" }
        "404":
          description: No such delivery in this organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/webhooks/deliveries/{deliveryId}/attempts:
    parameters:
      - name: deliveryId
        in: path
        required: true
        schema: { type: string, pattern: '^whd_[0-9A-HJKMNP-TV-Z]{26}$' }
    get:
      tags: [Webhooks]
      summary: List every attempt on a delivery
      operationId: listWebhookAttempts
      description: |
        Requires `webhook.read`. Every attempt is recorded, including the
        failures: that history is the evidence in a "you never called us"
        dispute.
      responses:
        "200":
          description: The attempts, in order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookAttempt" }
        "404":
          description: No such delivery in this organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/webhooks/deliveries/{deliveryId}/replay:
    parameters:
      - name: deliveryId
        in: path
        required: true
        schema: { type: string, pattern: '^whd_[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      tags: [Webhooks]
      summary: Replay a delivery
      operationId: replayWebhookDelivery
      description: |
        Requires `webhook.replay`.

        A replay is a **new** delivery pointing at the original, not a reset of
        it: the original's attempt history is evidence and must survive. The
        payload and the `Webhook-Id` are copied byte for byte, so a consumer
        that already processed the event recognises it through their own dedupe.
      responses:
        "202":
          description: Queued for redelivery.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, pattern: '^whd_[0-9A-HJKMNP-TV-Z]{26}$' }
                  replayOf: { type: string }
                  status: { type: string }
                  eventType: { type: string }
                  eventId: { type: string }
        "404":
          description: No such delivery in this organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: The delivery is in flight; wait for it to finish.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  # --------------------------------------------------- Command centre --
  /api/v1/command-centre:
    get:
      tags: [Command centre]
      summary: Network overview
      operationId: commandCentreOverview
      description: |
        Requires `command.read`.

        A principal whose role is scoped to particular operating units is
        confined to them whether or not it asks: naming another unit is
        **403**, and a principal holding several scoped units must name one
        rather than being shown a partial total silently.

        The window defaults to the last 30 days and is capped at 400 days — a
        dashboard is not a reporting engine.
      parameters:
        - { $ref: "#/components/parameters/CommandFrom" }
        - { $ref: "#/components/parameters/CommandTo" }
        - { $ref: "#/components/parameters/CommandUnitId" }
        - name: serviceCode
          in: query
          schema: { type: string }
      responses:
        "200":
          description: The overview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandOverview" }
        "403":
          description: The caller lacks `command.read`, or named a unit outside its scope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          description: The window is backwards or wider than 400 days.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/command-centre/trend:
    get:
      tags: [Command centre]
      summary: Daily trend series
      operationId: commandCentreTrend
      description: |
        Requires `command.read`. One point per day from the rollup, so a 90-day
        chart reads 90 rows.
      parameters:
        - { $ref: "#/components/parameters/CommandFrom" }
        - { $ref: "#/components/parameters/CommandTo" }
        - { $ref: "#/components/parameters/CommandUnitId" }
      responses:
        "200":
          description: The series.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CommandDayPoint" }
                  consistency: { type: string }
        "403":
          description: The caller lacks `command.read`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/command-centre/units:
    get:
      tags: [Command centre]
      summary: Performance by operating unit
      operationId: commandCentreByUnit
      description: Requires `command.read`. Ranked by volume and bounded.
      parameters:
        - { $ref: "#/components/parameters/CommandFrom" }
        - { $ref: "#/components/parameters/CommandTo" }
        - { $ref: "#/components/parameters/CommandUnitId" }
        - name: unitType
          in: query
          schema:
            type: string
            enum: [HEAD_OFFICE, REGIONAL_HUB, TRANSIT_HUB, DELIVERY_HUB, COMPANY_BRANCH, FRANCHISE_BRANCH]
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 200 }
      responses:
        "200":
          description: The league table.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/UnitPerformance" }
        "403":
          description: The caller lacks `command.read`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/command-centre/services:
    get:
      tags: [Command centre]
      summary: Performance by courier service
      operationId: commandCentreByService
      description: Requires `command.read`.
      parameters:
        - { $ref: "#/components/parameters/CommandFrom" }
        - { $ref: "#/components/parameters/CommandTo" }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 200 }
      responses:
        "200":
          description: The per-service table.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ServicePerformance" }
        "403":
          description: The caller lacks `command.read`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/command-centre/backlog:
    get:
      tags: [Command centre]
      summary: Live backlog by facility
      operationId: commandCentreBacklog
      description: |
        Requires `command.read`.

        Counted at request time, by **custody** rather than by routing: the
        question is which facility is holding work, and a parcel routed through
        a hub it has not reached yet is not that hub's problem.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 200 }
      responses:
        "200":
          description: The distribution.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/UnitBacklog" }
                  consistency: { type: string }
        "403":
          description: The caller lacks `command.read`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/command-centre/snapshots:
    get:
      tags: [Command centre]
      summary: Captured backlog series
      operationId: commandCentreSnapshots
      description: |
        Requires `command.read`.

        The one sampled series in this module. Readings are captured on a timer,
        are append-only, and are swept after 90 days — a floor enforced by the
        database, not by the caller.
      parameters:
        - name: hours
          in: query
          schema: { type: integer, default: 24, minimum: 1, maximum: 2160 }
        - { $ref: "#/components/parameters/CommandUnitId" }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 200 }
      responses:
        "200":
          description: The captured series, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/OperationalSnapshot" }
                  consistency: { type: string }
        "403":
          description: The caller lacks `command.read`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }


  # ------------------------------------------------------ Notifications --
  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: List notifications
      operationId: listNotifications
      description: |
        Requires `notification.read`. Keyset paginated, newest first.

        A `SUPPRESSED` row carries `suppressedReason` — the message was never
        sent and this says why.
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/NotificationStatus" } }
        - { name: channel, in: query, schema: { $ref: "#/components/schemas/NotificationChannel" } }
        - { name: eventType, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: The outbox.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/NotificationSummary" }
                  nextCursor: { type: integer }

  /api/v1/notifications/health:
    get:
      tags: [Notifications]
      summary: Delivery health
      operationId: notificationHealth
      description: Requires `notification.read`.
      parameters:
        - { name: hours, in: query, schema: { type: integer, default: 24, maximum: 720 } }
      responses:
        "200":
          description: Counts by status, plus which channels have a sender.
          content:
            application/json:
              schema:
                type: object
                properties:
                  windowHours: { type: integer }
                  byStatus:
                    type: object
                    additionalProperties: { type: integer, format: int64 }
                  configuredChannels:
                    type: array
                    items: { type: string }

  /api/v1/notifications/channels:
    get:
      tags: [Notifications]
      summary: Which channels can send
      operationId: listNotificationChannels
      description: |
        Requires `notification.read`. A channel with no adapter suppresses every
        message on it — the most common cause of "notifications are not
        working", and invisible without this.
      responses:
        "200":
          description: The channels and whether each is configured.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        channel: { $ref: "#/components/schemas/NotificationChannel" }
                        configured: { type: boolean }

  /api/v1/notifications/{notificationId}:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema: { type: string, pattern: '^ntf_[0-9A-HJKMNP-TV-Z]{26}$' }
    get:
      tags: [Notifications]
      summary: Read one notification
      operationId: getNotification
      description: |
        Requires `notification.read`. Includes the rendered text that was sent
        and every delivery attempt, so an operator sees what the customer got
        rather than reconstructing it from the template.
      responses:
        "200":
          description: The notification and its attempts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationDetail" }
        "404":
          description: No such notification in this organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/notifications/{notificationId}/retry:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema: { type: string, pattern: '^ntf_[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      tags: [Notifications]
      summary: Retry a failed message
      operationId: retryNotification
      description: |
        Requires `notification.retry`. Resets the attempt budget, because an
        operator retrying by hand has presumably fixed whatever was wrong.
        Only a `FAILED` or `DEAD_LETTER` message can be retried.
      responses:
        "202":
          description: Queued again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string }
                  attemptCount: { type: integer }
        "404":
          description: No such notification in this organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: The message has already been sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/notifications/{notificationId}/cancel:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema: { type: string, pattern: '^ntf_[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      tags: [Notifications]
      summary: Cancel an unsent message
      operationId: cancelNotification
      description: Requires `notification.retry`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string }
        "404":
          description: No such notification in this organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: The message has already been sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/notifications/templates:
    get:
      tags: [Notifications]
      summary: List templates
      operationId: listNotificationTemplates
      description: Requires `notification.read`.
      parameters:
        - { name: eventType, in: query, schema: { type: string } }
        - { name: channel, in: query, schema: { $ref: "#/components/schemas/NotificationChannel" } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: The templates.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/NotificationTemplate" }
    post:
      tags: [Notifications]
      summary: Create a template
      operationId: createNotificationTemplate
      description: |
        Requires `notification.template`.

        The variable list is derived from the body rather than supplied: a
        declared list that disagrees with the text is a lie the first recipient
        discovers. Only one active template may serve a given (event, channel,
        locale).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateNotificationTemplateRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTemplate" }
        "409":
          description: The code, or the (event, channel, locale) combination, is taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          description: The template failed validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/notifications/templates/{templateId}:
    parameters:
      - name: templateId
        in: path
        required: true
        schema: { type: string, pattern: '^ntt_[0-9A-HJKMNP-TV-Z]{26}$' }
    get:
      tags: [Notifications]
      summary: Read a template
      operationId: getNotificationTemplate
      description: Requires `notification.read`.
      responses:
        "200":
          description: The template.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTemplate" }
        "404":
          description: No such template in this organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    patch:
      tags: [Notifications]
      summary: Edit a template
      operationId: updateNotificationTemplate
      description: |
        Requires `notification.template`. The variable list is re-derived from
        the new body, so it cannot drift from the text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                subject: { type: string }
                body: { type: string }
                providerRef: { type: string }
                isActive: { type: boolean }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTemplate" }
        "404":
          description: No such template in this organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          description: Nothing to update.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/notifications/templates/{templateId}/preview:
    parameters:
      - name: templateId
        in: path
        required: true
        schema: { type: string, pattern: '^ntt_[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      tags: [Notifications]
      summary: Render a template without sending it
      operationId: previewNotificationTemplate
      description: |
        Requires `notification.template`.

        `missingVariables` names every placeholder the supplied variables did
        not fill. That is the point of the endpoint: a template with a typo
        should be found here, not in a customer's inbox.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                variables:
                  type: object
                  additionalProperties: { type: string }
      responses:
        "200":
          description: The rendered message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject: { type: string }
                  body: { type: string }
                  missingVariables:
                    type: array
                    items: { type: string }
        "404":
          description: No such template in this organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/notifications/preferences:
    get:
      tags: [Notifications]
      summary: Read a party's preferences
      operationId: listNotificationPreferences
      description: Requires `notification.read`.
      parameters:
        - name: partyType
          in: query
          required: true
          schema: { type: string, enum: [CUSTOMER, USER, FRANCHISE, RECIPIENT] }
        - name: partyId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The preferences.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/NotificationPreference" }
    post:
      tags: [Notifications]
      summary: Set a preference
      operationId: setNotificationPreference
      description: |
        Requires `notification.preference`.

        An event-specific preference beats a blanket one, which is what lets
        somebody keep delivery notifications while turning off everything else.
        Opting out is audited: "we kept texting them after they asked us to
        stop" is a question that gets asked.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetNotificationPreferenceRequest" }
      responses:
        "200":
          description: The stored preference.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreference" }
        "422":
          description: Unknown channel, or no party supplied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }


  # ----------------------------------------------------- Customer portal --
  /api/v1/portal/customer/summary:
    get:
      tags: [Customer portal]
      summary: The customer's own dashboard
      operationId: portalCustomerSummary
      description: |
        Requires `portal.customer` **and** a login linked to a customer account.
        A staff login is refused: an unrestricted customer scope means "no
        restriction" for staff and would mean "the whole book" here.
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 90, maximum: 400 } }
      responses:
        "200":
          description: The customer's tiles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalCustomerSummary" }
        "403":
          description: Not a portal login, or not linked to any account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/portal/customer/accounts:
    get:
      tags: [Customer portal]
      summary: The accounts behind this login
      operationId: portalCustomerAccounts
      description: Requires `portal.customer`. Credit availability is computed, not stored.
      responses:
        "200":
          description: The linked accounts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PortalAccount" }
        "403":
          description: Not a portal login.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/portal/customer/shipments:
    get:
      tags: [Customer portal]
      summary: The customer's own shipments
      operationId: portalCustomerShipments
      description: |
        Requires `portal.customer`. Keyset paginated. A login linked to several
        accounts may name one with `customerId`; the choice is checked against
        the link, not trusted.
      parameters:
        - { name: customerId, in: query, schema: { type: string, pattern: '^cus_[0-9A-HJKMNP-TV-Z]{26}$' } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ShipmentStatus" } }
        - { name: search, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 25, maximum: 100 } }
      responses:
        "200":
          description: The shipments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PortalShipment" }
                  nextCursor: { type: string }
        "403":
          description: Not a portal login.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/portal/customer/shipments/{shipmentId}:
    parameters:
      - { $ref: "#/components/parameters/ShipmentId" }
    get:
      tags: [Customer portal]
      summary: One of the customer's shipments
      operationId: portalCustomerShipment
      description: |
        Requires `portal.customer`. Another account's shipment is **404**, not
        403: distinguishing them would confirm the identifier exists.
      responses:
        "200":
          description: The shipment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }
        "404":
          description: Not this account's shipment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/portal/customer/shipments/{shipmentId}/track:
    parameters:
      - { $ref: "#/components/parameters/ShipmentId" }
    get:
      tags: [Customer portal]
      summary: Track one of the customer's shipments
      operationId: portalCustomerTrack
      description: |
        Requires `portal.customer`. Resolved through the shipment first, which
        is what applies the account scope — tracking by AWB alone would not.
      responses:
        "200":
          description: The tracking timeline.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackingResult" }
        "404":
          description: Not this account's shipment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/portal/customer/invoices:
    get:
      tags: [Customer portal]
      summary: The customer's own invoices
      operationId: portalCustomerInvoices
      description: Requires `portal.customer`.
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/InvoiceStatus" } }
        - { name: cursor, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: The invoices.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PortalInvoice" }
        "403":
          description: Not a portal login.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  # ---------------------------------------------------- Franchise portal --
  /api/v1/portal/franchise/summary:
    get:
      tags: [Franchise portal]
      summary: The franchise's own dashboard
      operationId: portalFranchiseSummary
      description: |
        Requires `portal.franchise`.

        The franchise is derived from the caller's operating-unit grants. A
        head-office user whose access covers the network must name one with
        `franchiseId`; naming somebody else's is a **404**.

        Volume comes from the rollup and is keyed by the unit that *booked* the
        shipment, which is what the default shipment listing matches.
      parameters:
        - { $ref: "#/components/parameters/FranchiseIdQuery" }
        - { $ref: "#/components/parameters/CommandFrom" }
        - { $ref: "#/components/parameters/CommandTo" }
      responses:
        "200":
          description: The franchise's position.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalFranchiseSummary" }
        "403":
          description: No operating unit, or the units do not belong to a franchise.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: Not this caller's franchise.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/portal/franchise/shipments:
    get:
      tags: [Franchise portal]
      summary: The franchise's shipments
      operationId: portalFranchiseShipments
      description: |
        Requires `portal.franchise`.

        `role` says which relationship is meant and defaults to **ORIGIN** —
        what the franchise booked, matching the summary beside it. `DESTINATION`
        is its inbound delivery workload; `ANY` is both. Every row echoes its
        own role, so a mixed list is never ambiguous.
      parameters:
        - { $ref: "#/components/parameters/FranchiseIdQuery" }
        - name: role
          in: query
          schema: { type: string, enum: [ORIGIN, DESTINATION, ANY], default: ORIGIN }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ShipmentStatus" } }
        - { name: cursor, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: The shipments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  franchise: { $ref: "#/components/schemas/FranchiseRef" }
                  role: { type: string, enum: [ORIGIN, DESTINATION, ANY] }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/FranchiseShipment" }
        "404":
          description: Not this caller's franchise.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/portal/franchise/settlements:
    get:
      tags: [Franchise portal]
      summary: The franchise's own settlements
      operationId: portalFranchiseSettlements
      description: Requires `portal.franchise`.
      parameters:
        - { $ref: "#/components/parameters/FranchiseIdQuery" }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/SettlementStatus" } }
        - { name: cursor, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: The statements.
          content:
            application/json:
              schema:
                type: object
                properties:
                  franchise: { $ref: "#/components/schemas/FranchiseRef" }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PortalSettlement" }
        "404":
          description: Not this caller's franchise.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  # ------------------------------------------------------------ Console --
  /api/v1/console/lookup/{barcode}:
    parameters:
      - name: barcode
        in: path
        required: true
        description: An AWB or a piece barcode.
        schema: { type: string, maxLength: 64 }
    get:
      tags: [Console]
      summary: Scan one parcel
      operationId: consoleLookup
      description: |
        Requires `portal.console`. The most-used call on the surface.

        Ten fields, not the shipment's forty: the operator is deciding where to
        put a box, and the pricing breakdown is not part of that decision.
        `amountDueMinor` is present **only** for COD, so a prepaid parcel cannot
        be misread as one owing money.
      responses:
        "200":
          description: The parcel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleParcel" }
        "404":
          description: No such barcode in this organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/console/summary:
    get:
      tags: [Console]
      summary: What this facility is holding
      operationId: consoleSummary
      description: Requires `portal.console` and the `X-Operating-Unit` header.
      parameters:
        - { $ref: "#/components/parameters/OperatingUnitHeader" }
      responses:
        "200":
          description: The facility's counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleFacilitySummary" }
        "403":
          description: The facility is outside the caller's scope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/console/queue:
    get:
      tags: [Console]
      summary: The facility's work queue
      operationId: consoleQueue
      description: |
        Requires `portal.console` and the `X-Operating-Unit` header. Keyset
        paginated and deliberately narrow — a queue is a list, so every field is
        multiplied by the page size.
      parameters:
        - { $ref: "#/components/parameters/OperatingUnitHeader" }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ShipmentStatus" } }
        - { name: cursor, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: The queue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  unit: { $ref: "#/components/schemas/UnitRef" }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ConsoleQueueItem" }
                  nextCursor: { type: integer }
        "403":
          description: The facility is outside the caller's scope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/console/bags:
    get:
      tags: [Console]
      summary: The facility's bags
      operationId: consoleBags
      description: Requires `portal.console` and the `X-Operating-Unit` header.
      parameters:
        - { $ref: "#/components/parameters/OperatingUnitHeader" }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: Open and closed bags at this facility.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ConsoleBag" }

  /api/v1/console/inbound:
    get:
      tags: [Console]
      summary: What is on its way here
      operationId: consoleInbound
      description: |
        Requires `portal.console` and the `X-Operating-Unit` header. Dispatched
        manifests bound for this facility, so it can staff for them.
      parameters:
        - { $ref: "#/components/parameters/OperatingUnitHeader" }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: The inbound consignments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ConsoleInboundManifest" }

  # ------------------------------------------------------------ Reports --
  /api/v1/reports:
    get:
      tags: [Reports]
      summary: List report runs
      operationId: listReportRuns
      description: Requires `report.read`.
      parameters:
        - { name: reportType, in: query, schema: { $ref: "#/components/schemas/ReportType" } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ReportStatus" } }
        - { name: mine, in: query, schema: { type: boolean, default: false } }
        - { name: cursor, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: The runs, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ReportRun" }
    post:
      tags: [Reports]
      summary: Queue a report
      operationId: queueReport
      description: |
        Requires `report.run`, plus `report.finance` for commission, settlement,
        revenue and COD-aging exports — those carry somebody's income and
        somebody else's liability.

        Returns **202**: the response is a receipt, not a result. A report is
        generated by a worker that streams CSV into object storage; a caller
        that waited for the file would time out on anything worth exporting.

        The period is capped at 400 days.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QueueReportRequest" }
      responses:
        "202":
          description: Queued. Poll `pollUrl` until the status is COMPLETED.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, pattern: '^rpt_[0-9A-HJKMNP-TV-Z]{26}$' }
                  reportType: { type: string }
                  format: { type: string }
                  status: { type: string }
                  pollUrl: { type: string }
                  createdAt: { type: string, format: date-time }
        "403":
          description: Missing `report.run`, `report.finance`, or the named unit is out of scope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          description: Unknown type, backwards period, or a period longer than 400 days.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "503":
          description: The report could not be queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/reports/types:
    get:
      tags: [Reports]
      summary: The report catalogue
      operationId: listReportTypes
      description: |
        Requires `report.read`. Says which types need `report.finance`, so a UI
        can grey them out rather than letting somebody discover it by refusal.
      responses:
        "200":
          description: The catalogue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        reportType: { $ref: "#/components/schemas/ReportType" }
                        requiresFinancePermission: { type: boolean }

  /api/v1/reports/{reportId}:
    parameters:
      - name: reportId
        in: path
        required: true
        schema: { type: string, pattern: '^rpt_[0-9A-HJKMNP-TV-Z]{26}$' }
    get:
      tags: [Reports]
      summary: Report status
      operationId: getReportRun
      description: |
        Requires `report.read`. `downloadUrl` appears only once the run is
        COMPLETED.
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportRun" }
        "404":
          description: No such run in this organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/reports/{reportId}/download:
    parameters:
      - name: reportId
        in: path
        required: true
        schema: { type: string, pattern: '^rpt_[0-9A-HJKMNP-TV-Z]{26}$' }
    get:
      tags: [Reports]
      summary: Download the file
      operationId: downloadReport
      description: |
        Requires `report.read`.

        Redirects to a short-lived signed URL where the object store can
        presign, so the bytes never travel through the API; streams the file
        otherwise. Either way the response is `Cache-Control: no-store` — the
        link is a credential.

        A completed report expires 24 hours after generation, and the file is
        deleted with it.
      responses:
        "200":
          description: The CSV, streamed.
          content:
            text/csv:
              schema: { type: string }
        "302":
          description: A redirect to a short-lived signed URL.
          headers:
            Location:
              description: The signed URL. Treat it as a secret and do not log it.
              schema: { type: string, format: uri }
        "404":
          description: No such run in this organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: The report is not ready, or its download window has passed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/reports/{reportId}/cancel:
    parameters:
      - name: reportId
        in: path
        required: true
        schema: { type: string, pattern: '^rpt_[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      tags: [Reports]
      summary: Cancel a run
      operationId: cancelReportRun
      description: Requires `report.run`. Only a QUEUED or RUNNING report can be cancelled.
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string }
        "404":
          description: No such run in this organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: The report has already finished.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }


  # -------------------------------------------- Settlement adjustments --
  /api/v1/settlements/{settlementId}/adjustments:
    parameters:
      - name: settlementId
        in: path
        required: true
        schema: { type: string, pattern: '^stl_[0-9A-HJKMNP-TV-Z]{26}$' }
    get:
      tags: [Settlement]
      summary: List a statement's adjustments
      operationId: listSettlementAdjustments
      description: Requires `settlement.read`.
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/AdjustmentStatus" } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: The adjustments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SettlementAdjustment" }
    post:
      tags: [Settlement]
      summary: Raise an adjustment (maker)
      operationId: raiseSettlementAdjustment
      description: |
        Requires `settlement.adjust_request`.

        **This is the correction path for a statement that can no longer be
        recalculated.** An approved settlement's net is already in the ledger and
        the franchise has been told what they are owed, so §26 requires an
        explicit adjustment rather than a recalculation.

        Raising moves no money. A different person decides it.

        Where the money lands depends on the statement's state:

        - against a **DRAFT** or **CALCULATED** statement the approved
          adjustment is folded into the next recalculation, and the
          settlement's own approval posts the net including it;
        - against a **frozen** statement (APPROVED and beyond) the approved
          adjustment posts its own balanced journal immediately and becomes
          `APPLIED`.

        A cancelled settlement cannot be adjusted — it never became anybody's
        money.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RaiseAdjustmentRequest" }
      responses:
        "201":
          description: Raised, awaiting approval.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettlementAdjustment" }
        "404":
          description: No such settlement in this organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: The settlement is cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          description: Unknown type, zero amount, or a reason under 10 characters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/settlement-adjustments:
    get:
      tags: [Settlement]
      summary: The approval queue
      operationId: listAllSettlementAdjustments
      description: |
        Requires `settlement.read`. Mounted outside a settlement because an
        approver works from a queue of everything awaiting them, not from one
        statement at a time.
      parameters:
        - { name: settlementId, in: query, schema: { type: string, pattern: '^stl_[0-9A-HJKMNP-TV-Z]{26}$' } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/AdjustmentStatus" } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: The adjustments, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SettlementAdjustment" }

  /api/v1/settlement-adjustments/{adjustmentId}:
    parameters:
      - name: adjustmentId
        in: path
        required: true
        schema: { type: string, pattern: '^sad_[0-9A-HJKMNP-TV-Z]{26}$' }
    get:
      tags: [Settlement]
      summary: Read one adjustment
      operationId: getSettlementAdjustment
      description: Requires `settlement.read`.
      responses:
        "200":
          description: The adjustment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettlementAdjustment" }
        "404":
          description: No such adjustment in this organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/settlement-adjustments/{adjustmentId}/approve:
    parameters:
      - name: adjustmentId
        in: path
        required: true
        schema: { type: string, pattern: '^sad_[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      tags: [Settlement]
      summary: Approve an adjustment (checker)
      operationId: approveSettlementAdjustment
      description: |
        Requires `settlement.adjust_approve`, and **the approver must not be the
        person who raised it** — enforced in the service, in the UPDATE's WHERE
        clause, and by a CHECK constraint.

        The response's `status` says what happened: `APPLIED` means the
        correction posted its own journal because the statement was already
        frozen; `APPROVED` means it will be folded into the next recalculation.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string }
      responses:
        "200":
          description: Approved, and posted if the statement was frozen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettlementAdjustment" }
        "403":
          description: The approver raised this adjustment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: No such adjustment in this organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: The adjustment has already been decided.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/settlement-adjustments/{adjustmentId}/reject:
    parameters:
      - name: adjustmentId
        in: path
        required: true
        schema: { type: string, pattern: '^sad_[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      tags: [Settlement]
      summary: Reject an adjustment (checker)
      operationId: rejectSettlementAdjustment
      description: |
        Requires `settlement.adjust_approve` and a reason.

        Held to the same maker/checker rule as approval: somebody quietly
        withdrawing their own correction leaves the same hole in the record as
        approving it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5 }
      responses:
        "200":
          description: Rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettlementAdjustment" }
        "403":
          description: The rejecter raised this adjustment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: No such adjustment in this organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: The adjustment has already been decided.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <accessToken>` from `/auth/login` or
        `/auth/refresh`. Valid for 15 minutes.
    partnerKey:
      type: http
      scheme: bearer
      bearerFormat: apiKey
      description: |
        `Authorization: Bearer <keyId>.<secret>` — the token returned once when
        the key was issued. Used only under `/api/v1/partner`; a session token
        is not accepted there, and this credential is not accepted anywhere
        else.

        Authorization is by **scope**, carried on the key and checked per
        endpoint. Rate limiting is **per key**, so one partner exhausting its
        budget cannot throttle another sharing the same address.

  parameters:
    FranchiseIdQuery:
      name: franchiseId
      in: query
      description: |
        Name a franchise explicitly. Only a caller whose access covers it may
        do so; anyone else gets their own franchise derived from their operating
        unit, and naming another is a 404.
      schema: { type: string, pattern: '^frn_[0-9A-HJKMNP-TV-Z]{26}$' }
    CommandFrom:
      name: from
      in: query
      description: Start of the window (inclusive). Defaults to 29 days before `to`.
      schema: { type: string, format: date }
    CommandTo:
      name: to
      in: query
      description: End of the window (inclusive). Defaults to today.
      schema: { type: string, format: date }
    CommandUnitId:
      name: unitId
      in: query
      description: |
        Narrow to one operating unit. A principal scoped to particular units is
        confined to them whether or not this is supplied; naming a unit outside
        that scope is 403.
      schema: { type: string, pattern: '^ou_[0-9A-HJKMNP-TV-Z]{26}$' }
    OperatingUnitHeader:
      name: X-Operating-Unit
      in: header
      required: false
      description: |
        The operating unit you are physically working at, as an alternative to
        the `operatingUnitId` query parameter. Custody is checked against it, so
        it is resolved server-side against your role's scope and never trusted
        as an assertion of authority.
      schema: { type: string }
    DeviceId:
      name: X-Device-Id
      in: header
      required: false
      description: The scanning or field device's stable identifier.
      schema: { type: string, maxLength: 128 }
    DeviceEventId:
      name: X-Device-Event-Id
      in: header
      required: false
      description: |
        An identifier the device generates before the call is queued. Together
        with `X-Device-Id` it makes a retry over a flaky connection collapse
        onto the original operation instead of repeating it.
      schema: { type: string, minLength: 8, maxLength: 128 }
    Offset:
      name: offset
      in: query
      description: Rows to skip. Used only on low-volume configuration listings.
      schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      description: The `pagination.nextCursor` from the previous response. Opaque.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A client-generated key, 8-128 characters of `A-Za-z0-9-_:.`, unique per
        logical operation. Strongly recommended for every booking.
      schema: { type: string, minLength: 8, maxLength: 128, pattern: "^[A-Za-z0-9._:-]+$" }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, pattern: "^usr_[0-9A-HJKMNP-TV-Z]{26}$" }
    UnitId:
      name: unitId
      in: path
      required: true
      schema: { type: string, pattern: "^ou_[0-9A-HJKMNP-TV-Z]{26}$" }
    CustomerId:
      name: customerId
      in: path
      required: true
      schema: { type: string, pattern: "^cus_[0-9A-HJKMNP-TV-Z]{26}$" }
    ShipmentId:
      name: shipmentId
      in: path
      required: true
      schema: { type: string, pattern: "^shp_[0-9A-HJKMNP-TV-Z]{26}$" }
    VersionId:
      name: versionId
      in: path
      required: true
      schema: { type: string, pattern: "^rcv_[0-9A-HJKMNP-TV-Z]{26}$" }

  responses:
    PartnerScopeMissing:
      description: |
        The key does not hold the scope this endpoint requires. `details`
        carries `requiredScope` and `grantedScopes`, so an integrator can fix
        the credential without contacting support.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    PayloadTooLarge:
      description: The upload exceeds the configured size limit.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    UnsupportedMediaType:
      description: |
        The file type is not accepted. The decision is made by sniffing the
        bytes, so renaming a file does not change the answer.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    SignedRedirect:
      description: |
        A temporary redirect to a short-lived signed URL. Follow it to fetch the
        bytes directly from object storage.
      headers:
        Location:
          description: The signed URL. Treat it as a secret and do not log it.
          schema: { type: string, format: uri }
    BinaryStream:
      description: |
        The artifact streamed through the API, used when the storage backend
        cannot presign.
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
    Unauthorized:
      description: Authentication is required or the token is not valid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: The principal lacks the required permission or scope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: FORBIDDEN
              message: You do not have permission to perform this action.
              details: { requiredPermission: shipment.create }
              requestId: req_01KZG...
    NotFound:
      description: |
        Not found. Returned identically whether the object does not exist or
        belongs to another tenant or another branch, so this endpoint cannot be
        used to probe for identifiers.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: The request conflicts with the current state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ValidationFailed:
      description: One or more fields failed validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: VALIDATION_FAILED
              message: One or more fields failed validation.
              details:
                fields:
                  - { field: sender.pincode, message: Must be a 6-digit PIN code not starting with 0. }
                  - { field: packages, message: At least one package is required. }
              requestId: req_01KZG...
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          schema: { type: integer }
        X-RateLimit-Limit:
          schema: { type: integer }
        X-RateLimit-Remaining:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    Place:
      type: object
      description: |
        A postcode candidate matched from free text, with the context needed to
        tell two similarly named places apart.
      required: [id, code, label, matchedOn, state, stateCode, isRemote]
      properties:
        id: { type: string, description: Opaque postcode identifier. }
        code:
          type: string
          description: |
            The postcode. This is the value to submit as an address `pincode`
            when booking.
          example: "100001"
        label:
          type: string
          description: |
            A single line for a picker, in address order and with repeated
            names collapsed — Lagos is both a city and a state.
          example: "Ikeja GRA, Ikeja, Lagos"
        matchedOn:
          type: string
          description: Which field produced this hit, strongest first.
          enum: [CODE, AREA, CITY, OFFICE, DISTRICT]
        area:
          type: string
          description: Present when the match was on an area name.
          example: "Ikeja GRA"
        city: { type: string, example: "Lagos" }
        district:
          type: string
          description: The LGA in Nigeria, the district in India.
          example: "Ikeja"
        state: { type: string, example: "Lagos" }
        stateCode: { type: string, example: "LA" }
        isRemote:
          type: boolean
          description: Platform-wide remote-area default for this postcode.

    # ---- primitives ------------------------------------------------------
    MinorAmount:
      type: integer
      format: int64
      minimum: 0
      description: An amount in the currency's minor units. `12550` is ₦125.50.
      examples: [12550]
    BasisPoints:
      type: integer
      minimum: 0
      maximum: 1000000
      description: A percentage in hundredths of a percent. `1850` is 18.50%.
      examples: [1850]
    Pincode:
      type: string
      pattern: "^[1-9][0-9]{5}$"
      description: A six-digit Indian PIN code.
      examples: ["560001"]
    Code:
      type: string
      pattern: "^[A-Z0-9][A-Z0-9_-]{1,31}$"
      description: An operator-assigned business code. Uppercased on write.
      examples: ["BLR-001"]
    TimeOfDay:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      examples: ["17:30"]
    Password:
      type: string
      minLength: 12
      maxLength: 256
      description: |
        At least 12 characters and at least three of: lowercase, uppercase,
        digit, symbol.
    GSTIN:
      type: string
      pattern: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][0-9A-Z]Z[0-9A-Z]$"
      examples: ["29ABCDE1234F1Z5"]
    PAN:
      type: string
      pattern: "^[A-Z]{5}[0-9]{4}[A-Z]$"
      examples: ["ABCDE1234F"]

    # ---- enums -----------------------------------------------------------
    ShipmentStatus:
      type: string
      description: |
        The full lifecycle. Release 1 drives only `BOOKED` and `CANCELLED`; the
        remainder arrive with Release 2 operations. `DELIVERED`,
        `RTO_DELIVERED`, `CANCELLED` and `LOST` are terminal.
      enum:
        - BOOKED
        - PICKUP_SCHEDULED
        - PICKUP_ASSIGNED
        - PICKED_UP
        - ORIGIN_BRANCH_RECEIVED
        - ORIGIN_BAGGED
        - ORIGIN_DISPATCHED
        - IN_TRANSIT
        - TRANSIT_HUB_RECEIVED
        - TRANSIT_HUB_DISPATCHED
        - DESTINATION_HUB_RECEIVED
        - DESTINATION_BRANCH_RECEIVED
        - OUT_FOR_DELIVERY
        - DELIVERED
        - DELIVERY_FAILED
        - NDR
        - RTO_INITIATED
        - RTO_IN_TRANSIT
        - RTO_DELIVERED
        - CANCELLED
        - LOST
        - DAMAGED
    PaymentMode:
      type: string
      enum: [PREPAID, COD, CREDIT, TO_PAY]
    TransportMode:
      type: string
      enum: [AIR, SURFACE, RAIL, LOCAL]
    UnitType:
      type: string
      enum: [HEAD_OFFICE, REGIONAL_HUB, TRANSIT_HUB, DELIVERY_HUB, COMPANY_BRANCH, FRANCHISE_BRANCH]
    ZoneType:
      type: string
      enum: [LOCAL, INTRA_STATE, METRO, REGIONAL, NATIONAL, SPECIAL, INTERNATIONAL]
    Capability:
      type: string
      enum:
        [BOOKING, PICKUP, DELIVERY, BAGGING, MANIFEST, LINEHAUL_ORIGIN,
         LINEHAUL_DESTINATION, TRANSIT, COD_COLLECTION, RTO_PROCESSING,
         CUSTOMER_WALKIN, WAREHOUSING]
    ResolutionSource:
      type: string
      description: Which rule produced the route, in descending precedence.
      enum: [OVERRIDE, SERVICE_ROUTE, GENERIC_ROUTE, FALLBACK_ROUTE, LOCAL_DELIVERY]
    ServiceabilityReasonCode:
      type: string
      enum:
        - ORIGIN_NOT_SERVICEABLE
        - DESTINATION_NOT_SERVICEABLE
        - NO_ROUTE_AVAILABLE
        - DENIED_BY_RULE
        - ORIGIN_TEMPORARILY_CLOSED
        - DESTINATION_TEMPORARILY_CLOSED
        - ORIGIN_HUB_NOT_CONFIGURED
        - DESTINATION_HUB_NOT_CONFIGURED
        - PINCODE_NOT_FOUND
    ErrorCode:
      type: string
      description: |
        Stable, machine-readable failure identifiers. Switch on these rather
        than on the HTTP status alone.
      enum:
        - BAD_REQUEST
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - INVALID_CREDENTIALS
        - TOKEN_EXPIRED
        - TOKEN_INVALID
        - TOKEN_REVOKED
        - FORBIDDEN
        - ACCOUNT_INACTIVE
        - ACCOUNT_LOCKED
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - CONFLICT
        - DUPLICATE_RESOURCE
        - RESOURCE_IN_USE
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - TENANT_MISMATCH
        - IMMUTABLE_RESOURCE
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_IN_PROGRESS
        - CONCURRENT_MODIFICATION
        - SHIPMENT_INVALID_STATE
        - SHIPMENT_NOT_SERVICEABLE

    # ---- envelopes -------------------------------------------------------
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message:
              type: string
              description: Safe to show to end users. Never contains internal detail.
            details:
              type: object
              additionalProperties: true
              description: Structured context. Shape depends on `code`.
            requestId:
              type: string
              description: Matches the `X-Request-Id` response header. Quote it in support tickets.
    CursorPage:
      type: object
      properties:
        data: { type: array, items: {} }
        pagination:
          type: object
          properties:
            limit: { type: integer }
            hasMore: { type: boolean }
            nextCursor: { type: string }
            sort: { type: string }
            order: { type: string, enum: [asc, desc] }
    OffsetPage:
      type: object
      properties:
        data: { type: array, items: {} }
        pagination:
          type: object
          properties:
            page: { type: integer }
            pageSize: { type: integer }
            totalItems: { type: integer }
            totalPages: { type: integer }
            hasMore: { type: boolean }
            sort: { type: string }
            order: { type: string, enum: [asc, desc] }
    ReadinessResponse:
      type: object
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          additionalProperties: true

    # ---- auth ------------------------------------------------------------
    TokenPair:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, description: Access token lifetime in seconds. }
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshTokenExpiresAt: { type: string, format: date-time }
        sessionId: { type: string }
    LoginResponse:
      type: object
      properties:
        tokens: { $ref: "#/components/schemas/TokenPair" }
        user: { $ref: "#/components/schemas/UserProfile" }
    UserProfile:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        fullName: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE, LOCKED] }
        isSuperAdmin: { type: boolean }
        mustChangePassword:
          type: boolean
          description: When true, force a password change before anything else.
        lastLoginAt: { type: string, format: date-time }
        organization:
          type: object
          properties:
            id: { type: string }
            code: { type: string }
            name: { type: string }
            currency: { type: string }
            timezone: { type: string }
            awbPrefix: { type: string }
        roles: { type: array, items: { type: string } }
        permissions:
          type: array
          items: { type: string }
          description: Effective permission codes. Use for UI visibility only.
        portal: { $ref: "#/components/schemas/PortalSubject" }
        operatingUnitIds:
          type: array
          items: { type: string }
          description: Units this principal is scoped to. Empty means unscoped.
        hasOrganizationWideAccess:
          type: boolean
          description: True when at least one role is granted without a unit scope.
    SessionSummary:
      type: object
      properties:
        id: { type: string }
        issuedAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        userAgent: { type: string }
        clientIp: { type: string }
        current: { type: boolean }
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        fullName: { type: string }
        phone: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE, LOCKED] }
        isSuperAdmin: { type: boolean }
        mustChangePassword: { type: boolean }
        lastLoginAt: { type: string, format: date-time }
        lockedUntil: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleAssignment" }
    CreateUserRequest:
      type: object
      required: [email, fullName, password]
      properties:
        email: { type: string, format: email }
        fullName: { type: string, minLength: 1, maxLength: 160 }
        phone: { type: string }
        password: { $ref: "#/components/schemas/Password" }
        mustChangePassword: { type: boolean, default: true }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleGrant" }
    RoleGrant:
      type: object
      required: [roleCode]
      properties:
        roleCode: { type: string, examples: ["BRANCH_MANAGER"] }
        operatingUnitId:
          type: string
          description: Required when the role's `scopeRequired` is true.
    RoleAssignment:
      type: object
      properties:
        roleId: { type: string }
        roleCode: { type: string }
        roleName: { type: string }
        operatingUnit:
          type: object
          properties:
            id: { type: string }
            code: { type: string }
            name: { type: string }
            type: { $ref: "#/components/schemas/UnitType" }
        grantedAt: { type: string, format: date-time }
        grantedBy: { type: string }
    Role:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        isSystem:
          type: boolean
          description: System roles are shared across tenants and cannot be modified.
        scopeRequired: { type: boolean }
        permissionCount: { type: integer }
        permissions: { type: array, items: { type: string } }
    Permission:
      type: object
      properties:
        code: { type: string, examples: ["shipment.create"] }
        resource: { type: string }
        action: { type: string }
        module: { type: string }
        description: { type: string }

    # ---- organization ----------------------------------------------------
    Organization:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        legalName: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED, CLOSED] }
        timezone: { type: string }
        currency: { type: string }
        awbPrefix: { type: string, description: Immutable. Prefixes every AWB this tenant issues. }
        contactEmail: { type: string }
        contactPhone: { type: string }
        gstNumber: { type: string }
        settings: { type: object, additionalProperties: true }
    AuditEvent:
      type: object
      properties:
        id: { type: string }
        action: { type: string }
        resourceType: { type: string }
        resourceId: { type: string }
        actorType: { type: string, enum: [USER, SYSTEM, API_KEY, ANONYMOUS] }
        actorEmail: { type: string }
        actorName: { type: string }
        reason: { type: string }
        requestId: { type: string }
        clientIp: { type: string }
        before: { type: object, additionalProperties: true }
        after: { type: object, additionalProperties: true }
        metadata: { type: object, additionalProperties: true }
        occurredAt: { type: string, format: date-time }

    # ---- network ---------------------------------------------------------
    OperatingUnit:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        unitType: { $ref: "#/components/schemas/UnitType" }
        status: { type: string, enum: [ACTIVE, INACTIVE, SUSPENDED] }
        parent:
          type: object
          properties:
            id: { type: string }
            code: { type: string }
            name: { type: string }
            unitType: { $ref: "#/components/schemas/UnitType" }
        regionCode: { type: string }
        address: { $ref: "#/components/schemas/Address" }
        contact:
          type: object
          properties:
            name: { type: string }
            phone: { type: string }
            email: { type: string }
        operatingHours:
          type: object
          additionalProperties: true
          description: 'Weekly hours, e.g. {"mon":{"open":"09:30","close":"19:00","cutoff":"17:30"}}'
        capabilities:
          type: array
          items:
            type: object
            properties:
              capability: { $ref: "#/components/schemas/Capability" }
              enabled: { type: boolean }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
        version: { type: integer, description: Pass as `expectedVersion` when updating. }
    OperatingUnitSummary:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        unitType: { $ref: "#/components/schemas/UnitType" }
        status: { type: string }
        version: { type: integer }
    CreateOperatingUnitRequest:
      type: object
      required: [code, name, unitType, addressLine1, pincode]
      properties:
        code: { $ref: "#/components/schemas/Code" }
        name: { type: string, minLength: 2, maxLength: 160 }
        unitType: { $ref: "#/components/schemas/UnitType" }
        parentUnitId:
          type: string
          description: A branch's parent is its hub. Required for routing to resolve.
        regionId: { type: string }
        addressLine1: { type: string, minLength: 3, maxLength: 200 }
        addressLine2: { type: string }
        landmark: { type: string }
        pincode: { $ref: "#/components/schemas/Pincode" }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        contactName: { type: string }
        contactPhone: { type: string }
        contactEmail: { type: string, format: email }
        operatingHours: { type: object, additionalProperties: true }
        effectiveFrom: { type: string, format: date-time }
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/Capability" }
    UpdateOperatingUnitRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer }
        name: { type: string }
        parentUnitId: { type: string, description: An empty string detaches the parent. }
        addressLine1: { type: string }
        pincode: { $ref: "#/components/schemas/Pincode" }
        contactName: { type: string }
        contactPhone: { type: string }
        contactEmail: { type: string }
        operatingHours: { type: object, additionalProperties: true }
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
    CreateFranchiseRequest:
      type: object
      required: [code, name, operatingUnitId, ownerName, ownerPhone]
      properties:
        code: { $ref: "#/components/schemas/Code" }
        name: { type: string }
        operatingUnitId: { type: string, description: Must be a FRANCHISE_BRANCH unit. }
        category: { type: string, enum: [PLATINUM, GOLD, SILVER, STANDARD] }
        ownerName: { type: string }
        ownerUserId: { type: string }
        ownerPhone: { type: string }
        ownerEmail: { type: string, format: email }
        gstNumber: { $ref: "#/components/schemas/GSTIN" }
        panNumber: { $ref: "#/components/schemas/PAN" }
        status: { type: string, enum: [ONBOARDING, ACTIVE, SUSPENDED, TERMINATED] }
    FranchiseSummary:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        status: { type: string }
        category: { type: string }
        version: { type: integer }
    Address:
      type: object
      properties:
        line1: { type: string }
        line2: { type: string }
        landmark: { type: string }
        city: { type: string }
        state: { type: string }
        pincode: { type: string }
        latitude: { type: number }
        longitude: { type: number }

    # ---- geography -------------------------------------------------------
    PincodeRecord:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        state: { type: string }
        stateCode: { type: string }
        gstStateCode: { type: string }
        district: { type: string }
        city: { type: string }
        cityTier: { type: string, enum: [METRO, TIER_1, TIER_2, TIER_3, OTHER] }
        officeName: { type: string }
        isRemote: { type: boolean, description: The platform-wide default. }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        latitude: { type: number }
        longitude: { type: number }
        countryCode: { type: string }
    ZoneAssignment:
      type: object
      nullable: true
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        type: { $ref: "#/components/schemas/ZoneType" }
        isRemote: { type: boolean, description: The effective flag for this tenant. }
    Zone:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        type: { $ref: "#/components/schemas/ZoneType" }
        description: { type: string }
        sortOrder: { type: integer }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    ImportJobAccepted:
      type: object
      properties:
        id: { type: string }
        importType: { type: string, enum: [PINCODE, ZONE_MAPPING, SERVICE_AREA] }
        status: { type: string }
        fileName: { type: string }
        totalRows: { type: integer }
        statusUrl: { type: string }
    ImportJob:
      type: object
      properties:
        id: { type: string }
        importType: { type: string }
        status:
          type: string
          enum: [PENDING, PROCESSING, COMPLETED, COMPLETED_WITH_ERRORS, FAILED, CANCELLED]
        fileName: { type: string }
        totalRows: { type: integer }
        processedRows: { type: integer }
        successRows: { type: integer }
        failedRows: { type: integer }
        errorSummary:
          type: object
          additionalProperties: { type: integer }
          description: Counts by error code.
        failureReason: { type: string }
        errorsUrl: { type: string }
        errorFileUrl: { type: string }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }

    # ---- products --------------------------------------------------------
    CourierService:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        mode: { $ref: "#/components/schemas/TransportMode" }
        minWeightGrams: { type: integer }
        maxWeightGrams: { type: integer }
        maxLengthMm: { type: integer }
        maxWidthMm: { type: integer }
        maxHeightMm: { type: integer }
        maxDimensionSumMm: { type: integer }
        volumetricDivisor:
          type: integer
          description: "Volumetric weight = L(cm) x W(cm) x H(cm) / divisor, in kg."
        weightRoundingGrams:
          type: integer
          description: Chargeable weight is rounded up to this granularity.
        codAllowed: { type: boolean }
        maxCodAmountMinor: { $ref: "#/components/schemas/MinorAmount" }
        insuranceAllowed: { type: boolean }
        maxDeclaredValueMinor: { $ref: "#/components/schemas/MinorAmount" }
        slaTransitHours: { type: integer }
        slaRules:
          type: object
          properties:
            cutoffTime: { $ref: "#/components/schemas/TimeOfDay" }
            excludeSundays: { type: boolean }
            remoteAreaExtraHours: { type: integer }
            minTransitHours: { type: integer }
        cutoffTime: { $ref: "#/components/schemas/TimeOfDay" }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
        sortOrder: { type: integer }
        version: { type: integer }
    CreateCourierServiceRequest:
      type: object
      required: [code, name, mode, maxWeightGrams, slaTransitHours]
      properties:
        code: { $ref: "#/components/schemas/Code" }
        name: { type: string }
        description: { type: string }
        mode: { $ref: "#/components/schemas/TransportMode" }
        minWeightGrams: { type: integer, default: 1 }
        maxWeightGrams: { type: integer }
        maxLengthMm: { type: integer }
        maxWidthMm: { type: integer }
        maxHeightMm: { type: integer }
        maxDimensionSumMm: { type: integer }
        volumetricDivisor: { type: integer, default: 5000 }
        weightRoundingGrams: { type: integer, default: 500 }
        codAllowed: { type: boolean }
        maxCodAmountMinor: { $ref: "#/components/schemas/MinorAmount" }
        insuranceAllowed: { type: boolean }
        maxDeclaredValueMinor: { $ref: "#/components/schemas/MinorAmount" }
        slaTransitHours: { type: integer }
        slaRules: { type: object, additionalProperties: true }
        cutoffTime: { $ref: "#/components/schemas/TimeOfDay" }
        sortOrder: { type: integer }

    # ---- serviceability --------------------------------------------------
    ServiceabilityResult:
      type: object
      properties:
        serviceable: { type: boolean }
        reasonCode: { $ref: "#/components/schemas/ServiceabilityReasonCode" }
        reasonMessage: { type: string }
        serviceCode: { type: string }
        serviceName: { type: string }
        serviceMode: { $ref: "#/components/schemas/TransportMode" }
        origin: { $ref: "#/components/schemas/LaneEndpoint" }
        destination: { $ref: "#/components/schemas/LaneEndpoint" }
        originBranch: { $ref: "#/components/schemas/FacilityRef" }
        originHub: { $ref: "#/components/schemas/FacilityRef" }
        destinationHub: { $ref: "#/components/schemas/FacilityRef" }
        destinationBranch: { $ref: "#/components/schemas/FacilityRef" }
        routeId: { type: string }
        routeCode: { type: string }
        resolutionSource: { $ref: "#/components/schemas/ResolutionSource" }
        legs:
          type: array
          items: { $ref: "#/components/schemas/RouteLeg" }
        transitHours: { type: integer }
        slaHours: { type: integer }
        promisedDeliveryAt: { type: string, format: date-time }
        cutoffApplied:
          type: boolean
          description: True when the booking fell after the cut-off and joins the next despatch.
        restrictions:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              message: { type: string }
              details: { type: object, additionalProperties: true }
        explanationId: { type: string }
        explanation: { $ref: "#/components/schemas/RoutingExplanation" }
    LaneEndpoint:
      type: object
      properties:
        pincode: { type: string }
        city: { type: string }
        state: { type: string }
        zoneCode: { type: string }
        zoneName: { type: string }
        isRemote: { type: boolean }
    FacilityRef:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        unitType: { $ref: "#/components/schemas/UnitType" }
    RouteLeg:
      type: object
      properties:
        sequence: { type: integer }
        from: { type: string }
        fromName: { type: string }
        to: { type: string }
        toName: { type: string }
        mode: { type: string, enum: [ROAD, AIR, RAIL, PARTNER] }
        transitHours: { type: integer }
        partner: { type: string }
    RoutingExplanation:
      type: object
      description: >-
        The full decision trace: every candidate considered at each step, and why
        it won or lost.
      properties:
        id: { type: string }
        resolvedAt: { type: string, format: date-time }
        request: { type: object, additionalProperties: true }
        steps:
          type: array
          items:
            type: object
            properties:
              step: { type: string }
              outcome: { type: string }
              detail: { type: string }
              candidates:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    code: { type: string }
                    priority: { type: integer }
                    selected: { type: boolean }
                    reason: { type: string }
    CreateRouteRequest:
      type: object
      required: [code, name, originUnitCode, destinationUnitCode, transitHours, legs]
      properties:
        code: { $ref: "#/components/schemas/Code" }
        name: { type: string }
        originUnitCode: { type: string }
        destinationUnitCode: { type: string }
        serviceCode: { type: string, description: Omit for a route that serves every product. }
        priority: { type: integer, default: 100 }
        transitHours: { type: integer, minimum: 1, maximum: 8760 }
        cutoffTime: { $ref: "#/components/schemas/TimeOfDay" }
        isFallback: { type: boolean, default: false }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time }
        legs:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [fromUnitCode, toUnitCode, mode, transitHours]
            properties:
              sequence: { type: integer }
              fromUnitCode: { type: string }
              toUnitCode: { type: string }
              mode: { type: string, enum: [ROAD, AIR, RAIL, PARTNER] }
              transitHours: { type: integer }
              partnerName: { type: string }

    # ---- pricing ---------------------------------------------------------
    QuoteRequest:
      type: object
      required: [originPincode, destinationPincode, serviceCode, paymentMode, packages]
      properties:
        originPincode: { $ref: "#/components/schemas/Pincode" }
        destinationPincode: { $ref: "#/components/schemas/Pincode" }
        serviceCode: { type: string }
        customerId:
          type: string
          description: Selects the customer's own rate card where one exists.
        paymentMode: { $ref: "#/components/schemas/PaymentMode" }
        declaredValueMinor: { $ref: "#/components/schemas/MinorAmount" }
        codAmountMinor:
          allOf: [{ $ref: "#/components/schemas/MinorAmount" }]
          description: Required and positive when `paymentMode` is COD; forbidden otherwise.
        insuranceRequired: { type: boolean }
        packages:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/PackageInput" }
        at: { type: string, format: date-time }
      example:
        originPincode: "560001"
        destinationPincode: "110001"
        serviceCode: EXPRESS
        paymentMode: PREPAID
        packages:
          - actualWeightGrams: 500
            lengthMm: 200
            widthMm: 150
            heightMm: 100
    PackageInput:
      type: object
      required: [actualWeightGrams]
      properties:
        reference: { type: string }
        actualWeightGrams: { type: integer, minimum: 1 }
        lengthMm: { type: integer, minimum: 1 }
        widthMm: { type: integer, minimum: 1 }
        heightMm: { type: integer, minimum: 1 }
        contentDescription: { type: string }
        declaredValueMinor: { $ref: "#/components/schemas/MinorAmount" }
    Quote:
      type: object
      properties:
        currency: { type: string }
        rateCardId: { type: string }
        rateCardCode: { type: string }
        rateCardScope: { type: string, enum: [RETAIL, BUSINESS, FRANCHISE] }
        rateCardVersionId: { type: string }
        rateCardVersion: { type: integer }
        pricingEngineVersion: { type: string }
        originZoneCode: { type: string }
        destinationZoneCode: { type: string }
        serviceCode: { type: string }
        weight: { $ref: "#/components/schemas/WeightBreakdown" }
        freightMinor: { $ref: "#/components/schemas/MinorAmount" }
        surchargeTotalMinor: { $ref: "#/components/schemas/MinorAmount" }
        discountTotalMinor: { $ref: "#/components/schemas/MinorAmount" }
        taxableMinor: { $ref: "#/components/schemas/MinorAmount" }
        taxTotalMinor: { $ref: "#/components/schemas/MinorAmount" }
        roundingMinor: { type: integer }
        totalMinor: { $ref: "#/components/schemas/MinorAmount" }
        lineItems:
          type: array
          items: { $ref: "#/components/schemas/LineItem" }
      example:
        currency: INR
        rateCardCode: RETAIL
        rateCardVersion: 1
        pricingEngineVersion: 1.0.0
        originZoneCode: LOCAL
        destinationZoneCode: NATIONAL
        serviceCode: EXPRESS
        weight:
          actualWeightGrams: 500
          volumetricWeightGrams: 600
          volumetricDivisor: 5000
          weightRoundingGrams: 500
          chargeableWeightGrams: 1000
          explanation: "actual=500g volumetric=600g (divisor 5000); volumetric basis selected, rounded up to the nearest 500g -> 1000g"
        freightMinor: 7500
        surchargeTotalMinor: 1388
        discountTotalMinor: 0
        taxableMinor: 8888
        taxTotalMinor: 1600
        roundingMinor: 0
        totalMinor: 10488
        lineItems:
          - kind: FREIGHT
            code: FREIGHT
            label: Freight charge
            amountMinor: 7500
            explanation: "base 500g at INR 50.00 plus 1 x 500g at INR 25.00 = INR 25.00"
          - kind: SURCHARGE
            code: FUEL
            label: Fuel surcharge
            amountMinor: 1388
            basisMinor: 7500
            rate: "18.50%"
            explanation: "18.50% on freight of INR 75.00 = INR 13.88"
          - kind: TAX
            code: IGST18
            label: IGST 18%
            amountMinor: 1600
            basisMinor: 8888
            rate: "18.00%"
            explanation: "IGST 18.00% on taxable value INR 88.88 = INR 16.00"
    WeightBreakdown:
      type: object
      properties:
        actualWeightGrams: { type: integer }
        volumetricWeightGrams: { type: integer }
        volumetricDivisor: { type: integer }
        weightRoundingGrams: { type: integer }
        minChargeableWeightGrams: { type: integer }
        chargeableWeightGrams: { type: integer }
        explanation: { type: string }
    LineItem:
      type: object
      properties:
        kind: { type: string, enum: [FREIGHT, SURCHARGE, DISCOUNT, TAX, ROUNDING] }
        code: { type: string }
        label: { type: string }
        amountMinor:
          type: integer
          description: Negative for discounts.
        basisMinor: { type: integer, description: What the amount was computed from. }
        rate: { type: string, description: 'Human-readable rate, e.g. "18.50%".' }
        ruleId: { type: string }
        explanation: { type: string, description: Safe to show to a customer. }
    RateCardVersion:
      type: object
      properties:
        id: { type: string }
        rateCardId: { type: string }
        rateCardCode: { type: string }
        version: { type: integer }
        status: { type: string, enum: [DRAFT, ACTIVE, SUPERSEDED, ARCHIVED] }
        currency: { type: string }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time }
        notes: { type: string }
        activatedAt: { type: string, format: date-time }
        editable: { type: boolean, description: True only while the version is DRAFT. }
        counts:
          type: object
          properties:
            zoneRates: { type: integer }
            weightSlabs: { type: integer }
            surcharges: { type: integer }
            discounts: { type: integer }
        zoneRates: { type: array, items: { type: object, additionalProperties: true } }
        surcharges: { type: array, items: { type: object, additionalProperties: true } }
    CreateSurchargeRequest:
      type: object
      required: [code, name, surchargeType, calcType]
      properties:
        code: { $ref: "#/components/schemas/Code" }
        name: { type: string }
        surchargeType:
          type: string
          enum: [FUEL, REMOTE_AREA, COD, INSURANCE, HANDLING, OVERSIZE, DOCUMENTATION, PACKAGING, APPOINTMENT, CUSTOM]
        calcType: { type: string, enum: [FIXED, PERCENTAGE, PER_KG] }
        valueMinor:
          allOf: [{ $ref: "#/components/schemas/MinorAmount" }]
          description: Required for FIXED and PER_KG.
        percentageBp:
          allOf: [{ $ref: "#/components/schemas/BasisPoints" }]
          description: Required for PERCENTAGE.
        appliesTo:
          type: string
          enum: [FREIGHT, FREIGHT_PLUS_SURCHARGES, DECLARED_VALUE, COD_AMOUNT]
          default: FREIGHT
        minAmountMinor: { $ref: "#/components/schemas/MinorAmount" }
        maxAmountMinor: { $ref: "#/components/schemas/MinorAmount" }
        serviceCode: { type: string }
        priority: { type: integer, default: 100 }
        isTaxable: { type: boolean, default: true }
        conditions:
          type: object
          description: When the surcharge applies. Empty means always.
          properties:
            remoteOrigin: { type: boolean }
            remoteDestination: { type: boolean }
            remoteEither: { type: boolean }
            paymentModes: { type: array, items: { $ref: "#/components/schemas/PaymentMode" } }
            minWeightGrams: { type: integer }
            maxWeightGrams: { type: integer }
            minDeclaredValueMinor: { type: integer }
            requiresInsurance: { type: boolean }
            intraStateOnly: { type: boolean }

    # ---- customers -------------------------------------------------------
    CustomerSummary:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        customerType: { type: string, enum: [RETAIL, BUSINESS] }
        status: { type: string, enum: [ACTIVE, SUSPENDED, CLOSED] }
        version: { type: integer }
    Customer:
      allOf:
        - $ref: "#/components/schemas/CustomerSummary"
        - type: object
          properties:
            email: { type: string }
            phone: { type: string }
            gstNumber: { type: string }
            panNumber: { type: string }
            notes: { type: string }
            owningUnitCode: { type: string }
            businessAccount:
              type: object
              properties:
                id: { type: string }
                accountCode: { type: string }
                legalName: { type: string }
                creditLimitMinor: { $ref: "#/components/schemas/MinorAmount" }
                paymentTermsDays: { type: integer }
                billingCycle: { type: string, enum: [WEEKLY, FORTNIGHTLY, MONTHLY] }
                rateCardCode: { type: string }
                status: { type: string }
            credit: { $ref: "#/components/schemas/CreditProfile" }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    CreateCustomerRequest:
      type: object
      required: [customerType, name, phone]
      properties:
        code: { $ref: "#/components/schemas/Code" }
        customerType: { type: string, enum: [RETAIL, BUSINESS] }
        name: { type: string, minLength: 2, maxLength: 160 }
        email: { type: string, format: email }
        phone: { type: string }
        owningUnitId: { type: string }
        gstNumber: { $ref: "#/components/schemas/GSTIN" }
        panNumber: { $ref: "#/components/schemas/PAN" }
        notes: { type: string }
        businessAccount:
          type: object
          description: Required when `customerType` is BUSINESS, forbidden otherwise.
          required: [accountCode, legalName]
          properties:
            accountCode: { $ref: "#/components/schemas/Code" }
            legalName: { type: string }
            industry: { type: string }
            creditLimitMinor: { $ref: "#/components/schemas/MinorAmount" }
            paymentTermsDays: { type: integer, minimum: 0, maximum: 180 }
            billingCycle: { type: string, enum: [WEEKLY, FORTNIGHTLY, MONTHLY] }
            rateCardId: { type: string }
    CustomerAddress:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        addressType: { type: string, enum: [PICKUP, DELIVERY, BILLING, BOTH] }
        contactName: { type: string }
        contactPhone: { type: string }
        altPhone: { type: string }
        line1: { type: string }
        line2: { type: string }
        landmark: { type: string }
        city: { type: string }
        state: { type: string }
        pincode: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        isDefault: { type: boolean }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    CreateAddressRequest:
      type: object
      required: [label, addressType, contactName, contactPhone, line1, pincode]
      properties:
        label: { type: string, maxLength: 80 }
        addressType: { type: string, enum: [PICKUP, DELIVERY, BILLING, BOTH] }
        contactName: { type: string }
        contactPhone: { type: string }
        altPhone: { type: string }
        line1: { type: string, minLength: 3, maxLength: 200 }
        line2: { type: string }
        landmark: { type: string }
        pincode: { $ref: "#/components/schemas/Pincode" }
        latitude: { type: number }
        longitude: { type: number }
        isDefault: { type: boolean }
    CreditProfile:
      type: object
      properties:
        creditLimitMinor: { $ref: "#/components/schemas/MinorAmount" }
        creditUsedMinor:
          allOf: [{ $ref: "#/components/schemas/MinorAmount" }]
          description: Maintained by the server; never settable directly.
        availableMinor: { $ref: "#/components/schemas/MinorAmount" }
        currency: { type: string }
        creditStatus: { type: string, enum: [GOOD, WARNING, ON_HOLD, BLOCKED] }
        paymentTermsDays: { type: integer }
        blockedReason: { type: string }
        lastReviewedAt: { type: string, format: date-time }
        history:
          type: array
          description: Append-only ledger of every credit movement.
          items:
            type: object
            properties:
              entryType: { type: string, enum: [RESERVE, RELEASE, ADJUST, LIMIT_CHANGE] }
              amountMinor: { type: integer }
              balanceAfterMinor: { type: integer }
              awb: { type: string }
              reason: { type: string }
              createdAt: { type: string, format: date-time }

    # ---- shipments -------------------------------------------------------
    BookingRequest:
      type: object
      required: [customerId, serviceCode, paymentMode, sender, recipient, packages, contentDescription]
      properties:
        customerId: { type: string }
        referenceNumber:
          type: string
          maxLength: 64
          description: |
            Your own reference. Unique per customer among non-cancelled
            shipments, which makes a duplicate submission detectable even
            without an Idempotency-Key.
        serviceCode: { type: string }
        paymentMode: { $ref: "#/components/schemas/PaymentMode" }
        sender: { $ref: "#/components/schemas/BookingAddress" }
        recipient: { $ref: "#/components/schemas/BookingAddress" }
        packages:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/PackageInput" }
        declaredValueMinor:
          allOf: [{ $ref: "#/components/schemas/MinorAmount" }]
          description: Must equal the sum of package declared values when both are supplied.
        codAmountMinor:
          allOf: [{ $ref: "#/components/schemas/MinorAmount" }]
          description: Required and positive when `paymentMode` is COD; forbidden otherwise.
        insuranceRequired: { type: boolean, description: Requires a positive declared value. }
        contentDescription: { type: string, minLength: 2, maxLength: 500 }
        specialInstructions: { type: string, maxLength: 1000 }
        isFragile: { type: boolean }
        isDangerousGoods: { type: boolean }
        bookingUnitId:
          type: string
          description: Defaults to the resolved origin branch. Must be in the caller's scope.
        metadata: { type: object, additionalProperties: true }
      example:
        customerId: cus_01KZGDG8P5STK8J27R79PSS4HE
        serviceCode: EXPRESS
        paymentMode: PREPAID
        referenceNumber: PO-12345
        sender:
          contactName: Anita Rao
          phone: "+919800000001"
          line1: 12 Church Street
          city: Bengaluru
          state: Karnataka
          pincode: "560001"
        recipient:
          contactName: Vikram Singh
          phone: "+919800000002"
          line1: 34 Connaught Place
          city: New Delhi
          state: Delhi
          pincode: "110001"
        packages:
          - actualWeightGrams: 500
            lengthMm: 200
            widthMm: 150
            heightMm: 100
        contentDescription: Documents
    BookingAddress:
      type: object
      description: |
        Supply either a saved `addressId` (which must belong to the booking
        customer) or the full address. Explicit fields override the saved
        address, so you can start from a saved address and change the contact
        for one shipment.
      properties:
        addressId: { type: string }
        contactName: { type: string, minLength: 2, maxLength: 160 }
        companyName: { type: string }
        phone: { type: string }
        altPhone: { type: string }
        email: { type: string, format: email }
        line1: { type: string, minLength: 3, maxLength: 200 }
        line2: { type: string }
        landmark: { type: string }
        city: { type: string }
        state: { type: string }
        pincode: { $ref: "#/components/schemas/Pincode" }
        countryCode: { type: string, default: "NG" }
        latitude: { type: number }
        longitude: { type: number }
    ShipmentListItem:
      type: object
      properties:
        id: { type: string }
        awb: { type: string }
        referenceNumber: { type: string }
        status: { $ref: "#/components/schemas/ShipmentStatus" }
        statusChangedAt: { type: string, format: date-time }
        paymentMode: { $ref: "#/components/schemas/PaymentMode" }
        pieceCount: { type: integer }
        chargeableWeightGrams: { type: integer }
        currency: { type: string }
        totalAmountMinor: { $ref: "#/components/schemas/MinorAmount" }
        codAmountMinor: { $ref: "#/components/schemas/MinorAmount" }
        originPincode: { type: string }
        destinationPincode: { type: string }
        promisedDeliveryAt: { type: string, format: date-time }
        bookedAt: { type: string, format: date-time }
        customer:
          type: object
          properties:
            id: { type: string }
            code: { type: string }
            name: { type: string }
        service:
          type: object
          properties:
            code: { type: string }
            name: { type: string }
        originBranchCode: { type: string }
        destinationBranchCode: { type: string }
        recipientName: { type: string }
        recipientCity: { type: string }
    Shipment:
      type: object
      properties:
        id: { type: string }
        awb:
          type: string
          pattern: "^[A-Z]{2,4}[0-9]{6}[0-9]{6}$"
          description: "Tenant prefix, YYMMDD, then a six-digit daily sequence."
          examples: ["CSV260808000001"]
        referenceNumber: { type: string }
        status: { $ref: "#/components/schemas/ShipmentStatus" }
        statusChangedAt: { type: string, format: date-time }
        paymentMode: { $ref: "#/components/schemas/PaymentMode" }
        bookedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        customer:
          type: object
          properties: { id: { type: string }, code: { type: string }, name: { type: string } }
        service:
          type: object
          properties: { id: { type: string }, code: { type: string }, name: { type: string } }
        origin: { $ref: "#/components/schemas/ShipmentEndpoint" }
        destination: { $ref: "#/components/schemas/ShipmentEndpoint" }
        route:
          type: object
          description: The route snapshot taken at booking. Immutable.
          properties:
            routeCode: { type: string }
            resolutionSource: { $ref: "#/components/schemas/ResolutionSource" }
            transitHours: { type: integer }
            slaHours: { type: integer }
            legs: { type: array, items: { $ref: "#/components/schemas/RouteLeg" } }
            explanationId: { type: string }
        charges:
          type: object
          description: |
            The price snapshot taken at booking. Immutable: a later rate card
            change can never alter it.
          properties:
            currency: { type: string }
            rateCardCode: { type: string }
            rateCardVersion: { type: integer }
            pricingEngineVersion: { type: string }
            originZoneCode: { type: string }
            destinationZoneCode: { type: string }
            freightMinor: { $ref: "#/components/schemas/MinorAmount" }
            surchargeTotalMinor: { $ref: "#/components/schemas/MinorAmount" }
            discountTotalMinor: { $ref: "#/components/schemas/MinorAmount" }
            taxableMinor: { $ref: "#/components/schemas/MinorAmount" }
            taxTotalMinor: { $ref: "#/components/schemas/MinorAmount" }
            roundingMinor: { type: integer }
            totalMinor: { $ref: "#/components/schemas/MinorAmount" }
            lineItems: { type: array, items: { $ref: "#/components/schemas/LineItem" } }
        packages:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              sequence: { type: integer }
              pieceBarcode: { type: string }
              reference: { type: string }
              actualWeightGrams: { type: integer }
              volumetricWeightGrams: { type: integer }
              lengthMm: { type: integer }
              widthMm: { type: integer }
              heightMm: { type: integer }
              contentDescription: { type: string }
              declaredValueMinor: { $ref: "#/components/schemas/MinorAmount" }
        addresses:
          type: object
          description: The address snapshots taken at booking. Immutable.
          properties:
            sender: { type: object, additionalProperties: true }
            recipient: { type: object, additionalProperties: true }
        pieceCount: { type: integer }
        actualWeightGrams: { type: integer }
        volumetricWeightGrams: { type: integer }
        chargeableWeightGrams: { type: integer }
        currency: { type: string }
        declaredValueMinor: { $ref: "#/components/schemas/MinorAmount" }
        codAmountMinor: { $ref: "#/components/schemas/MinorAmount" }
        totalAmountMinor: { $ref: "#/components/schemas/MinorAmount" }
        insuranceRequired: { type: boolean }
        slaHours: { type: integer }
        promisedDeliveryAt: { type: string, format: date-time }
        contentDescription: { type: string }
        specialInstructions: { type: string }
        isFragile: { type: boolean }
        isDangerousGoods: { type: boolean }
        cancelledAt: { type: string, format: date-time }
        cancellationReason: { type: string }
        allowedTransitions:
          type: array
          items: { $ref: "#/components/schemas/ShipmentStatus" }
          description: |
            The state changes this build permits from the current status. Use it
            to decide which action buttons to show.
    ShipmentEndpoint:
      type: object
      properties:
        pincode: { type: string }
        branch: { $ref: "#/components/schemas/FacilityRef" }
        hub: { $ref: "#/components/schemas/FacilityRef" }
        isRemote: { type: boolean }
    ShipmentEvent:
      type: object
      properties:
        id: { type: string }
        sequence: { type: integer }
        eventType:
          type: string
          enum: [BOOKED, STATUS_CHANGED, CANCELLED, EXCEPTION, REMARK, LOCATION_UPDATE, SYSTEM]
        fromStatus: { $ref: "#/components/schemas/ShipmentStatus" }
        toStatus: { $ref: "#/components/schemas/ShipmentStatus" }
        occurredAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        description: { type: string, description: Safe to show to customers. }
        reasonCode: { type: string }
        actorName: { type: string }
        actorType: { type: string, enum: [USER, SYSTEM, CUSTOMER, PARTNER] }
        operatingUnitCode: { type: string }
        locationPincode: { type: string }
    Label:
      type: object
      properties:
        awb: { type: string }
        shipmentId: { type: string }
        referenceNumber: { type: string }
        barcodePayload: { type: string, description: The AWB. Encode as Code128. }
        barcodeFormat: { type: string, const: CODE128 }
        qrPayload:
          type: string
          description: 'Pipe-delimited, version prefixed: CSV1|awb|service|destBranch|pincode|pieces|weight|paymentMode|cod'
        carrierCode: { type: string }
        serviceCode: { type: string }
        serviceName: { type: string }
        serviceMode: { $ref: "#/components/schemas/TransportMode" }
        routingCode: { type: string, description: The sortation string, printed large. }
        originBranchCode: { type: string }
        originHubCode: { type: string }
        destinationHubCode: { type: string }
        destinationBranchCode: { type: string }
        sender: { $ref: "#/components/schemas/LabelParty" }
        recipient: { $ref: "#/components/schemas/LabelParty" }
        pieceCount: { type: integer }
        actualWeightGrams: { type: integer }
        chargeableWeightGrams: { type: integer }
        weightLabel: { type: string }
        paymentMode: { $ref: "#/components/schemas/PaymentMode" }
        codAmountMinor: { $ref: "#/components/schemas/MinorAmount" }
        codAmountLabel: { type: string }
        declaredValueMinor: { $ref: "#/components/schemas/MinorAmount" }
        currency: { type: string }
        contentDescription: { type: string }
        specialInstructions: { type: string }
        isFragile: { type: boolean }
        bookedAt: { type: string, format: date-time }
        promisedDeliveryAt: { type: string, format: date-time }
        generatedAt: { type: string, format: date-time }
        pieces:
          type: array
          items:
            type: object
            properties:
              sequence: { type: integer }
              barcode: { type: string }
              actualWeightGrams: { type: integer }
              dimensions: { type: string }
    LabelParty:
      type: object
      properties:
        name: { type: string }
        company: { type: string }
        phone: { type: string }
        line1: { type: string }
        line2: { type: string }
        landmark: { type: string }
        city: { type: string }
        state: { type: string }
        pincode: { type: string }


    # ---------------------------------------------------------------------
    # Release 2 — physical operations
    # ---------------------------------------------------------------------

    OperationalRef:
      type: object
      description: The compact {id, code, name} shape used across operational responses.
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }

    ScanType:
      type: string
      description: |
        The operations a scanner can perform.

        `RECEIVE` takes custody at a facility. `ARRIVAL` is the gate scan, kept
        distinct because hubs run arrival and inbound processing at different
        desks. `DEPARTURE` records a parcel leaving. `SORT` records a routing
        decision without changing custody. `HOLD` stops the parcel until
        `RELEASE`. `DAMAGE` and `EXCEPTION` need a supervisor.
      enum: [RECEIVE, ARRIVAL, DEPARTURE, SORT, HOLD, RELEASE, DAMAGE, EXCEPTION]

    ExceptionType:
      type: string
      enum: [MISSING, EXCESS, DAMAGED, MISROUTED, SEAL_BROKEN, UNKNOWN_BARCODE,
             WEIGHT_MISMATCH, COUNT_MISMATCH, WRONG_FACILITY, CUSTODY_OVERRIDE, OTHER]

    NDRAction:
      type: string
      description: What operations decided to do next about a failed delivery.
      enum: [REATTEMPT, RESCHEDULE, CONTACT_REQUIRED, ADDRESS_CORRECTION,
             CUSTOMER_PICKUP, RTO, ESCALATE]

    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }

    RemarksRequest:
      type: object
      properties:
        remarks: { type: string, maxLength: 500 }

    BarcodeRequest:
      type: object
      required: [barcode]
      properties:
        barcode: { type: string, minLength: 4, maxLength: 64 }

    BarcodeListRequest:
      type: object
      required: [barcodes]
      properties:
        barcodes:
          type: array
          items: { type: string, minLength: 4, maxLength: 64 }
          minItems: 1

    # ---- Pickup ---------------------------------------------------------

    PickupWindow:
      type: object
      properties:
        date: { type: string, format: date }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }

    PickupAddress:
      type: object
      properties:
        contactName: { type: string }
        phone: { type: string }
        altPhone: { type: string }
        line1: { type: string }
        line2: { type: string }
        landmark: { type: string }
        city: { type: string }
        state: { type: string }
        pincode: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }

    CreatePickupRequest:
      type: object
      required: [customerId, pickupType, scheduledDate, windowStart, windowEnd]
      properties:
        customerId: { type: string }
        pickupType: { type: string, enum: [SCHEDULED, ON_DEMAND, BULK, RECURRING] }
        addressId:
          type: string
          description: A saved customer address. Honoured only when it belongs to this customer.
        contactName: { type: string }
        contactPhone: { type: string }
        altPhone: { type: string }
        line1: { type: string }
        line2: { type: string }
        landmark: { type: string }
        city: { type: string }
        state: { type: string }
        pincode: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        scheduledDate: { type: string, format: date }
        windowStart: { type: string, format: date-time }
        windowEnd: { type: string, format: date-time }
        expectedPieceCount: { type: integer, minimum: 1, maximum: 5000 }
        expectedWeightGrams: { type: integer, minimum: 1 }
        specialInstructions: { type: string }
        maxAttempts: { type: integer, minimum: 1, maximum: 10, default: 3 }
        shipmentIds:
          type: array
          items: { type: string }
          description: Shipments already booked and awaiting collection.
        metadata: { type: object, additionalProperties: true }

    PickupShipmentLine:
      type: object
      properties:
        shipmentId: { type: string }
        awb: { type: string }
        status: { type: string }
        pieceCount: { type: integer }
        weightGrams: { type: integer }
        paymentMode: { type: string }
        addedAt: { type: string, format: date-time }
        remarks: { type: string }

    PickupAssignment:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [ASSIGNED, ACCEPTED, REJECTED, ARRIVED, COMPLETED, FAILED, CANCELLED, REASSIGNED] }
        agent: { $ref: '#/components/schemas/OperationalRef' }
        stopSequence: { type: integer }
        assignedAt: { type: string, format: date-time }
        acceptedAt: { type: string, format: date-time }
        arrivedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        rejectionReason: { type: string }
        runId: { type: string }

    PickupAttempt:
      type: object
      properties:
        id: { type: string }
        attemptNumber: { type: integer }
        outcome: { type: string, enum: [COMPLETED, PARTIAL, FAILED, RESCHEDULED, CANCELLED_ON_SITE] }
        failureReasonCode: { type: string }
        remarks: { type: string }
        piecesCollected: { type: integer }
        weightGrams: { type: integer }
        agentName: { type: string }
        occurredAt: { type: string, format: date-time, description: When the agent says it happened. }
        recordedAt: { type: string, format: date-time, description: When the server received it. }
        nextAttemptAt: { type: string, format: date-time }

    PickupRequest:
      type: object
      properties:
        id: { type: string }
        referenceCode: { type: string }
        status:
          type: string
          enum: [REQUESTED, SCHEDULED, ASSIGNED, ACCEPTED, IN_PROGRESS,
                 COMPLETED, PARTIALLY_COMPLETED, FAILED, CANCELLED, EXPIRED]
        pickupType: { type: string }
        customer: { $ref: '#/components/schemas/OperationalRef' }
        branch: { $ref: '#/components/schemas/OperationalRef' }
        address: { $ref: '#/components/schemas/PickupAddress' }
        window: { $ref: '#/components/schemas/PickupWindow' }
        expectedPieceCount: { type: integer }
        expectedWeightGrams: { type: integer }
        actualPieceCount: { type: integer }
        attemptCount: { type: integer }
        maxAttempts: { type: integer }
        specialInstructions: { type: string }
        shipments: { type: array, items: { $ref: '#/components/schemas/PickupShipmentLine' } }
        assignment: { $ref: '#/components/schemas/PickupAssignment' }
        attempts: { type: array, items: { $ref: '#/components/schemas/PickupAttempt' } }
        completedAt: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time }
        cancellationReason: { type: string }
        failureReason: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        replayedAttemptId:
          type: string
          description: Set when an offline retry returned the original attempt.

    PickupSummary:
      type: object
      properties:
        id: { type: string }
        referenceCode: { type: string }
        status: { type: string }
        pickupType: { type: string }
        customer: { $ref: '#/components/schemas/OperationalRef' }
        branch: { $ref: '#/components/schemas/OperationalRef' }
        contactName: { type: string }
        phone: { type: string }
        line1: { type: string }
        city: { type: string }
        pincode: { type: string }
        window: { $ref: '#/components/schemas/PickupWindow' }
        expectedPieceCount: { type: integer }
        actualPieceCount: { type: integer }
        attemptCount: { type: integer }
        maxAttempts: { type: integer }
        agentName: { type: string }
        agentId: { type: string }
        createdAt: { type: string, format: date-time }

    PickupPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/PickupSummary' } }

    AssignPickupRequest:
      type: object
      required: [agentId]
      properties:
        agentId: { type: string }
        runId: { type: string }
        stopSequence: { type: integer, minimum: 1, maximum: 500 }

    RespondPickupRequest:
      type: object
      required: [accept]
      properties:
        accept: { type: boolean }
        reason: { type: string, description: Required when rejecting. }

    ArrivePickupRequest:
      type: object
      properties:
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }

    CompletePickupRequest:
      type: object
      required: [outcome]
      properties:
        outcome: { type: string, enum: [COMPLETED, PARTIAL, FAILED, RESCHEDULED, CANCELLED_ON_SITE] }
        collectedShipmentIds:
          type: array
          items: { type: string }
          description: |
            What was actually handed over. Anything on the request and not named
            here is marked NOT_AVAILABLE rather than silently collected.
        loosePieces: { type: integer, minimum: 0, maximum: 5000 }
        weightGrams: { type: integer, minimum: 0 }
        failureReasonCode: { type: string }
        remarks: { type: string }
        occurredAt: { type: string, format: date-time }
        nextAttemptAt: { type: string, format: date-time }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }

    AgentStop:
      type: object
      properties:
        assignmentId: { type: string }
        requestId: { type: string }
        referenceCode: { type: string }
        status: { type: string }
        requestStatus: { type: string }
        pickupType: { type: string }
        stopSequence: { type: integer }
        customerName: { type: string }
        address: { $ref: '#/components/schemas/PickupAddress' }
        window: { $ref: '#/components/schemas/PickupWindow' }
        expectedPieceCount: { type: integer }
        specialInstructions: { type: string }
        acceptedAt: { type: string, format: date-time }
        arrivedAt: { type: string, format: date-time }

    AgentStopList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AgentStop' } }

    CreatePickupRunRequest:
      type: object
      required: [agentId, runDate]
      properties:
        branchId: { type: string }
        agentId: { type: string }
        runDate: { type: string, format: date }
        vehicleReference: { type: string }

    PickupRun:
      type: object
      properties:
        id: { type: string }
        runCode: { type: string }
        status: { type: string, enum: [PLANNED, STARTED, COMPLETED, CANCELLED] }
        runDate: { type: string, format: date }
        branch: { $ref: '#/components/schemas/OperationalRef' }
        agent: { $ref: '#/components/schemas/OperationalRef' }
        vehicleReference: { type: string }
        plannedStops: { type: integer }
        completedStops: { type: integer }
        collectedPieces: { type: integer }
        createdAt: { type: string, format: date-time }

    PickupRunList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/PickupRun' } }

    # ---- Scanning -------------------------------------------------------

    ScanRequest:
      type: object
      required: [barcode, scanType]
      properties:
        barcode: { type: string, minLength: 4, maxLength: 64, description: An AWB or a per-piece barcode. }
        scanType: { $ref: '#/components/schemas/ScanType' }
        operatingUnitId: { type: string }
        occurredAt:
          type: string
          format: date-time
          description: |
            When the device says the scan happened. Recorded verbatim, but the
            value used for ordering is clamped to a plausible window: a wrong
            device clock must not be able to reorder history, and a deliberate
            backdate must not escape an audit window.
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        reason: { type: string, description: Required for HOLD, DAMAGE and EXCEPTION. }
        reasonCode: { type: string }
        remarks: { type: string }
        sortDestination: { type: string }
        override:
          type: boolean
          description: |
            Force the scan past a custody refusal. Requires
            `shipment.override_custody` and is always audited with the rule that
            was bypassed.

    ScanResult:
      type: object
      properties:
        barcode: { type: string }
        outcome: { type: string, enum: [ACCEPTED, DUPLICATE, REJECTED] }
        scanId: { type: string }
        shipmentId: { type: string }
        awb: { type: string }
        fromStatus: { type: string }
        toStatus: { type: string }
        occurredAt: { type: string, format: date-time }
        rejectionCode: { type: string }
        rejectionMessage: { type: string }
        nextAction:
          type: string
          description: What the parcel needs now, so the handset can show a work instruction.

    BulkScanItem:
      type: object
      required: [barcode]
      properties:
        barcode: { type: string }
        occurredAt: { type: string, format: date-time }
        deviceEventId: { type: string }
        reason: { type: string }
        reasonCode: { type: string }
        remarks: { type: string }
        sortDestination: { type: string }

    BulkScanRequest:
      type: object
      required: [scanType, items]
      properties:
        scanType: { $ref: '#/components/schemas/ScanType' }
        operatingUnitId: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        override: { type: boolean }
        items:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/BulkScanItem' }

    BulkScanResult:
      type: object
      properties:
        accepted: { type: integer }
        duplicate: { type: integer }
        rejected: { type: integer }
        results: { type: array, items: { $ref: '#/components/schemas/ScanResult' } }

    ScanHistoryEntry:
      type: object
      properties:
        id: { type: string }
        barcode: { type: string }
        scanType: { type: string }
        outcome: { type: string }
        rejectionCode: { type: string }
        rejectionMessage: { type: string }
        shipmentId: { type: string }
        awb: { type: string }
        fromStatus: { type: string }
        toStatus: { type: string }
        facility: { $ref: '#/components/schemas/OperationalRef' }
        scannedBy: { $ref: '#/components/schemas/OperationalRef' }
        source: { type: string }
        deviceId: { type: string }
        occurredAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }

    ScanHistoryPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/ScanHistoryEntry' } }

    # ---- Bagging --------------------------------------------------------

    CreateBagRequest:
      type: object
      required: [destinationUnitId]
      properties:
        originUnitId: { type: string }
        destinationUnitId: { type: string }
        bagType: { type: string, enum: [STANDARD, SECURE, FRAGILE, DOCUMENT, RETURN], default: STANDARD }
        serviceCode: { type: string, description: Restricts the bag to one courier service. }
        direction: { type: string, enum: [FORWARD, REVERSE], default: FORWARD }
        maxWeightGrams: { type: integer, minimum: 1 }
        maxShipments: { type: integer, minimum: 1 }
        metadata: { type: object, additionalProperties: true }

    BagItem:
      type: object
      properties:
        shipmentId: { type: string }
        awb: { type: string }
        status: { type: string, description: The shipment's lifecycle status. }
        itemStatus: { type: string, enum: [IN_BAG, REMOVED, MISSING, EXCESS, DAMAGED, DELIVERED_SHORT] }
        pieceCount: { type: integer }
        weightGrams: { type: integer }
        destinationPincode: { type: string }
        addedAt: { type: string, format: date-time }
        addedBy: { type: string }
        removedAt: { type: string, format: date-time }
        removalReason: { type: string }
        verifiedAt: { type: string, format: date-time }

    BagSeal:
      type: object
      properties:
        sealNumber: { type: string }
        sealType: { type: string, enum: [PLASTIC, METAL, ELECTRONIC, TAPE] }
        appliedAt: { type: string, format: date-time }
        appliedBy: { type: string }
        verifiedAt: { type: string, format: date-time }
        verifiedBy: { type: string }
        verificationResult: { type: string, enum: [INTACT, BROKEN, MISSING, MISMATCH] }
        verificationRemarks: { type: string }
        brokenAt: { type: string, format: date-time }

    OperationalEvent:
      type: object
      properties:
        id: { type: string }
        sequence: { type: integer }
        eventType: { type: string }
        fromStatus: { type: string }
        toStatus: { type: string }
        description: { type: string }
        reasonCode: { type: string }
        actor: { type: string }
        facility: { type: string }
        occurredAt: { type: string, format: date-time }

    BagDeclaredItem:
      type: object
      properties:
        awb: { type: string }
        shipmentId: { type: string }
        pieceCount: { type: integer }
        weightGrams: { type: integer }
        destinationPincode: { type: string }

    BagDeclaration:
      type: object
      description: |
        The frozen content snapshot taken at closure. Reconciliation is measured
        against this, never against a live read, and it is never rewritten — a
        post-closure correction is layered on top.
      properties:
        closedAt: { type: string, format: date-time }
        closedBy: { type: string }
        originCode: { type: string }
        destinationCode: { type: string }
        shipmentCount: { type: integer }
        pieceCount: { type: integer }
        totalWeightGrams: { type: integer, format: int64 }
        grossWeightGrams: { type: integer }
        seals: { type: array, items: { type: string } }
        items: { type: array, items: { $ref: '#/components/schemas/BagDeclaredItem' } }

    Bag:
      type: object
      properties:
        id: { type: string }
        bagCode: { type: string }
        barcode: { type: string }
        status: { type: string, enum: [OPEN, CLOSED, DISPATCHED, RECEIVED, OPENED, RECONCILED, CANCELLED] }
        bagType: { type: string }
        direction: { type: string }
        origin: { $ref: '#/components/schemas/OperationalRef' }
        destination: { $ref: '#/components/schemas/OperationalRef' }
        service: { $ref: '#/components/schemas/OperationalRef' }
        shipmentCount: { type: integer }
        pieceCount: { type: integer }
        totalWeightGrams: { type: integer, format: int64 }
        grossWeightGrams: { type: integer }
        maxWeightGrams: { type: integer }
        maxShipments: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/BagItem' } }
        seals: { type: array, items: { $ref: '#/components/schemas/BagSeal' } }
        events: { type: array, items: { $ref: '#/components/schemas/OperationalEvent' } }
        declaredContents: { $ref: '#/components/schemas/BagDeclaration' }
        closedAt: { type: string, format: date-time }
        closedBy: { type: string }
        dispatchedAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
        receivedBy: { type: string }
        openedAtDestination: { type: string, format: date-time }
        reconciledAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        allowedTransitions:
          type: array
          items: { type: string }
          description: The states this bag can move to next, so the console renders only valid actions.

    BagSummary:
      type: object
      properties:
        id: { type: string }
        bagCode: { type: string }
        barcode: { type: string }
        status: { type: string }
        bagType: { type: string }
        direction: { type: string }
        origin: { $ref: '#/components/schemas/OperationalRef' }
        destination: { $ref: '#/components/schemas/OperationalRef' }
        serviceCode: { type: string }
        shipmentCount: { type: integer }
        pieceCount: { type: integer }
        totalWeightGrams: { type: integer, format: int64 }
        closedAt: { type: string, format: date-time }
        dispatchedAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    BagPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/BagSummary' } }

    ItemResult:
      type: object
      properties:
        barcode: { type: string }
        outcome: { type: string, enum: [ADDED, REJECTED] }
        shipmentId: { type: string }
        awb: { type: string }
        reason: { type: string, description: The machine-readable refusal code. }
        message: { type: string }

    AddBagItemsResult:
      type: object
      properties:
        added: { type: integer }
        rejected: { type: integer }
        results: { type: array, items: { $ref: '#/components/schemas/ItemResult' } }
        bag: { $ref: '#/components/schemas/Bag' }

    CloseBagRequest:
      type: object
      properties:
        sealNumbers: { type: array, items: { type: string, minLength: 3, maxLength: 64 } }
        sealType: { type: string, enum: [PLASTIC, METAL, ELECTRONIC, TAPE] }
        grossWeightGrams: { type: integer, minimum: 1, maximum: 2000000 }

    VerifySealRequest:
      type: object
      required: [sealNumber, result]
      properties:
        sealNumber: { type: string }
        result: { type: string, enum: [INTACT, BROKEN, MISSING, MISMATCH] }
        remarks: { type: string }

    BagCorrectionRequest:
      type: object
      required: [barcode, action, reason, exceptionId]
      properties:
        barcode: { type: string }
        action: { type: string, enum: [REMOVE] }
        reason: { type: string, minLength: 5 }
        exceptionId: { type: string, description: The exception this correction is justified by. }

    # ---- Manifest -------------------------------------------------------

    CreateManifestRequest:
      type: object
      required: [destinationUnitId]
      properties:
        originUnitId: { type: string }
        destinationUnitId: { type: string }
        tripId: { type: string }
        direction: { type: string, enum: [FORWARD, REVERSE], default: FORWARD }
        remarks: { type: string }
        metadata: { type: object, additionalProperties: true }

    ManifestBagLine:
      type: object
      properties:
        bagId: { type: string }
        bagCode: { type: string }
        barcode: { type: string }
        bagStatus: { type: string }
        lineStatus: { type: string, enum: [LOADED, REMOVED, RECEIVED, MISSING, EXCESS, DAMAGED] }
        destinationCode: { type: string }
        declaredShipmentCount: { type: integer }
        declaredPieceCount: { type: integer }
        declaredWeightGrams: { type: integer, format: int64 }
        actualShipmentCount: { type: integer }
        addedAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }

    ManifestLooseLine:
      type: object
      properties:
        shipmentId: { type: string }
        awb: { type: string }
        status: { type: string }
        lineStatus: { type: string }
        pieceCount: { type: integer }
        weightGrams: { type: integer }
        destinationPincode: { type: string }
        addedAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }

    ManifestTripRef:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        status: { type: string }
        mode: { type: string }

    ManifestDeclaration:
      type: object
      description: The frozen content snapshot taken at closure.
      properties:
        closedAt: { type: string, format: date-time }
        closedBy: { type: string }
        originCode: { type: string }
        destinationCode: { type: string }
        bagCount: { type: integer }
        looseShipmentCount: { type: integer }
        totalShipmentCount: { type: integer }
        totalPieceCount: { type: integer }
        totalWeightGrams: { type: integer, format: int64 }
        declaredWeightGrams: { type: integer, format: int64 }
        bags:
          type: array
          items:
            type: object
            properties:
              bagCode: { type: string }
              barcode: { type: string }
              shipmentCount: { type: integer }
              pieceCount: { type: integer }
              weightGrams: { type: integer, format: int64 }
              destinationCode: { type: string }
        looseShipments:
          type: array
          items:
            type: object
            properties:
              awb: { type: string }
              pieceCount: { type: integer }
              weightGrams: { type: integer }
              destinationPincode: { type: string }

    Manifest:
      type: object
      properties:
        id: { type: string }
        manifestCode: { type: string }
        status: { type: string, enum: [DRAFT, CLOSED, DISPATCHED, RECEIVED, RECONCILED, CANCELLED] }
        direction: { type: string }
        origin: { $ref: '#/components/schemas/OperationalRef' }
        destination: { $ref: '#/components/schemas/OperationalRef' }
        trip: { $ref: '#/components/schemas/ManifestTripRef' }
        bagCount: { type: integer }
        looseShipmentCount: { type: integer }
        totalShipmentCount: { type: integer }
        totalPieceCount: { type: integer }
        totalWeightGrams: { type: integer, format: int64 }
        declaredWeightGrams: { type: integer, format: int64 }
        bags: { type: array, items: { $ref: '#/components/schemas/ManifestBagLine' } }
        looseShipments: { type: array, items: { $ref: '#/components/schemas/ManifestLooseLine' } }
        events: { type: array, items: { $ref: '#/components/schemas/OperationalEvent' } }
        declaredContents: { $ref: '#/components/schemas/ManifestDeclaration' }
        documentReady: { type: boolean, description: Whether the printable document has been generated. }
        closedAt: { type: string, format: date-time }
        closedBy: { type: string }
        dispatchedAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
        receivedBy: { type: string }
        reconciledAt: { type: string, format: date-time }
        remarks: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        allowedTransitions: { type: array, items: { type: string } }

    ManifestSummary:
      type: object
      properties:
        id: { type: string }
        manifestCode: { type: string }
        status: { type: string }
        direction: { type: string }
        origin: { $ref: '#/components/schemas/OperationalRef' }
        destination: { $ref: '#/components/schemas/OperationalRef' }
        tripCode: { type: string }
        bagCount: { type: integer }
        looseShipmentCount: { type: integer }
        totalShipmentCount: { type: integer }
        totalPieceCount: { type: integer }
        totalWeightGrams: { type: integer, format: int64 }
        documentReady: { type: boolean }
        closedAt: { type: string, format: date-time }
        dispatchedAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    ManifestPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/ManifestSummary' } }

    ManifestContentRequest:
      type: object
      properties:
        bagCodes: { type: array, items: { type: string }, description: Closed bag barcodes or bag codes. }
        barcodes: { type: array, items: { type: string }, description: Loose shipment AWBs. }

    ContentResult:
      type: object
      properties:
        reference: { type: string }
        kind: { type: string, enum: [BAG, SHIPMENT] }
        outcome: { type: string, enum: [ADDED, REJECTED] }
        reason: { type: string }
        message: { type: string }

    AddManifestContentResult:
      type: object
      properties:
        added: { type: integer }
        rejected: { type: integer }
        results: { type: array, items: { $ref: '#/components/schemas/ContentResult' } }
        manifest: { $ref: '#/components/schemas/Manifest' }

    RemoveManifestContentRequest:
      type: object
      required: [kind, reference, reason]
      properties:
        kind: { type: string, enum: [BAG, SHIPMENT] }
        reference: { type: string }
        reason: { type: string }

    CloseManifestRequest:
      type: object
      properties:
        declaredWeightGrams:
          type: integer
          format: int64
          description: The weight the sending facility declares, compared at receipt.

    # ---- Line haul ------------------------------------------------------

    CarrierRequest:
      type: object
      required: [code, name, carrierType, modes]
      properties:
        code: { type: string }
        name: { type: string }
        carrierType: { type: string, enum: [OWN, CONTRACTED, PARTNER, COURIER_PARTNER] }
        modes: { type: array, items: { type: string, enum: [ROAD, AIR, RAIL, PARTNER] }, minItems: 1 }
        contactName: { type: string }
        contactPhone: { type: string }
        contactEmail: { type: string, format: email }
        gstNumber: { type: string }
        metadata: { type: object, additionalProperties: true }

    Carrier:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        carrierType: { type: string }
        modes: { type: array, items: { type: string } }
        contactName: { type: string }
        contactPhone: { type: string }
        contactEmail: { type: string }
        gstNumber: { type: string }
        isActive: { type: boolean }

    CarrierList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Carrier' } }

    VehicleRequest:
      type: object
      required: [registrationNumber, vehicleType]
      properties:
        carrierId: { type: string }
        registrationNumber: { type: string }
        vehicleType: { type: string, enum: [BIKE, VAN, TEMPO, TRUCK, CONTAINER, TRAILER, OTHER] }
        capacityWeightGrams: { type: integer, format: int64 }
        capacityVolumeCc: { type: integer, format: int64 }
        baseUnitId: { type: string }
        metadata: { type: object, additionalProperties: true }

    Vehicle:
      type: object
      properties:
        id: { type: string }
        registrationNumber: { type: string }
        vehicleType: { type: string }
        carrierCode: { type: string }
        carrierName: { type: string }
        capacityWeightGrams: { type: integer, format: int64 }
        isActive: { type: boolean }

    VehicleList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Vehicle' } }

    DriverRequest:
      type: object
      required: [code, fullName, phone]
      properties:
        carrierId: { type: string }
        userId: { type: string, description: Optional. A contracted carrier's driver may have no login. }
        code: { type: string }
        fullName: { type: string }
        phone: { type: string }
        licenceNumber: { type: string }
        baseUnitId: { type: string }
        metadata: { type: object, additionalProperties: true }

    Driver:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        fullName: { type: string }
        phone: { type: string }
        carrierCode: { type: string }
        isActive: { type: boolean }

    DriverList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Driver' } }

    TripWindow:
      type: object
      properties:
        departure: { type: string, format: date-time }
        arrival: { type: string, format: date-time }

    TripLegRequest:
      type: object
      required: [originUnitId, destinationUnitId, scheduledDeparture, scheduledArrival]
      properties:
        originUnitId: { type: string }
        destinationUnitId: { type: string }
        scheduledDeparture: { type: string, format: date-time }
        scheduledArrival: { type: string, format: date-time }
        distanceKm: { type: integer, minimum: 0 }

    CreateTripRequest:
      type: object
      required: [mode, destinationUnitId, scheduledDeparture, scheduledArrival]
      properties:
        mode: { type: string, enum: [ROAD, AIR, RAIL, PARTNER] }
        originUnitId: { type: string }
        destinationUnitId: { type: string }
        direction: { type: string, enum: [FORWARD, REVERSE], default: FORWARD }
        carrierId: { type: string }
        vehicleId: { type: string }
        driverId: { type: string }
        externalReference:
          type: string
          description: The flight number, train number or partner AWB. Required to depart a non-road trip.
        scheduledDeparture: { type: string, format: date-time }
        scheduledArrival: { type: string, format: date-time }
        legs:
          type: array
          items: { $ref: '#/components/schemas/TripLegRequest' }
          description: |
            Intermediate stops. Validated as a chain: each leg must start where
            the previous ended, and the chain must run from the trip's origin to
            its destination.
        metadata: { type: object, additionalProperties: true }

    TripLeg:
      type: object
      properties:
        id: { type: string }
        sequence: { type: integer }
        status: { type: string, enum: [PLANNED, LOADING, DEPARTED, ARRIVED, SKIPPED, CANCELLED] }
        origin: { $ref: '#/components/schemas/OperationalRef' }
        destination: { $ref: '#/components/schemas/OperationalRef' }
        scheduled: { $ref: '#/components/schemas/TripWindow' }
        actualDeparture: { type: string, format: date-time }
        actualArrival: { type: string, format: date-time }
        distanceKm: { type: integer }
        remarks: { type: string }

    TripCrewMember:
      type: object
      properties:
        id: { type: string }
        role: { type: string, enum: [DRIVER, CO_DRIVER, LOADER, ESCORT, SUPERVISOR] }
        name: { type: string }
        phone: { type: string }
        status: { type: string }

    TripManifestLine:
      type: object
      properties:
        id: { type: string }
        manifestCode: { type: string }
        status: { type: string }
        originCode: { type: string }
        destinationCode: { type: string }
        bagCount: { type: integer }
        shipmentCount: { type: integer }
        pieceCount: { type: integer }
        weightGrams: { type: integer, format: int64 }

    TripVehicleRef:
      type: object
      properties:
        id: { type: string }
        registrationNumber: { type: string }
        vehicleType: { type: string }

    TripDriverRef:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        phone: { type: string }

    Trip:
      type: object
      properties:
        id: { type: string }
        tripCode: { type: string }
        mode: { type: string }
        status: { type: string, enum: [PLANNED, LOADING, DEPARTED, IN_TRANSIT, ARRIVED, CLOSED, CANCELLED] }
        direction: { type: string }
        origin: { $ref: '#/components/schemas/OperationalRef' }
        destination: { $ref: '#/components/schemas/OperationalRef' }
        carrier: { $ref: '#/components/schemas/OperationalRef' }
        vehicle: { $ref: '#/components/schemas/TripVehicleRef' }
        driver: { $ref: '#/components/schemas/TripDriverRef' }
        externalReference: { type: string }
        scheduled: { $ref: '#/components/schemas/TripWindow' }
        actualDeparture: { type: string, format: date-time }
        actualArrival: { type: string, format: date-time }
        currentLegSequence: { type: integer }
        legs: { type: array, items: { $ref: '#/components/schemas/TripLeg' } }
        crew: { type: array, items: { $ref: '#/components/schemas/TripCrewMember' } }
        manifests: { type: array, items: { $ref: '#/components/schemas/TripManifestLine' } }
        events: { type: array, items: { $ref: '#/components/schemas/OperationalEvent' } }
        manifestCount: { type: integer }
        bagCount: { type: integer }
        shipmentCount: { type: integer }
        totalWeightGrams: { type: integer, format: int64 }
        sealNumber: { type: string }
        departureOdometerKm: { type: integer }
        arrivalOdometerKm: { type: integer }
        closedAt: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time }
        cancellationReason: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        allowedTransitions: { type: array, items: { type: string } }

    TripSummary:
      type: object
      properties:
        id: { type: string }
        tripCode: { type: string }
        mode: { type: string }
        status: { type: string }
        direction: { type: string }
        origin: { $ref: '#/components/schemas/OperationalRef' }
        destination: { $ref: '#/components/schemas/OperationalRef' }
        scheduled: { $ref: '#/components/schemas/TripWindow' }
        actualDeparture: { type: string, format: date-time }
        actualArrival: { type: string, format: date-time }
        vehicleRegistration: { type: string }
        driverName: { type: string }
        carrierName: { type: string }
        manifestCount: { type: integer }
        bagCount: { type: integer }
        shipmentCount: { type: integer }
        totalWeightGrams: { type: integer, format: int64 }
        legCount: { type: integer }
        currentLegSequence: { type: integer }
        createdAt: { type: string, format: date-time }

    TripPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/TripSummary' } }

    AssignTripRequest:
      type: object
      properties:
        vehicleId: { type: string }
        driverId: { type: string }
        carrierId: { type: string }
        externalReference: { type: string }

    AttachManifestRequest:
      type: object
      required: [manifestId]
      properties:
        manifestId: { type: string }
        legSequence: { type: integer, minimum: 1, description: Required when the manifest travels only part of a multi-leg trip. }

    DepartTripRequest:
      type: object
      properties:
        odometerKm: { type: integer, minimum: 0 }
        sealNumber: { type: string }
        occurredAt: { type: string, format: date-time }

    ArriveTripRequest:
      type: object
      properties:
        odometerKm: { type: integer, minimum: 0 }
        occurredAt: { type: string, format: date-time }
        legSequence: { type: integer, minimum: 1 }

    # ---- Hub operations -------------------------------------------------

    HubWorkloadSummary:
      type: object
      description: The whole facility dashboard in one round trip.
      properties:
        facility: { $ref: '#/components/schemas/OperationalRef' }
        shipmentsInCustody: { type: integer, format: int64 }
        openBags: { type: integer, format: int64 }
        closedBags: { type: integer, format: int64 }
        inboundBags: { type: integer, format: int64 }
        draftManifests: { type: integer, format: int64 }
        inboundManifests: { type: integer, format: int64 }
        inboundTrips: { type: integer, format: int64 }
        outboundTrips: { type: integer, format: int64 }
        readyForDelivery: { type: integer, format: int64 }
        outForDelivery: { type: integer, format: int64 }
        ndrPending: { type: integer, format: int64 }
        openExceptions: { type: integer, format: int64 }
        onHold: { type: integer, format: int64 }
        pendingPickups: { type: integer, format: int64 }
        generatedAt: { type: string, format: date-time }

    InboundManifest:
      type: object
      properties:
        id: { type: string }
        manifestCode: { type: string }
        origin: { $ref: '#/components/schemas/OperationalRef' }
        bagCount: { type: integer }
        totalShipmentCount: { type: integer }
        totalPieceCount: { type: integer }
        totalWeightGrams: { type: integer, format: int64 }
        dispatchedAt: { type: string, format: date-time }
        trip: { $ref: '#/components/schemas/ManifestTripRef' }
        expectedArrival: { type: string, format: date-time }
        vehicleRegistration: { type: string }

    InboundTrip:
      type: object
      properties:
        id: { type: string }
        tripCode: { type: string }
        mode: { type: string }
        status: { type: string }
        origin: { $ref: '#/components/schemas/OperationalRef' }
        expectedArrival: { type: string, format: date-time }
        actualDeparture: { type: string, format: date-time }
        manifestCount: { type: integer }
        bagCount: { type: integer }
        shipmentCount: { type: integer }
        vehicleRegistration: { type: string }
        driverName: { type: string }
        driverPhone: { type: string }

    HubInbound:
      type: object
      properties:
        facility: { $ref: '#/components/schemas/OperationalRef' }
        manifests: { type: array, items: { $ref: '#/components/schemas/InboundManifest' } }
        trips: { type: array, items: { $ref: '#/components/schemas/InboundTrip' } }

    CustodyItem:
      type: object
      properties:
        shipmentId: { type: string }
        awb: { type: string }
        status: { type: string }
        statusChangedAt: { type: string, format: date-time }
        pieceCount: { type: integer }
        chargeableWeightGrams: { type: integer }
        destinationPincode: { type: string }
        promisedDeliveryAt: { type: string, format: date-time }
        isHeld: { type: boolean }
        movementDirection: { type: string, enum: [FORWARD, REVERSE] }
        bagCode: { type: string }
        destinationBranchCode: { type: string }

    CustodyPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/CustodyItem' } }

    ThroughputBucket:
      type: object
      properties:
        hour: { type: string, format: date-time }
        scanType: { type: string }
        count: { type: integer, format: int64 }

    ThroughputSeries:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ThroughputBucket' } }

    RaiseExceptionRequest:
      type: object
      required: [exceptionType, description]
      properties:
        exceptionType: { $ref: '#/components/schemas/ExceptionType' }
        severity: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        barcode: { type: string }
        bagCode: { type: string }
        description: { type: string, minLength: 5 }
        expectedCount: { type: integer }
        actualCount: { type: integer }
        assignToUserId: { type: string }
        metadata: { type: object, additionalProperties: true }

    OperationalException:
      type: object
      properties:
        id: { type: string }
        exceptionCode: { type: string }
        exceptionType: { $ref: '#/components/schemas/ExceptionType' }
        severity: { type: string }
        status: { type: string, enum: [OPEN, INVESTIGATING, RESOLVED, WRITTEN_OFF, CANCELLED] }
        facility: { $ref: '#/components/schemas/OperationalRef' }
        shipmentId: { type: string }
        awb: { type: string }
        bagId: { type: string }
        bagCode: { type: string }
        manifestId: { type: string }
        manifestCode: { type: string }
        rawBarcode: { type: string }
        description: { type: string }
        expectedCount: { type: integer }
        actualCount: { type: integer }
        raisedAt: { type: string, format: date-time }
        raisedBy: { type: string }
        assignedTo: { type: string }
        resolutionAction: { type: string }
        resolutionNotes: { type: string }
        resolvedAt: { type: string, format: date-time }
        resolvedBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ExceptionSummary:
      type: object
      properties:
        id: { type: string }
        exceptionCode: { type: string }
        exceptionType: { type: string }
        severity: { type: string }
        status: { type: string }
        facility: { $ref: '#/components/schemas/OperationalRef' }
        awb: { type: string }
        shipmentId: { type: string }
        bagCode: { type: string }
        description: { type: string }
        rawBarcode: { type: string }
        raisedAt: { type: string, format: date-time }
        raisedBy: { type: string }
        assignedTo: { type: string }
        resolvedAt: { type: string, format: date-time }
        resolutionAction: { type: string }
        createdAt: { type: string, format: date-time }

    ExceptionPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/ExceptionSummary' } }

    ResolveExceptionRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [INVESTIGATING, RESOLVED, WRITTEN_OFF, CANCELLED] }
        resolutionAction:
          type: string
          enum: [FOUND, RETURNED_TO_ORIGIN, FORWARDED, REBAGGED, DELIVERED,
                 WRITTEN_OFF, CLAIM_FILED, CORRECTED, NO_ACTION]
          description: Required when closing.
        resolutionNotes: { type: string, description: Required when closing. }
        assignToUserId: { type: string }

    StartReconciliationRequest:
      type: object
      required: [subjectType]
      properties:
        subjectType: { type: string, enum: [BAG, MANIFEST] }
        bagId: { type: string }
        manifestId: { type: string }

    ReconciliationItem:
      type: object
      properties:
        barcode: { type: string }
        itemType: { type: string, enum: [SHIPMENT, BAG, PACKAGE, UNKNOWN] }
        outcome: { type: string, enum: [EXPECTED, MATCHED, MISSING, EXCESS, DAMAGED, MISROUTED] }
        wasDeclared: { type: boolean }
        shipmentId: { type: string }
        awb: { type: string }
        bagCode: { type: string }
        shipmentStatus: { type: string }
        scannedAt: { type: string, format: date-time }
        exceptionId: { type: string }
        remarks: { type: string }

    Reconciliation:
      type: object
      properties:
        id: { type: string }
        reconciliationCode: { type: string }
        subjectType: { type: string }
        status: { type: string, enum: [IN_PROGRESS, COMPLETED, COMPLETED_WITH_EXCEPTIONS, ABANDONED] }
        facility: { $ref: '#/components/schemas/OperationalRef' }
        bagId: { type: string }
        bagCode: { type: string }
        manifestId: { type: string }
        manifestCode: { type: string }
        expectedCount: { type: integer }
        scannedCount: { type: integer }
        matchedCount: { type: integer }
        missingCount: { type: integer }
        excessCount: { type: integer }
        damagedCount: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/ReconciliationItem' } }
        startedAt: { type: string, format: date-time }
        startedBy: { type: string }
        completedAt: { type: string, format: date-time }
        completedBy: { type: string }
        remarks: { type: string }
        createdAt: { type: string, format: date-time }

    ReconciliationSummary:
      type: object
      properties:
        id: { type: string }
        reconciliationCode: { type: string }
        subjectType: { type: string }
        status: { type: string }
        facilityCode: { type: string }
        bagCode: { type: string }
        manifestCode: { type: string }
        expectedCount: { type: integer }
        scannedCount: { type: integer }
        matchedCount: { type: integer }
        missingCount: { type: integer }
        excessCount: { type: integer }
        damagedCount: { type: integer }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }

    ReconciliationPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/ReconciliationSummary' } }

    ReconciliationScanRequest:
      type: object
      properties:
        barcodes: { type: array, items: { type: string } }
        damagedBarcodes: { type: array, items: { type: string } }

    ReconciliationScanOutcome:
      type: object
      properties:
        barcode: { type: string }
        outcome: { type: string, enum: [MATCHED, DAMAGED, EXCESS] }
        message: { type: string }

    ReconciliationScanResult:
      type: object
      properties:
        reconciliation: { $ref: '#/components/schemas/Reconciliation' }
        results: { type: array, items: { $ref: '#/components/schemas/ReconciliationScanOutcome' } }

    # ---- Delivery -------------------------------------------------------

    CreateDeliveryRunRequest:
      type: object
      required: [agentId, runDate]
      properties:
        branchId: { type: string }
        agentId: { type: string }
        runDate: { type: string, format: date }
        vehicleReference: { type: string }
        barcodes: { type: array, items: { type: string } }
        metadata: { type: object, additionalProperties: true }

    DeliveryStop:
      type: object
      properties:
        id: { type: string }
        stopSequence: { type: integer }
        status: { type: string, enum: [PENDING, OUT_FOR_DELIVERY, DELIVERED, FAILED, RETURNED_TO_BRANCH, REMOVED] }
        deliveryType: { type: string, enum: [FORWARD, RTO] }
        shipmentId: { type: string }
        awb: { type: string }
        shipmentStatus: { type: string }
        pieceCount: { type: integer }
        paymentMode: { type: string }
        codAmountMinor: { type: integer, format: int64, description: Integer minor units. }
        codCollectedMinor: { type: integer, format: int64 }
        currency: { type: string }
        recipientName: { type: string }
        recipientPhone: { type: string }
        line1: { type: string }
        line2: { type: string }
        landmark: { type: string }
        city: { type: string }
        pincode: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        promisedDeliveryAt: { type: string, format: date-time }
        isHeld: { type: boolean }
        attemptCount: { type: integer }
        dispatchedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }

    DeliveryRun:
      type: object
      properties:
        id: { type: string }
        runCode: { type: string }
        status: { type: string, enum: [PLANNED, ASSIGNED, DISPATCHED, IN_PROGRESS, COMPLETED, CLOSED, CANCELLED] }
        runDate: { type: string, format: date }
        branch: { $ref: '#/components/schemas/OperationalRef' }
        agent: { $ref: '#/components/schemas/OperationalRef' }
        vehicleReference: { type: string }
        stops: { type: array, items: { $ref: '#/components/schemas/DeliveryStop' } }
        plannedStops: { type: integer }
        completedStops: { type: integer }
        deliveredCount: { type: integer }
        failedCount: { type: integer }
        codExpectedMinor: { type: integer, format: int64 }
        codCollectedMinor: { type: integer, format: int64 }
        currency: { type: string }
        dispatchedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        allowedTransitions: { type: array, items: { type: string } }

    DeliveryRunSummary:
      type: object
      properties:
        id: { type: string }
        runCode: { type: string }
        status: { type: string }
        runDate: { type: string, format: date }
        branch: { $ref: '#/components/schemas/OperationalRef' }
        agent: { $ref: '#/components/schemas/OperationalRef' }
        plannedStops: { type: integer }
        completedStops: { type: integer }
        deliveredCount: { type: integer }
        failedCount: { type: integer }
        codExpectedMinor: { type: integer, format: int64 }
        codCollectedMinor: { type: integer, format: int64 }
        currency: { type: string }
        dispatchedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    DeliveryRunPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/DeliveryRunSummary' } }

    AddDeliveryStopsResult:
      type: object
      properties:
        run: { $ref: '#/components/schemas/DeliveryRun' }
        results:
          type: array
          items:
            type: object
            properties:
              barcode: { type: string }
              outcome: { type: string, enum: [ADDED, REJECTED] }
              reason: { type: string }
              message: { type: string }

    AssignRunRequest:
      type: object
      required: [agentId]
      properties:
        agentId: { type: string }

    DeliveryQueueItem:
      type: object
      properties:
        shipmentId: { type: string }
        awb: { type: string }
        status: { type: string }
        statusChangedAt: { type: string, format: date-time }
        pieceCount: { type: integer }
        chargeableWeightGrams: { type: integer }
        paymentMode: { type: string }
        codAmountMinor: { type: integer, format: int64 }
        currency: { type: string }
        promisedDeliveryAt: { type: string, format: date-time }
        deliveryAttemptCount: { type: integer }
        isHeld: { type: boolean }
        holdReason: { type: string }
        movementDirection: { type: string }
        recipientName: { type: string }
        recipientPhone: { type: string }
        line1: { type: string }
        line2: { type: string }
        landmark: { type: string }
        city: { type: string }
        pincode: { type: string }
        customer: { $ref: '#/components/schemas/OperationalRef' }
        ndrCaseId: { type: string }
        ndrReasonCode: { type: string }
        ndrAction: { type: string }
        ndrNextAttemptAt: { type: string, format: date-time }
        onActiveRun: { type: boolean }

    DeliveryQueue:
      type: object
      properties:
        facility: { $ref: '#/components/schemas/OperationalRef' }
        data: { type: array, items: { $ref: '#/components/schemas/DeliveryQueueItem' } }

    DeliveryAttemptRequest:
      type: object
      required: [barcode, outcome]
      properties:
        barcode: { type: string }
        outcome: { type: string, enum: [DELIVERED, FAILED, RESCHEDULED, CANCELLED] }
        runId: { type: string }
        recipientName: { type: string, description: Required when DELIVERED. }
        recipientRelationship:
          type: string
          enum: [SELF, FAMILY, NEIGHBOUR, SECURITY, RECEPTION, COLLEAGUE, OTHER]
        recipientPhone: { type: string }
        otp: { type: string, description: The consignee's code, when one was issued. }
        codCollectedMinor:
          type: integer
          format: int64
          description: |
            Integer minor units. Must equal the COD amount due; under-collection
            is refused with `COD_AMOUNT_MISMATCH` rather than silently accepted.
        codPaymentMode: { type: string, enum: [CASH, UPI, CARD, WALLET, BANK_TRANSFER, CHEQUE] }
        codReference: { type: string }
        failureReasonCode: { type: string, description: Required when FAILED or RESCHEDULED. }
        remarks: { type: string }
        occurredAt: { type: string, format: date-time }
        nextAttemptAt: { type: string, format: date-time }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        locationAccuracyM: { type: integer, minimum: 0 }

    DeliveryAttemptResult:
      type: object
      properties:
        attemptId: { type: string }
        attemptNumber: { type: integer }
        shipmentId: { type: string }
        awb: { type: string }
        outcome: { type: string }
        fromStatus: { type: string }
        toStatus: { type: string }
        occurredAt: { type: string, format: date-time }
        codCollectedMinor: { type: integer, format: int64 }
        currency: { type: string }
        ndrCaseId: { type: string, description: Set when a failure opened or advanced an NDR case. }
        nextAttemptAt: { type: string, format: date-time }
        replayed: { type: boolean, description: True when an offline retry returned the original attempt. }
        nextAction: { type: string }

    IssueOTPRequest:
      type: object
      required: [barcode]
      properties:
        barcode: { type: string }

    IssuedOTP:
      type: object
      properties:
        otp: { type: string, description: Shown once. Only its digest is stored; it cannot be retrieved again. }
        sentToMasked: { type: string, description: The consignee's phone with all but the last four digits masked. }
        expiresAt: { type: string, format: date-time }
        note: { type: string }

    # ---- NDR ------------------------------------------------------------

    NDRReasonRequest:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: string }
        category:
          type: string
          enum: [CUSTOMER_UNAVAILABLE, ADDRESS_PROBLEM, REFUSED, PAYMENT, ACCESS,
                 OPERATIONAL, WEATHER, DAMAGE, OTHER]
        defaultAction: { $ref: '#/components/schemas/NDRAction' }
        maxAttempts: { type: integer, minimum: 1, maximum: 10 }
        isCustomerFault: { type: boolean, description: Affects who bears the RTO charge in Release 3. }
        requiresEvidence: { type: boolean }
        autoRtoAfterMax: { type: boolean, description: Start a return automatically once the attempts run out. }
        displayOrder: { type: integer }
        isActive: { type: boolean }

    NDRReason:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        defaultAction: { $ref: '#/components/schemas/NDRAction' }
        maxAttempts: { type: integer }
        isCustomerFault: { type: boolean }
        requiresEvidence: { type: boolean }
        autoRtoAfterMax: { type: boolean }
        isActive: { type: boolean }
        displayOrder: { type: integer }

    NDRReasonList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/NDRReason' } }

    NDRCaseAttempt:
      type: object
      properties:
        id: { type: string }
        attemptNumber: { type: integer }
        reasonCode: { type: string }
        remarks: { type: string }
        evidenceObjectKeys: { type: array, items: { type: string } }
        occurredAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        recordedBy: { type: string }

    NDRCaseAction:
      type: object
      properties:
        id: { type: string }
        sequence: { type: integer }
        action: { $ref: '#/components/schemas/NDRAction' }
        requestedBy: { type: string, enum: [OPERATIONS, CUSTOMER, CONSIGNEE, SYSTEM, PARTNER] }
        status: { type: string, enum: [PENDING, APPLIED, SUPERSEDED, CANCELLED] }
        instructions: { type: string }
        scheduledFor: { type: string, format: date-time }
        contactName: { type: string }
        contactPhone: { type: string }
        contactNotes: { type: string }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        appliedAt: { type: string, format: date-time }

    CorrectedAddress:
      type: object
      description: |
        An address supplied through the NDR workflow. It never replaces the
        shipment's booking snapshot: both are visible, so the record of where the
        parcel was originally sent survives.
      properties:
        line1: { type: string }
        line2: { type: string }
        landmark: { type: string }
        pincode: { type: string }
        phone: { type: string }
        correctedAt: { type: string, format: date-time }
        correctedBy: { type: string }

    NDRCase:
      type: object
      properties:
        id: { type: string }
        caseCode: { type: string }
        status:
          type: string
          enum: [OPEN, PENDING_CUSTOMER, SCHEDULED, ESCALATED,
                 RESOLVED_DELIVERED, RESOLVED_RTO, RESOLVED_CANCELLED, CLOSED]
        shipmentId: { type: string }
        awb: { type: string }
        shipmentStatus: { type: string }
        branch: { $ref: '#/components/schemas/OperationalRef' }
        currentReasonCode: { type: string }
        reasonName: { type: string }
        reasonCategory: { type: string }
        isCustomerFault: { type: boolean }
        currentAction: { $ref: '#/components/schemas/NDRAction' }
        attemptCount: { type: integer }
        maxAttempts: { type: integer }
        nextAttemptAt: { type: string, format: date-time }
        assignedTo: { type: string }
        correctedAddress: { $ref: '#/components/schemas/CorrectedAddress' }
        attempts: { type: array, items: { $ref: '#/components/schemas/NDRCaseAttempt' } }
        actions: { type: array, items: { $ref: '#/components/schemas/NDRCaseAction' } }
        openedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
        resolutionNotes: { type: string }
        createdAt: { type: string, format: date-time }
        availableActions: { type: array, items: { $ref: '#/components/schemas/NDRAction' } }

    NDRCaseSummary:
      type: object
      properties:
        id: { type: string }
        caseCode: { type: string }
        status: { type: string }
        shipmentId: { type: string }
        awb: { type: string }
        shipmentStatus: { type: string }
        currentReasonCode: { type: string }
        reasonName: { type: string }
        reasonCategory: { type: string }
        currentAction: { type: string }
        attemptCount: { type: integer }
        maxAttempts: { type: integer }
        nextAttemptAt: { type: string, format: date-time }
        branch: { $ref: '#/components/schemas/OperationalRef' }
        customer: { $ref: '#/components/schemas/OperationalRef' }
        recipientName: { type: string }
        recipientPhone: { type: string }
        pincode: { type: string }
        promisedDeliveryAt: { type: string, format: date-time }
        codAmountMinor: { type: integer, format: int64 }
        paymentMode: { type: string }
        openedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    NDRCasePage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/NDRCaseSummary' } }

    NDRActionRequest:
      type: object
      required: [action]
      properties:
        action: { $ref: '#/components/schemas/NDRAction' }
        requestedBy: { type: string, enum: [OPERATIONS, CUSTOMER, CONSIGNEE, SYSTEM, PARTNER] }
        instructions: { type: string }
        scheduledFor: { type: string, format: date-time }
        contactName: { type: string }
        contactPhone: { type: string }
        contactNotes: { type: string }
        correctedLine1: { type: string }
        correctedLine2: { type: string }
        correctedLandmark: { type: string }
        correctedPincode: { type: string }
        correctedPhone: { type: string }
        assignToUserId: { type: string }

    # ---- RTO ------------------------------------------------------------

    InitiateRTORequest:
      type: object
      required: [barcode, notes]
      properties:
        barcode: { type: string }
        reasonCode: { type: string }
