        status: { type: string, enum: [PENDING, IN_PROGRESS, COMPLETED, SKIPPED] }
        from: { $ref: '#/components/schemas/OperationalRef' }
        to: { $ref: '#/components/schemas/OperationalRef' }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }

    RTOReturnAddress:
      type: object
      description: Taken from the sender's booking snapshot, not from the customer's current address.
      properties:
        contactName: { type: string }
        phone: { type: string }
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        state: { type: string }
        pincode: { type: string }

    RTOCase:
      type: object
      properties:
        id: { type: string }
        caseCode: { type: string }
        status:
          type: string
          enum: [INITIATED, IN_TRANSIT, AT_ORIGIN_BRANCH, OUT_FOR_RETURN,
                 RETURNED, RETURN_FAILED, DISPOSED, CANCELLED]
        shipmentId: { type: string }
        awb: { type: string }
        shipmentStatus: { type: string }
        movementDirection: { type: string }
        reasonCode: { type: string }
        reasonNotes: { type: string }
        returnBranch: { $ref: '#/components/schemas/OperationalRef' }
        routeResolutionSource: { type: string, enum: [REVERSE_ROUTING, OVERRIDE, SAME_BRANCH] }
        legs: { type: array, items: { $ref: '#/components/schemas/RTOLeg' } }
        returnAddress: { $ref: '#/components/schemas/RTOReturnAddress' }
        rtoChargeMinor:
          type: integer
          format: int64
          description: Integer minor units. Calculated here; settled with commission in Release 3.
        currency: { type: string }
        chargeBearer: { type: string, enum: [CUSTOMER, FRANCHISE, ORGANIZATION, WAIVED] }
        chargeRuleNotes: { type: string }
        initiatedAt: { type: string, format: date-time }
        initiatedBy: { type: string }
        returnedAt: { type: string, format: date-time }
        returnedToName: { type: string }
        closedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        routeExplanation:
          type: object
          additionalProperties: true
          description: How the reverse route was chosen, for a later dispute.

    RTOCaseSummary:
      type: object
      properties:
        id: { type: string }
        caseCode: { type: string }
        status: { type: string }
        shipmentId: { type: string }
        awb: { type: string }
        shipmentStatus: { type: string }
        reasonCode: { type: string }
        returnBranch: { $ref: '#/components/schemas/OperationalRef' }
        customer: { $ref: '#/components/schemas/OperationalRef' }
        rtoChargeMinor: { type: integer, format: int64 }
        currency: { type: string }
        chargeBearer: { type: string }
        initiatedAt: { type: string, format: date-time }
        returnedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    RTOCasePage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/RTOCaseSummary' } }

    CompleteRTORequest:
      type: object
      required: [outcome]
      properties:
        outcome: { type: string, enum: [RETURNED, FAILED] }
        receivedBy: { type: string, description: Required when RETURNED. }
        remarks: { type: string }

    # ---- Proof of delivery ----------------------------------------------

    SubmitPODRequest:
      type: object
      required: [barcode, recipientName]
      description: |
        Submitted as `multipart/form-data`. File fields are named after the
        artifact type in lower case; at least one is required.
      properties:
        barcode: { type: string }
        podType: { type: string, enum: [DELIVERY, RTO_RETURN, CUSTOMER_PICKUP, HANDOVER], default: DELIVERY }
        recipientName: { type: string }
        recipientRelationship:
          type: string
          enum: [SELF, FAMILY, NEIGHBOUR, SECURITY, RECEPTION, COLLEAGUE, OTHER]
        recipientPhone: { type: string }
        recipientIdType: { type: string }
        recipientIdNumber:
          type: string
          description: Masked before storage; only the last four characters are kept.
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        remarks: { type: string }
        deliveredAt: { type: string, format: date-time }
        signature: { type: string, format: binary }
        photo: { type: string, format: binary }
        id_proof: { type: string, format: binary }
        document: { type: string, format: binary }

    PODArtifact:
      type: object
      properties:
        id: { type: string }
        artifactType: { type: string, enum: [SIGNATURE, PHOTO, ID_PROOF, DOCUMENT, AUDIO] }
        sequence: { type: integer }
        caption: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        checksumSha256:
          type: string
          description: Hex SHA-256 of the stored bytes; proves the file served is the file uploaded.
        capturedAt: { type: string, format: date-time }
        downloadUrl: { type: string, description: The endpoint that issues a short-lived signed link. }

    ProofOfDelivery:
      type: object
      properties:
        id: { type: string }
        podType: { type: string }
        shipmentId: { type: string }
        awb: { type: string }
        recipientName: { type: string }
        recipientRelationship: { type: string }
        recipientPhone: { type: string }
        recipientIdType: { type: string }
        recipientIdMasked: { type: string }
        otpVerified: { type: boolean, description: Copied from the delivery attempt, never accepted from the client. }
        signatureCaptured: { type: boolean }
        photoCaptured: { type: boolean }
        deliveredAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        deliveredBy: { $ref: '#/components/schemas/OperationalRef' }
        facilityCode: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        locationAccuracyM: { type: integer, description: Consumer GPS is not survey-grade; weigh it accordingly. }
        deviceModel: { type: string }
        remarks: { type: string }
        artifacts: { type: array, items: { $ref: '#/components/schemas/PODArtifact' } }

    # ---- Public tracking ------------------------------------------------

    TrackingEvent:
      type: object
      properties:
        milestone:
          type: string
          enum: [BOOKED, PICKUP, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED,
                 EXCEPTION, RETURNING, RETURNED, CANCELLED]
        title: { type: string }
        description: { type: string }
        location: { type: string, description: A city, never a facility name or code. }
        occurredAt: { type: string, format: date-time }

    TrackingResult:
      type: object
      properties:
        awb: { type: string }
        status: { type: string }
        milestone: { type: string }
        statusTitle: { type: string }
        statusDescription: { type: string }
        service: { type: string }
        origin: { type: string, description: City. }
        destination: { type: string, description: City. }
        pieceCount: { type: integer }
        bookedAt: { type: string, format: date-time }
        lastUpdatedAt: { type: string, format: date-time }
        expectedDelivery:
          type: string
          format: date
          description: The promised date, or the rescheduled one when an NDR moved it.
        deliveredAt: { type: string, format: date-time }
        amountDueOnDeliveryMinor:
          type: integer
          format: int64
          description: |
            Shown only for COD, because the recipient needs the money ready. No
            other financial figure is published.
        currency: { type: string }
        isReturning: { type: boolean }
        events: { type: array, items: { $ref: '#/components/schemas/TrackingEvent' } }
    LedgerAccount:
      type: object
      description: |
        A chart-of-accounts entry. `balanceMinor` is already signed by
        `normalBalance` — positive always means "more of what this account is
        for" — so no client-side sign handling is needed.

        System account codes, seeded for every organization and referenced by
        constant from server code. These will not change:

        | Code | Account | Type |
        | --- | --- | --- |
        | `1000` | Cash and Bank | ASSET |
        | `1100` | COD Receivable from Agents | ASSET |
        | `1110` | COD Receivable from Branches | ASSET |
        | `1120` | COD Receivable from Franchises | ASSET |
        | `1200` | Trade Receivable from Customers | ASSET |
        | `1300` | Franchise Receivable | ASSET |
        | `1400` | COD Shortage Recoverable | ASSET |
        | `2000` | COD Payable to Consignors | LIABILITY |
        | `2100` | Commission Payable — earned, not yet settled | LIABILITY |
        | `2200` | Franchise Payable — net owed to a franchise | LIABILITY |
        | `2300` | Tax Payable | LIABILITY |
        | `2310` | Withholding Tax Payable | LIABILITY |
        | `2500` | COD Excess Payable | LIABILITY |
        | `3000` | Retained Earnings | EQUITY |
        | `3100` | Opening Balance Equity | EQUITY |
        | `4000` | Freight Revenue | REVENUE |
        | `4100` | Surcharge Revenue | REVENUE |
        | `4200` | COD Service Fee Revenue | REVENUE |
        | `4300` | Other Operating Revenue | REVENUE |
        | `5000` | Commission Expense | EXPENSE |
        | `5100` | Incentive Expense | EXPENSE |
        | `5200` | COD Shortage Written Off | EXPENSE |
        | `5300` | Discount Allowed | EXPENSE |

        `2100` versus `2200` is the distinction to understand: commission
        *earned* accrues to `2100`, and only an approved settlement moves it to
        the franchise's own `2200` subsidiary account. A franchise's payable
        balance therefore shows agreed, settled amounts — not everything earned.

        A control account that has subsidiary accounts reports a zero balance of
        its own, because postings land on the subsidiary.
      properties:
        id: { type: string, example: "lac_01K2M3N4P5Q6R7S8T9V0W1X2Y3" }
        code: { type: string, example: "2200" }
        name: { type: string, example: "Franchise Payable" }
        accountType: { type: string, enum: [ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE] }
        normalBalance: { type: string, enum: [DEBIT, CREDIT] }
        currency: { type: string, example: "INR" }
        partyType: { type: string, nullable: true, enum: [FRANCHISE, CUSTOMER, OPERATING_UNIT, AGENT, CARRIER] }
        isSystem: { type: boolean }
        isActive: { type: boolean }
        description: { type: string, nullable: true }
        balanceMinor: { type: integer, nullable: true, example: 10250 }
        totalDebitMinor: { type: integer, nullable: true }
        totalCreditMinor: { type: integer, nullable: true }

    JournalTransaction:
      type: object
      description: |
        The unit that balances. `status` REVERSED still counts towards balances —
        a reversal cancels arithmetically, not by deletion.
      properties:
        id: { type: string, example: "jrn_01K2M3N4P5Q6R7S8T9V0W1X2Y3" }
        transactionNumber: { type: string, example: "JV-202608-000001" }
        status: { type: string, enum: [DRAFT, POSTED, REVERSED] }
        postingDate: { type: string, format: date }
        currency: { type: string }
        totalMinor: { type: integer, example: 67850 }
        entryCount: { type: integer }
        sourceType: { type: string, enum: [COMMISSION, COD, SETTLEMENT, INVOICE, CREDIT_NOTE, DEBIT_NOTE, PAYMENT, ADJUSTMENT, REVERSAL, OPENING_BALANCE, MANUAL] }
        sourceId: { type: string, nullable: true }
        purpose: { type: string }
        description: { type: string }
        reason: { type: string, nullable: true }
        reversesId: { type: integer, nullable: true }
        reversedById: { type: integer, nullable: true }
        postedAt: { type: string, format: date-time, nullable: true }

    JournalEntry:
      type: object
      description: |
        One leg. Exactly one of `debitMinor` and `creditMinor` is non-zero;
        render them as two columns.
      properties:
        id: { type: string, example: "jen_01K2M3N4P5Q6R7S8T9V0W1X2Y3" }
        lineNo: { type: integer }
        accountCode: { type: string, example: "1200" }
        accountName: { type: string, nullable: true }
        debitMinor: { type: integer, example: 67850 }
        creditMinor: { type: integer, example: 0 }
        currency: { type: string }
        memo: { type: string, nullable: true }

    StatementLine:
      type: object
      description: A movement on an account with the balance after it.
      properties:
        id: { type: string }
        transactionId: { type: string }
        transactionNumber: { type: string }
        postingDate: { type: string, format: date }
        description: { type: string }
        sourceType: { type: string }
        sourceId: { type: string, nullable: true }
        purpose: { type: string }
        debitMinor: { type: integer }
        creditMinor: { type: integer }
        runningBalanceMinor: { type: integer }
        currency: { type: string }
        memo: { type: string, nullable: true }

    TrialBalance:
      type: object
      description: |
        The report checks itself. `balanced` must be true and `differenceMinor`
        must be zero; anything else means the books are inconsistent.
      properties:
        asOf: { type: string, format: date }
        currency: { type: string }
        totalDebitMinor: { type: integer }
        totalCreditMinor: { type: integer }
        differenceMinor: { type: integer }
        balanced: { type: boolean }
        rows:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              name: { type: string }
              accountType: { type: string }
              normalBalance: { type: string }
              totalDebitMinor: { type: integer }
              totalCreditMinor: { type: integer }
              balanceMinor: { type: integer }

    AccountingPeriod:
      type: object
      properties:
        id: { type: string, example: "acp_01K2M3N4P5Q6R7S8T9V0W1X2Y3" }
        code: { type: string, example: "2026-08" }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        status: { type: string, enum: [OPEN, CLOSING, CLOSED] }
        closedAt: { type: string, format: date-time, nullable: true }
        closeReason: { type: string, nullable: true }

    PostJournalRequest:
      type: object
      required: [description, reason, legs]
      description: Debits must equal credits across the legs.
      properties:
        description: { type: string }
        reason: { type: string, minLength: 3 }
        postingDate: { type: string, format: date }
        currency: { type: string }
        legs:
          type: array
          minItems: 2
          items:
            type: object
            required: [accountCode]
            properties:
              accountCode: { type: string, example: "1000" }
              debitMinor: { type: integer, example: 500000 }
              creditMinor: { type: integer, example: 0 }
              partyType: { type: string, enum: [FRANCHISE, CUSTOMER, OPERATING_UNIT, AGENT, CARRIER] }
              partyId: { type: integer }
              memo: { type: string }

    CommissionType:
      type: string
      enum: [BOOKING, PICKUP, ORIGIN_HANDLING, DESTINATION_HANDLING, DELIVERY, COD, VOLUME_INCENTIVE, CUSTOM]

    CommissionRule:
      type: object
      description: |
        `specificity` is computed by the server from how many scope dimensions
        are bound, and is the primary sort key when several rules match.
      properties:
        id: { type: string, example: "crl_01K2M3N4P5Q6R7S8T9V0W1X2Y3" }
        code: { type: string, example: "DEL-GOLD" }
        name: { type: string }
        commissionType: { $ref: "#/components/schemas/CommissionType" }
        recipientRole: { type: string, enum: [ORIGIN_FRANCHISE, DESTINATION_FRANCHISE, PICKUP_AGENT, DELIVERY_AGENT, ORIGIN_UNIT, DESTINATION_UNIT, CUSTOM] }
        schemeCode: { type: string }
        franchiseId: { type: integer, nullable: true }
        franchiseCategory: { type: string, nullable: true }
        serviceId: { type: integer, nullable: true }
        customerCategory: { type: string, nullable: true }
        paymentMode: { type: string, nullable: true }
        specificity: { type: integer, example: 32 }
        priority: { type: integer }
        status: { type: string, enum: [DRAFT, ACTIVE, INACTIVE] }

    CommissionRuleVersion:
      type: object
      description: |
        The arithmetic, effective-dated. Frozen once it has produced a
        calculation; changing a rate means adding a version.
      properties:
        id: { type: string, example: "crv_01K2M3N4P5Q6R7S8T9V0W1X2Y3" }
        versionNo: { type: integer }
        calculationMethod: { type: string, enum: [FIXED, PERCENTAGE, SLAB] }
        currency: { type: string }
        fixedAmountMinor: { type: integer, nullable: true, example: 4250 }
        rateBp: { type: integer, nullable: true, example: 1200, description: Basis points; 1200 is 12%. }
        basis: { type: string, nullable: true, enum: [FREIGHT, SURCHARGE, FREIGHT_PLUS_SURCHARGE, TOTAL_BEFORE_TAX, TOTAL, COD_AMOUNT, CHARGEABLE_WEIGHT, SHIPMENT_COUNT] }
        slabs: { type: array, nullable: true, items: { $ref: "#/components/schemas/CommissionSlab" } }
        minAmountMinor: { type: integer, nullable: true }
        maxAmountMinor: { type: integer, nullable: true }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date, nullable: true }
        status: { type: string, enum: [DRAFT, ACTIVE, SUPERSEDED] }

    CommissionSlab:
      type: object
      description: |
        One band. Bands must start at 0, be contiguous, and the last must be
        open-ended (`toMinor: null`). A boundary belongs to the upper band.
      required: [fromMinor, amountMinor]
      properties:
        fromMinor: { type: integer, example: 0 }
        toMinor: { type: integer, nullable: true, example: 50000 }
        amountMinor: { type: integer, example: 1000 }
        rateBp: { type: integer, nullable: true }
        label: { type: string, example: "up to ₹500" }

    CommissionRuleRequest:
      type: object
      required: [code, name, commissionType, recipientRole]
      properties:
        schemeCode: { type: string, default: STANDARD }
        code: { type: string }
        name: { type: string }
        commissionType: { $ref: "#/components/schemas/CommissionType" }
        recipientRole: { type: string, enum: [ORIGIN_FRANCHISE, DESTINATION_FRANCHISE, PICKUP_AGENT, DELIVERY_AGENT, ORIGIN_UNIT, DESTINATION_UNIT, CUSTOM] }
        franchiseId: { type: string, nullable: true }
        franchiseCategory: { type: string, nullable: true }
        serviceCode: { type: string, nullable: true }
        customerCategory: { type: string, nullable: true }
        paymentMode: { type: string, nullable: true, enum: [PREPAID, COD, CREDIT, TO_PAY] }
        priority: { type: integer, default: 0 }
        description: { type: string }

    CommissionVersionRequest:
      type: object
      required: [calculationMethod, effectiveFrom]
      properties:
        calculationMethod: { type: string, enum: [FIXED, PERCENTAGE, SLAB] }
        fixedAmountMinor: { type: integer }
        rateBp: { type: integer }
        basis: { type: string, enum: [FREIGHT, SURCHARGE, FREIGHT_PLUS_SURCHARGE, TOTAL_BEFORE_TAX, TOTAL, COD_AMOUNT, CHARGEABLE_WEIGHT, SHIPMENT_COUNT] }
        slabs: { type: array, items: { $ref: "#/components/schemas/CommissionSlab" } }
        minAmountMinor: { type: integer }
        maxAmountMinor: { type: integer }
        effectiveFrom: { type: string, format: date }
        notes: { type: string }

    CommissionCalculation:
      type: object
      description: |
        An immutable record of one computed commission, including the rule
        version used and the arithmetic trace.
      properties:
        id: { type: string, example: "ccl_01K2M3N4P5Q6R7S8T9V0W1X2Y3" }
        commissionType: { $ref: "#/components/schemas/CommissionType" }
        awb: { type: string, nullable: true }
        qualifyingEvent: { type: string, example: "DELIVERED" }
        qualifiedAt: { type: string, format: date-time }
        recipientType: { type: string, enum: [FRANCHISE, OPERATING_UNIT, AGENT] }
        franchiseCode: { type: string, nullable: true }
        ruleCode: { type: string }
        ruleVersionNo: { type: integer }
        calculationMethod: { type: string, enum: [FIXED, PERCENTAGE, SLAB] }
        basis: { type: string, nullable: true }
        baseAmountMinor: { type: integer }
        rateBp: { type: integer, nullable: true }
        grossAmountMinor: { type: integer, description: Before any minimum or maximum clamp. }
        amountMinor: { type: integer }
        currency: { type: string }
        calculationTrace: { type: array, items: { $ref: "#/components/schemas/CalculationStep" } }
        status: { type: string, enum: [CALCULATED, POSTED, REVERSED, CANCELLED] }
        settlementId: { type: integer, nullable: true }

    CalculationStep:
      type: object
      description: One line of the arithmetic, for display to an operator or franchise.
      properties:
        description: { type: string, example: "Apply 12% of basis" }
        value: { type: integer, example: 6000 }
        detail: { type: string, example: "50000 × 1200 bp, rounded half-up" }

    CommissionSimulateRequest:
      type: object
      required: [commissionType, basis]
      properties:
        commissionType: { $ref: "#/components/schemas/CommissionType" }
        franchiseId: { type: string }
        franchiseCategory: { type: string }
        customerCategory: { type: string }
        paymentMode: { type: string }
        on: { type: string, format: date, description: The date whose rule version applies. Defaults to today. }
        basis:
          type: object
          properties:
            freightMinor: { type: integer, example: 50000 }
            surchargeMinor: { type: integer, example: 7500 }
            taxableMinor: { type: integer }
            totalMinor: { type: integer, example: 67850 }
            codAmountMinor: { type: integer }
            chargeableWeightGrams: { type: integer }
            shipmentCount: { type: integer }

    CommissionSimulateResult:
      type: object
      description: |
        `matched: false` is a normal outcome, not an error. `candidates` shows
        every rule considered, with the winner marked.
      properties:
        matched: { type: boolean }
        ruleCode: { type: string }
        ruleName: { type: string }
        versionNo: { type: integer }
        explanation: { type: string, example: "Rule DEL-GOLD version 2 was selected from 3 matching rule(s) on specificity 32." }
        calculation:
          type: object
          properties:
            method: { type: string }
            basis: { type: string }
            basisValue: { type: integer }
            rateBp: { type: integer, nullable: true }
            grossAmountMinor: { type: integer }
            amountMinor: { type: integer }
            clamped: { type: boolean }
            currency: { type: string }
            trace: { type: array, items: { $ref: "#/components/schemas/CalculationStep" } }
        candidates:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              name: { type: string }
              specificity: { type: integer }
              priority: { type: integer }
              selected: { type: boolean }

    CODStatus:
      type: string
      enum: [EXPECTED, AGENT_COLLECTED, BRANCH_RECEIVED, FRANCHISE_CONFIRMED, RECONCILED, REMITTED, CLOSED, CANCELLED, WRITTEN_OFF]

    CODObligation:
      type: object
      description: |
        `expectedMinor` is fixed at booking and cannot be edited — the database
        refuses it. Corrections are adjustments.
      properties:
        id: { type: string, example: "cod_01K2M3N4P5Q6R7S8T9V0W1X2Y3" }
        awb: { type: string }
        expectedMinor: { type: integer, example: 200000 }
        collectedMinor: { type: integer }
        remittedMinor: { type: integer }
        adjustedMinor: { type: integer }
        currency: { type: string }
        status: { $ref: "#/components/schemas/CODStatus" }
        custodianType: { type: string, nullable: true, enum: [AGENT, OPERATING_UNIT, FRANCHISE, HEAD_OFFICE] }
        custodianId: { type: integer, nullable: true }
        collectedAt: { type: string, format: date-time, nullable: true }
        remittedAt: { type: string, format: date-time, nullable: true }

    CODCollection:
      type: object
      properties:
        id: { type: string, example: "cdc_01K2M3N4P5Q6R7S8T9V0W1X2Y3" }
        amountMinor: { type: integer }
        currency: { type: string }
        paymentMode: { type: string, enum: [CASH, UPI, CARD, WALLET, NET_BANKING, CHEQUE, DEMAND_DRAFT, OTHER] }
        reference: { type: string, nullable: true }
        collectedAt: { type: string, format: date-time }

    CODCustodyTransfer:
      type: object
      description: |
        Two-sided. Until `status` is ACCEPTED the money is still the giver's
        liability.
      properties:
        id: { type: string, example: "cdt_01K2M3N4P5Q6R7S8T9V0W1X2Y3" }
        transferCode: { type: string, example: "CDT-202608-000001" }
        fromType: { type: string }
        fromId: { type: integer }
        toType: { type: string }
        toId: { type: integer }
        declaredMinor: { type: integer }
        acceptedMinor: { type: integer, nullable: true }
        varianceMinor: { type: integer, description: Negative is a shortfall. }
        varianceReason: { type: string, nullable: true }
        shipmentCount: { type: integer }
        status: { type: string, enum: [DECLARED, ACCEPTED, DISPUTED, CANCELLED] }
        currency: { type: string }

    CODReconciliation:
      type: object
      properties:
        id: { type: string, example: "cdr_01K2M3N4P5Q6R7S8T9V0W1X2Y3" }
        reconciliationCode: { type: string }
        partyType: { type: string }
        partyId: { type: integer }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        expectedMinor: { type: integer }
        countedMinor: { type: integer }
        shortageMinor: { type: integer }
        excessMinor: { type: integer }
        status: { type: string, enum: [OPEN, COUNTED, COMPLETED, COMPLETED_WITH_VARIANCE, CANCELLED] }
        varianceReason: { type: string, nullable: true }
        currency: { type: string }

    CODReconciliationItem:
      type: object
      properties:
        obligationId: { type: integer }
        expectedMinor: { type: integer }
        countedMinor: { type: integer }
        outcome: { type: string, enum: [MATCHED, SHORT, EXCESS, MISSING, DISPUTED] }
        notes: { type: string, nullable: true }

    CODRemittance:
      type: object
      properties:
        id: { type: string, example: "cdm_01K2M3N4P5Q6R7S8T9V0W1X2Y3" }
        remittanceCode: { type: string }
        fromType: { type: string }
        fromId: { type: integer }
        beneficiaryType: { type: string, enum: [HEAD_OFFICE, CONSIGNOR, CUSTOMER] }
        amountMinor: { type: integer }
        currency: { type: string }
        paymentMode: { type: string }
        reference: { type: string, nullable: true }
        paidOn: { type: string, format: date }
        status: { type: string, enum: [INITIATED, CONFIRMED, FAILED, CANCELLED] }

    CODAdjustment:
      type: object
      properties:
        id: { type: string, example: "cda_01K2M3N4P5Q6R7S8T9V0W1X2Y3" }
        adjustmentType: { type: string, enum: [SHORTAGE_RECOVERY, SHORTAGE_WRITE_OFF, EXCESS_REFUND, EXCESS_RETAINED, WAIVER, CORRECTION, DISPUTE_RESOLUTION] }
        amountMinor: { type: integer }
        currency: { type: string }
        liablePartyType: { type: string, nullable: true }
        reason: { type: string }
        status: { type: string, enum: [PENDING_APPROVAL, APPROVED, REJECTED, POSTED] }
        requestedBy: { type: integer }
        approvedBy: { type: integer, nullable: true }

    CODDispute:
      type: object
      properties:
        id: { type: string, example: "cdd_01K2M3N4P5Q6R7S8T9V0W1X2Y3" }
        disputeCode: { type: string }
        disputedMinor: { type: integer }
        category: { type: string, enum: [AMOUNT_MISMATCH, NOT_COLLECTED, ALREADY_REMITTED, FAKE_ENTRY, CUSTOMER_CLAIM, OTHER] }
        description: { type: string }
        status: { type: string, enum: [OPEN, UNDER_REVIEW, RESOLVED, REJECTED, WITHDRAWN] }
        resolution: { type: string, nullable: true }

    CODSummary:
      type: object
      properties:
        expectedCount: { type: integer }
        withAgentCount: { type: integer }
        withBranchCount: { type: integer }
        withFranchiseCount: { type: integer }
        remittedCount: { type: integer }
        expectedMinor: { type: integer }
        inCustodyMinor: { type: integer }
        remittedMinor: { type: integer }
        currency: { type: string }

    CODCustodyPosition:
      type: object
      description: |
        The same holding derived twice, by different code paths.
        `reconciled: false` means the operational record and the books have
        diverged and is a finance incident.
      properties:
        partyType: { type: string }
        partyId: { type: string }
        heldMinor: { type: integer, description: From the obligation rows. }
        ledgerBalanceMinor: { type: integer, description: From the ledger. }
        obligationCount: { type: integer }
        reconciled: { type: boolean }
        currency: { type: string }

    SettlementStatus:
      type: string
      enum: [DRAFT, CALCULATED, UNDER_REVIEW, APPROVED, PARTIALLY_PAID, PAID, CLOSED, CANCELLED]

    Settlement:
      type: object
      description: |
        `netAmountMinor` positive means head office owes the franchise; negative
        means the franchise owes head office, which is normal when they are
        holding COD.
      properties:
        id: { type: string, example: "stl_01K2M3N4P5Q6R7S8T9V0W1X2Y3" }
        settlementNumber: { type: string, example: "STL-202608-00001" }
        franchiseCode: { type: string }
        franchiseName: { type: string }
        periodType: { type: string, enum: [WEEKLY, FORTNIGHTLY, MONTHLY, CUSTOM] }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        status: { $ref: "#/components/schemas/SettlementStatus" }
        currency: { type: string }
        commissionMinor: { type: integer }
        incentiveMinor: { type: integer }
        codLiabilityMinor: { type: integer, description: Negative — COD held reduces what is owed. }
        chargesMinor: { type: integer }
        penaltiesMinor: { type: integer }
        adjustmentsMinor: { type: integer }
        taxMinor: { type: integer }
        withholdingMinor: { type: integer }
        openingBalanceMinor: { type: integer }
        netAmountMinor: { type: integer }
        paidMinor: { type: integer }
        calculationHash: { type: string, nullable: true, description: Stable across recalculations of unchanged sources. }
        calculatedBy: { type: integer, nullable: true }
        approvedBy: { type: integer, nullable: true }

    SettlementLine:
      type: object
      description: Every line names the source row it came from.
      properties:
        id: { type: string, example: "sln_01K2M3N4P5Q6R7S8T9V0W1X2Y3" }
        lineNo: { type: integer }
        category: { type: string, enum: [BOOKING_COMMISSION, PICKUP_COMMISSION, ORIGIN_HANDLING, DESTINATION_HANDLING, DELIVERY_COMMISSION, COD_COMMISSION, VOLUME_INCENTIVE, CUSTOM_COMMISSION, COD_LIABILITY, CHARGE, PENALTY, INCENTIVE, ADJUSTMENT, TAX, WITHHOLDING, OPENING_BALANCE] }
        description: { type: string }
        amountMinor: { type: integer }
        currency: { type: string }
        quantity: { type: integer }
        sourceType: { type: string, enum: [COMMISSION_CALCULATION, COD_OBLIGATION, COD_ADJUSTMENT, SETTLEMENT_ADJUSTMENT, PREVIOUS_SETTLEMENT, TAX_RULE, MANUAL] }
        sourceId: { type: integer, nullable: true }
        sourcePublicId: { type: string, nullable: true }
        awb: { type: string, nullable: true }

    SettlementResult:
      type: object
      properties:
        settlement: { $ref: "#/components/schemas/Settlement" }
        lines: { type: array, items: { $ref: "#/components/schemas/SettlementLine" } }
        replayed: { type: boolean, description: True when an existing settlement was returned rather than created. }

    InvoiceStatus:
      type: string
      enum: [DRAFT, ISSUED, PARTIALLY_PAID, PAID, OVERDUE, CANCELLED, WRITTEN_OFF]

    Invoice:
      type: object
      description: |
        Immutable once ISSUED. Until then `invoiceNumber` is a `DRAFT-…`
        placeholder and must not be shown as a statutory number.
      properties:
        id: { type: string, example: "inv_01K2M3N4P5Q6R7S8T9V0W1X2Y3" }
        invoiceNumber: { type: string, example: "INV/2026-27/000042" }
        seriesCode: { type: string }
        customerCode: { type: string }
        customerName: { type: string }
        billingMode: { type: string, enum: [IMMEDIATE, PERIODIC] }
        periodStart: { type: string, format: date, nullable: true }
        periodEnd: { type: string, format: date, nullable: true }
        issueDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        status: { $ref: "#/components/schemas/InvoiceStatus" }
        currency: { type: string }
        subtotalMinor: { type: integer }
        discountMinor: { type: integer }
        taxableMinor: { type: integer }
        taxMinor: { type: integer }
        roundingMinor: { type: integer }
        totalMinor: { type: integer, example: 108560 }
        paidMinor: { type: integer }
        creditedMinor: { type: integer }
        shipmentCount: { type: integer }
        documentObjectId: { type: integer, nullable: true, description: The rendered PDF. Always null in Release 3. }

    InvoiceLine:
      type: object
      description: |
        A snapshot copied at issue time from the shipment's charge snapshot. It
        is never recomputed from a rate card.
      properties:
        id: { type: string, example: "ivl_01K2M3N4P5Q6R7S8T9V0W1X2Y3" }
        lineNo: { type: integer }
        lineType: { type: string, enum: [FREIGHT, SURCHARGE, COD_FEE, INSURANCE, HANDLING, DISCOUNT, ADJUSTMENT, SUMMARY, OTHER] }
        description: { type: string }
        hsnSacCode: { type: string, nullable: true }
        quantity: { type: integer }
        unitPriceMinor: { type: integer }
        amountMinor: { type: integer }
        discountMinor: { type: integer }
        taxableMinor: { type: integer }
        taxMinor: { type: integer }
        totalMinor: { type: integer }
        currency: { type: string }
        awb: { type: string, nullable: true }
        chargeSnapshotId: { type: integer, nullable: true }

    TaxComponentLine:
      type: object
      description: |
        A configured tax. Indian GST is two 9% components intra-state or one 18%
        component inter-state; nothing is special-cased in code.
      properties:
        componentCode: { type: string, example: "CGST" }
        componentName: { type: string, example: "Central GST" }
        rateBp: { type: integer, example: 900 }
        taxableMinor: { type: integer }
        taxMinor: { type: integer }
        currency: { type: string }

    InvoiceResult:
      type: object
      properties:
        invoice: { $ref: "#/components/schemas/Invoice" }
        lines: { type: array, items: { $ref: "#/components/schemas/InvoiceLine" } }
        taxes: { type: array, items: { $ref: "#/components/schemas/TaxComponentLine" } }

    DraftInvoiceRequest:
      type: object
      required: [customerId, periodStart, periodEnd]
      properties:
        customerId: { type: string, pattern: '^cus_[0-9A-HJKMNP-TV-Z]{26}$' }
        billingMode: { type: string, enum: [IMMEDIATE, PERIODIC], default: PERIODIC }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        issueDate: { type: string, format: date }
        summary: { type: boolean, default: false, description: One rolled-up line instead of one per shipment. Every AWB is still recorded. }
        notes: { type: string }
        taxes:
          type: array
          items:
            type: object
            required: [code, name, rateBp]
            properties:
              code: { type: string, example: "IGST" }
              name: { type: string, example: "Integrated GST" }
              rateBp: { type: integer, example: 1800 }
              metadata: { type: object, additionalProperties: true, example: { placeOfSupply: "07" } }

    CreditNote:
      type: object
      properties:
        id: { type: string, example: "crn_01K2M3N4P5Q6R7S8T9V0W1X2Y3" }
        noteNumber: { type: string, example: "CRN/2026-27/000003" }
        noteType: { type: string, enum: [CREDIT, DEBIT] }
        invoiceNumber: { type: string, nullable: true }
        customerCode: { type: string }
        reasonCode: { type: string, enum: [BILLING_ERROR, SERVICE_FAILURE, RATE_CORRECTION, GOODWILL, RETURN, TAX_CORRECTION, SHORT_SHIPMENT, OTHER] }
        reason: { type: string }
        issueDate: { type: string, format: date }
        currency: { type: string }
        subtotalMinor: { type: integer }
        taxMinor: { type: integer }
        totalMinor: { type: integer }
        status: { type: string, enum: [DRAFT, ISSUED, APPLIED, CANCELLED] }
        createdBy: { type: integer, nullable: true }
        approvedBy: { type: integer, nullable: true }

    # ------------------------------------------------ Partner API (M32) --
    PartnerScope:
      type: string
      description: |
        What an API key may do. Scopes are not permissions: they are a separate
        vocabulary carried on the credential, so a partner can never acquire a
        person's rights and no role can be granted one by accident.
      enum:
        - serviceability:read
        - pricing:read
        - shipment:create
        - shipment:read
        - shipment:cancel
        - tracking:read
        - pickup:create
        - pickup:read
        - label:read
        - pod:read
        - webhook:manage

    PartnerIdentity:
      type: object
      properties:
        keyName: { type: string }
        organization: { type: string }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/PartnerScope" }
        rateLimitPerMinute: { type: integer }
        availableScopes:
          type: array
          items: { $ref: "#/components/schemas/PartnerScope" }

    APIKey:
      type: object
      description: A partner credential. Never carries the secret or its hash.
      properties:
        id: { type: string, pattern: '^apk_[0-9A-HJKMNP-TV-Z]{26}$' }
        name: { type: string }
        keyId:
          type: string
          description: The non-secret half, sent as the identifier. Safe to log.
        secretHint:
          type: string
          description: The first few characters of the secret, so two keys can be told apart.
        scopes:
          type: array
          items: { $ref: "#/components/schemas/PartnerScope" }
        allowedCidrs:
          type: array
          description: Optional network restriction. Empty means any source.
          items: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED, REVOKED, EXPIRED] }
        expiresAt: { type: string, format: date-time, nullable: true }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        requestCount: { type: integer, format: int64 }
        rateLimitPerMinute: { type: integer, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        revokeReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    IssueAPIKeyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        scopes:
          type: array
          description: A key with no scopes can do nothing, which is the safe default.
          items: { $ref: "#/components/schemas/PartnerScope" }
        allowedCidrs:
          type: array
          items: { type: string, example: "203.0.113.0/24" }
        expiresAt: { type: string, format: date-time }
        rateLimitPerMinute: { type: integer, minimum: 1 }

    IssuedAPIKey:
      type: object
      description: |
        The creation response, and the only place the secret ever appears.
      properties:
        key: { $ref: "#/components/schemas/APIKey" }
        secret:
          type: string
          description: The plaintext secret. Stored only as an Argon2id hash; not recoverable.
        token:
          type: string
          description: '`<keyId>.<secret>`, the value to put in the Authorization header.'
        warning: { type: string }

    APIKeyUsage:
      type: object
      properties:
        windowHours: { type: integer }
        requestCount: { type: integer, format: int64 }
        errorCount: { type: integer, format: int64 }
        avgDurationMs: { type: integer }
        recent:
          type: array
          items:
            type: object
            properties:
              method: { type: string }
              route: { type: string }
              statusCode: { type: integer }
              durationMs: { type: integer }
              errorCode: { type: string, nullable: true }
              occurredAt: { type: string, format: date-time }

    WebhookEventType:
      type: string
      description: |
        A business event a partner may subscribe to. Internal handling steps —
        bagging, manifesting — are deliberately not published: they would leak
        network structure and bury the events that matter.
      enum:
        - shipment.booked
        - shipment.picked_up
        - shipment.in_transit
        - shipment.out_for_delivery
        - shipment.delivered
        - shipment.delivery_failed
        - shipment.ndr
        - shipment.rto_initiated
        - shipment.rto_delivered
        - shipment.cancelled
        - shipment.lost
        - shipment.damaged
        - pickup.completed
        - pod.captured
        - cod.collected

    CreateWebhookEndpointRequest:
      type: object
      required: [name, url, events]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        url:
          type: string
          format: uri
          description: Must be HTTPS. Payloads carry customer data.
          pattern: '^https://'
        events:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/WebhookEventType" }

    WebhookEndpoint:
      type: object
      properties:
        id: { type: string, pattern: '^whe_[0-9A-HJKMNP-TV-Z]{26}$' }
        name: { type: string }
        url: { type: string, format: uri }
        status: { type: string, enum: [ACTIVE, PAUSED, DISABLED] }
        consecutiveFailures:
          type: integer
          description: Reaching 20 pauses the endpoint automatically.
        disabledReason: { type: string, nullable: true }
        lastSuccessAt: { type: string, format: date-time, nullable: true }
        lastFailureAt: { type: string, format: date-time, nullable: true }
        maxAttempts: { type: integer }
        timeoutSeconds: { type: integer }
        createdAt: { type: string, format: date-time }

    CreatedWebhookEndpoint:
      type: object
      properties:
        endpoint: { $ref: "#/components/schemas/WebhookEndpoint" }
        signingSecret:
          type: string
          description: Shown once. Verify our signature with it.
        signatureHeader:
          type: object
          description: How to verify a delivery.
          properties:
            header: { type: string, example: Webhook-Signature }
            scheme:
              type: string
              example: 'v1=HMAC_SHA256(secret, "<timestamp>.<body>")'
            timestamp: { type: string, example: Webhook-Timestamp }
            toleranceSec:
              type: integer
              description: |
                Reject a timestamp older than this. Including the timestamp in
                the signed string is what makes a captured request
                un-replayable by a third party.
        warning: { type: string }

    WebhookSubscription:
      type: object
      properties:
        id: { type: string, pattern: '^whs_[0-9A-HJKMNP-TV-Z]{26}$' }
        eventType: { $ref: "#/components/schemas/WebhookEventType" }
        isActive: { type: boolean }

    WebhookDelivery:
      type: object
      properties:
        id: { type: string, pattern: '^whd_[0-9A-HJKMNP-TV-Z]{26}$' }
        endpoint: { type: string }
        eventType: { $ref: "#/components/schemas/WebhookEventType" }
        eventId:
          type: string
          description: |
            Stable for a business event and sent as `Webhook-Id`. Dedupe on it:
            a replay carries the same value deliberately.
        status: { type: string, enum: [PENDING, SENDING, DELIVERED, FAILED, DEAD_LETTER, CANCELLED] }
        attemptCount: { type: integer }
        lastStatusCode: { type: integer, nullable: true }
        lastError: { type: string, nullable: true }
        nextAttemptAt: { type: string, format: date-time, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    WebhookDeliveryDetail:
      allOf:
        - $ref: "#/components/schemas/WebhookDelivery"
        - type: object
          properties:
            url: { type: string, format: uri }
            payload:
              type: object
              additionalProperties: true
              description: The exact bytes that were signed and sent.

    WebhookDeliveryPage:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/WebhookDelivery" }
        nextCursor:
          type: integer
          description: Pass as `cursor` for the next page. Absent on the last page.

    WebhookAttempt:
      type: object
      properties:
        attemptNo: { type: integer }
        statusCode: { type: integer, nullable: true }
        responseBody:
          type: string
          nullable: true
          description: The first 2 KiB of the response, so a misconfigured endpoint cannot fill the table.
        errorMessage: { type: string, nullable: true }
        durationMs: { type: integer, nullable: true }
        attemptedAt: { type: string, format: date-time }

    # ---------------------------------------------- Command centre (M30) --
    CommandOverview:
      type: object
      properties:
        period: { $ref: "#/components/schemas/CommandPeriodTotals" }
        live: { $ref: "#/components/schemas/CommandLiveBacklog" }
        alerts: { $ref: "#/components/schemas/CommandAlerts" }
        movement: { $ref: "#/components/schemas/CommandMovement" }
        money: { $ref: "#/components/schemas/CommandMoneyInFlight" }
        consistency: { $ref: "#/components/schemas/CommandConsistency" }

    CommandPeriodTotals:
      type: object
      description: |
        Read from an incrementally maintained rollup. Exact: the counters are
        updated in the same transaction as each status change.
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        booked: { type: integer, format: int64 }
        pickedUp: { type: integer, format: int64 }
        inTransit: { type: integer, format: int64 }
        outForDelivery: { type: integer, format: int64 }
        delivered: { type: integer, format: int64 }
        ndr: { type: integer, format: int64 }
        rto: { type: integer, format: int64 }
        cancelled: { type: integer, format: int64 }
        damaged: { type: integer, format: int64 }
        lost: { type: integer, format: int64 }
        slaBreaches: { type: integer, format: int64 }
        revenueMinor: { type: integer, format: int64 }
        codAmountMinor: { type: integer, format: int64 }
        weightGrams: { type: integer, format: int64 }
        deliveryRateBasisPoints:
          type: integer
          description: |
            Delivered as a proportion of booked, in basis points (10000 = 100%).
            An integer, like every other proportion in the platform: a
            percentage carried as a float is a rounding argument waiting to
            happen, and this one sits next to a count it has to agree with.
            Zero when nothing was booked.
        ndrRateBasisPoints: { type: integer }

    CommandLiveBacklog:
      type: object
      description: Counted at request time over in-progress statuses only.
      properties:
        byStatus:
          type: object
          additionalProperties: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
        onHold: { type: integer, format: int64 }

    CommandAlerts:
      type: object
      properties:
        slaBreached: { type: integer, format: int64 }
        slaBreachedToday: { type: integer, format: int64 }
        openNdr: { type: integer, format: int64 }
        ndrByReason:
          type: object
          additionalProperties: { type: integer, format: int64 }
        openExceptions: { type: integer, format: int64 }
        criticalExceptions: { type: integer, format: int64 }

    CommandMovement:
      type: object
      description: |
        Whether the network is actually moving. `scansLastHour` falling to zero
        during working hours is the signal no status count will give you.
      properties:
        scansLastHour: { type: integer, format: int64 }
        activeTrips:
          type: object
          additionalProperties: { type: integer, format: int64 }
        openBags: { type: integer, format: int64 }
        draftManifests: { type: integer, format: int64 }
        manifestsInFlight: { type: integer, format: int64 }

    CommandMoneyInFlight:
      type: object
      description: Cash the network holds but has not remitted.
      properties:
        codOutstandingMinor: { type: integer, format: int64 }
        codObligations: { type: integer, format: int64 }
        codAgedOver48h: { type: integer, format: int64 }
        currency: { type: string }

    CommandConsistency:
      type: object
      description: |
        Which figures are exact and which are sampled. Present so a dashboard
        can label them honestly instead of presenting everything as live.
      properties:
        periodTotals: { type: string }
        liveBacklog: { type: string }
        snapshots: { type: string }

    CommandDayPoint:
      type: object
      properties:
        date: { type: string, format: date }
        booked: { type: integer, format: int64 }
        delivered: { type: integer, format: int64 }
        ndr: { type: integer, format: int64 }
        rto: { type: integer, format: int64 }
        slaBreaches: { type: integer, format: int64 }
        revenueMinor: { type: integer, format: int64 }
        codAmountMinor: { type: integer, format: int64 }

    UnitPerformance:
      type: object
      properties:
        unitId: { type: string, pattern: '^ou_[0-9A-HJKMNP-TV-Z]{26}$' }
        code: { type: string }
        name: { type: string }
        unitType:
          type: string
          enum: [HEAD_OFFICE, REGIONAL_HUB, TRANSIT_HUB, DELIVERY_HUB, COMPANY_BRANCH, FRANCHISE_BRANCH]
        booked: { type: integer, format: int64 }
        delivered: { type: integer, format: int64 }
        ndr: { type: integer, format: int64 }
        rto: { type: integer, format: int64 }
        slaBreaches: { type: integer, format: int64 }
        revenueMinor: { type: integer, format: int64 }
        deliveryRateBasisPoints: { type: integer }

    ServicePerformance:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        booked: { type: integer, format: int64 }
        delivered: { type: integer, format: int64 }
        ndr: { type: integer, format: int64 }
        slaBreaches: { type: integer, format: int64 }
        revenueMinor: { type: integer, format: int64 }
        deliveryRateBasisPoints: { type: integer }

    UnitBacklog:
      type: object
      properties:
        unitId: { type: string, pattern: '^ou_[0-9A-HJKMNP-TV-Z]{26}$' }
        code: { type: string }
        name: { type: string }
        count: { type: integer, format: int64 }

    OperationalSnapshot:
      type: object
      properties:
        capturedAt:
          type: string
          format: date-time
          description: |
            When this reading was taken. On the reading itself, so a chart
            states its own age rather than implying it is live.
        inCustody: { type: integer }
        awaitingPickup: { type: integer }
        inbound: { type: integer }
        outbound: { type: integer }
        readyForDelivery: { type: integer }
        ndrOpen: { type: integer }
        exceptionsOpen: { type: integer }
        codInCustodyMinor: { type: integer, format: int64 }

    # ------------------------------------------------ Notifications (M26) --
    NotificationChannel:
      type: string
      enum: [SMS, EMAIL, WHATSAPP, PUSH]

    NotificationStatus:
      type: string
      enum: [PENDING, SENDING, SENT, DELIVERED, FAILED, DEAD_LETTER, SUPPRESSED, CANCELLED]

    NotificationSuppressionReason:
      type: string
      description: |
        Why a message was never sent. Raising a notification never fails the
        business operation that caused it, so this is how the failure is
        recorded instead of thrown.
      enum:
        - RECIPIENT_OPTED_OUT
        - NO_TEMPLATE_CONFIGURED
        - NO_VALID_ADDRESS
        - CHANNEL_NOT_CONFIGURED
        - QUIET_HOURS
        - DUPLICATE_SUPPRESSED

    NotificationSummary:
      type: object
      properties:
        id: { type: string, pattern: '^ntf_[0-9A-HJKMNP-TV-Z]{26}$' }
        eventType: { type: string }
        channel: { $ref: "#/components/schemas/NotificationChannel" }
        status: { $ref: "#/components/schemas/NotificationStatus" }
        suppressedReason:
          allOf: [{ $ref: "#/components/schemas/NotificationSuppressionReason" }]
          nullable: true
        recipientType: { type: string }
        recipientName: { type: string, nullable: true }
        subject: { type: string, nullable: true }
        attemptCount: { type: integer }
        lastError: { type: string, nullable: true }
        nextAttemptAt: { type: string, format: date-time, nullable: true }
        sentAt: { type: string, format: date-time, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }
        failedAt: { type: string, format: date-time, nullable: true }
        awb: { type: string, nullable: true }
        reference: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    NotificationDetail:
      allOf:
        - $ref: "#/components/schemas/NotificationSummary"
        - type: object
          properties:
            recipientAddress: { type: string }
            locale: { type: string }
            templateCode: { type: string, nullable: true }
            body:
              type: string
              description: The rendered text that was sent, verbatim.
            maxRetries: { type: integer }
            attempts:
              type: array
              items: { $ref: "#/components/schemas/NotificationAttempt" }

    NotificationAttempt:
      type: object
      properties:
        attemptNo: { type: integer }
        provider: { type: string, nullable: true }
        outcome: { type: string }
        providerMessageId: { type: string, nullable: true }
        providerStatus: { type: string, nullable: true }
        errorMessage: { type: string, nullable: true }
        retryable: { type: boolean }
        durationMs: { type: integer, nullable: true }
        attemptedAt: { type: string, format: date-time }

    NotificationTemplate:
      type: object
      properties:
        id: { type: string, pattern: '^ntt_[0-9A-HJKMNP-TV-Z]{26}$' }
        code: { type: string }
        name: { type: string }
        eventType: { type: string }
        channel: { $ref: "#/components/schemas/NotificationChannel" }
        locale: { type: string }
        subject: { type: string, nullable: true }
        body: { type: string }
        providerRef: { type: string, nullable: true }
        variables:
          type: array
          description: Derived from the body, never supplied by the caller.
          items: { type: string }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateNotificationTemplateRequest:
      type: object
      required: [code, name, eventType, channel, body]
      properties:
        providerRef:
          type: string
          description: |
            The handle the provider needs to accept this message — an approved
            WhatsApp template name, or a registered SMS sender id. Optional: a
            provider that needs none should not be made to invent one.

            It is snapshotted onto each notification at composition time, so a
            template re-approved later does not change what an already-sent
            message was addressed with.
        code: { type: string }
        name: { type: string, minLength: 2, maxLength: 120 }
        eventType: { type: string }
        channel: { $ref: "#/components/schemas/NotificationChannel" }
        locale: { type: string, default: en }
        subject:
          type: string
          description: Required for EMAIL — a message with no subject line arrives looking like spam.
        body: { type: string, minLength: 1, maxLength: 4000 }

    NotificationPreference:
      type: object
      properties:
        id: { type: string }
        partyType: { type: string, enum: [CUSTOMER, USER, FRANCHISE, RECIPIENT] }
        channel: { $ref: "#/components/schemas/NotificationChannel" }
        eventType:
          type: string
          nullable: true
          description: Null means the preference covers every event on the channel.
        enabled: { type: boolean }
        locale: { type: string }

    SetNotificationPreferenceRequest:
      type: object
      required: [partyType, channel, enabled]
      properties:
        partyType: { type: string, enum: [CUSTOMER, USER, FRANCHISE, RECIPIENT] }
        partyId:
          type: string
          description: Public id of the party. Required unless partyKey is given.
        partyKey:
          type: string
          description: A bare address, for a RECIPIENT with no row of its own.
        channel: { $ref: "#/components/schemas/NotificationChannel" }
        eventType:
          type: string
          description: Omit for a blanket preference. An event-specific row wins over one.
        enabled: { type: boolean }
        locale: { type: string, default: en }

    # ---------------------------------------------- Customer portal (M27) --
    PortalCustomerSummary:
      type: object
      properties:
        windowDays: { type: integer }
        total: { type: integer, format: int64 }
        delivered: { type: integer, format: int64 }
        inProgress: { type: integer, format: int64 }
        exceptions: { type: integer, format: int64 }
        returning: { type: integer, format: int64 }
        spendMinor: { type: integer, format: int64 }
        codBookedMinor: { type: integer, format: int64 }
        currency: { type: string }
        deliveryRateBasisPoints: { type: integer }

    PortalAccount:
      type: object
      properties:
        id: { type: string, pattern: '^cus_[0-9A-HJKMNP-TV-Z]{26}$' }
        code: { type: string }
        name: { type: string }
        customerType: { type: string }
        status: { type: string }
        creditLimitMinor: { type: integer, format: int64, nullable: true }
        creditUsedMinor: { type: integer, format: int64, nullable: true }
        creditAvailableMinor:
          type: integer
          format: int64
          nullable: true
          description: Computed from the two above, so it cannot drift from them.
        paymentTermsDays: { type: integer, nullable: true }
        creditStatus: { type: string, nullable: true }
        currency: { type: string, nullable: true }

    PortalShipment:
      type: object
      description: |
        A customer's view of their own parcel. Deliberately not the operations
        projection: no internal facility codes, no route snapshot.
      properties:
        id: { type: string, pattern: '^shp_[0-9A-HJKMNP-TV-Z]{26}$' }
        awb: { type: string }
        reference: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/ShipmentStatus" }
        statusChangedAt: { type: string, format: date-time }
        service: { type: string }
        pieces: { type: integer }
        originPincode: { type: string }
        destinationPincode: { type: string }
        recipientName: { type: string, nullable: true }
        recipientCity: { type: string, nullable: true }
        paymentMode: { type: string }
        totalAmountMinor: { type: integer, format: int64 }
        codAmountMinor: { type: integer, format: int64 }
        currency: { type: string }
        promisedDeliveryAt: { type: string, format: date-time, nullable: true }
        bookedAt: { type: string, format: date-time }

    PortalInvoice:
      type: object
      properties:
        id: { type: string, pattern: '^inv_[0-9A-HJKMNP-TV-Z]{26}$' }
        invoiceNumber: { type: string }
        status: { $ref: "#/components/schemas/InvoiceStatus" }
        issueDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        totalMinor: { type: integer, format: int64 }
        paidMinor: { type: integer, format: int64 }
        outstandingMinor: { type: integer, format: int64 }
        currency: { type: string }
        periodStart: { type: string, format: date, nullable: true }
        periodEnd: { type: string, format: date, nullable: true }
        customer: { type: string }

    # --------------------------------------------- Franchise portal (M28) --
    FranchiseRef:
      type: object
      properties:
        id: { type: string, pattern: '^frn_[0-9A-HJKMNP-TV-Z]{26}$' }
        code: { type: string }
        name: { type: string }

    PortalFranchiseSummary:
      type: object
      properties:
        franchise: { $ref: "#/components/schemas/FranchiseRef" }
        from: { type: string, format: date }
        to: { type: string, format: date }
        booked: { type: integer, format: int64 }
        delivered: { type: integer, format: int64 }
        ndr: { type: integer, format: int64 }
        rto: { type: integer, format: int64 }
        revenueMinor: { type: integer, format: int64 }
        commissionEarnedMinor:
          type: integer
          format: int64
          description: |
            The net of the signed entry types — EARNED positive, REVERSAL
            negative — matching what the settlement engine computes. Counting
            only EARNED would show money that was later reversed.
        commissionSettledMinor: { type: integer, format: int64 }
        commissionOutstandingMinor: { type: integer, format: int64 }
        codInCustodyMinor: { type: integer, format: int64 }
        codObligations: { type: integer, format: int64 }
        codAgedOver48h: { type: integer, format: int64 }
        currency: { type: string }
        deliveryRateBasisPoints: { type: integer }

    FranchiseShipment:
      type: object
      properties:
        id: { type: string, pattern: '^shp_[0-9A-HJKMNP-TV-Z]{26}$' }
        awb: { type: string }
        status: { $ref: "#/components/schemas/ShipmentStatus" }
        customer: { type: string }
        service: { type: string }
        pieces: { type: integer }
        destinationPincode: { type: string }
        paymentMode: { type: string }
        totalAmountMinor: { type: integer, format: int64 }
        codAmountMinor: { type: integer, format: int64 }
        currency: { type: string }
        bookedAt: { type: string, format: date-time }
        role:
          type: string
          enum: [ORIGIN, DESTINATION]
          description: Why this parcel is on the list — booked here, or to be delivered here.

    PortalSettlement:
      type: object
      properties:
        id: { type: string, pattern: '^stl_[0-9A-HJKMNP-TV-Z]{26}$' }
        settlementNumber: { type: string }
        status: { $ref: "#/components/schemas/SettlementStatus" }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        netAmountMinor: { type: integer, format: int64 }
        paidMinor: { type: integer, format: int64 }
        outstandingMinor: { type: integer, format: int64 }
        currency: { type: string }
        approvedAt: { type: string, format: date-time, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }

    # ---------------------------------------------------- Console (M29) --
    UnitRef:
      type: object
      properties:
        id: { type: string, pattern: '^ou_[0-9A-HJKMNP-TV-Z]{26}$' }
        code: { type: string }
        name: { type: string }

    ConsoleParcel:
      type: object
      description: |
        What a scanner shows. Ten fields, not the shipment's forty — this runs
        on a phone over a branch's mobile connection, thousands of times a day.
      properties:
        id: { type: string, pattern: '^shp_[0-9A-HJKMNP-TV-Z]{26}$' }
        awb: { type: string }
        status: { $ref: "#/components/schemas/ShipmentStatus" }
        pieces: { type: integer }
        destinationPincode: { type: string }
        destinationCity: { type: string }
        destinationBranch: { type: string }
        amountDueMinor:
          type: integer
          format: int64
          description: |
            Present only for COD. A prepaid parcel carries no money field at
            all rather than a zero, so an operator cannot misread one.
        currency: { type: string }
        isHeld: { type: boolean }
        isReturning: { type: boolean }
        custodyUnit: { type: string }

    ConsoleQueueItem:
      type: object
      properties:
        id: { type: string, pattern: '^shp_[0-9A-HJKMNP-TV-Z]{26}$' }
        awb: { type: string }
        status: { $ref: "#/components/schemas/ShipmentStatus" }
        pieces: { type: integer }
        destinationPincode: { type: string }
        destinationBranch: { type: string }
        amountDueMinor: { type: integer, format: int64 }
        promisedBy: { type: string, format: date-time }
        isHeld: { type: boolean }

    ConsoleFacilitySummary:
      type: object
      properties:
        unit: { $ref: "#/components/schemas/UnitRef" }
        inCustody: { type: integer, format: int64 }
        outForDelivery: { type: integer, format: int64 }
        exceptions: { type: integer, format: int64 }
        held: { type: integer, format: int64 }
        overdue: { type: integer, format: int64 }
        openBags: { type: integer, format: int64 }
        inboundExpected: { type: integer, format: int64 }

    ConsoleBag:
      type: object
      properties:
        id: { type: string, pattern: '^bag_[0-9A-HJKMNP-TV-Z]{26}$' }
        bagCode: { type: string }
        status: { type: string }
        shipments: { type: integer }
        weightGrams: { type: integer, format: int64 }
        destination: { type: string }

    ConsoleInboundManifest:
      type: object
      properties:
        id: { type: string, pattern: '^mft_[0-9A-HJKMNP-TV-Z]{26}$' }
        manifestCode: { type: string }
        status: { type: string }
        bags: { type: integer }
        shipments: { type: integer }
        weightGrams: { type: integer, format: int64 }
        origin: { type: string }
        dispatchedAt: { type: string, format: date-time, nullable: true }

    # ---------------------------------------------------- Reports (M31) --
    ReportType:
      type: string
      enum:
        - SHIPMENT_VOLUME
        - BRANCH_PERFORMANCE
        - FRANCHISE_PERFORMANCE
        - SERVICE_PERFORMANCE
        - SLA
        - NDR
        - RTO
        - COD_AGING
        - COMMISSION
        - SETTLEMENT
        - REVENUE
        - EXCEPTIONS

    ReportStatus:
      type: string
      enum: [QUEUED, RUNNING, COMPLETED, FAILED, EXPIRED, CANCELLED]

    QueueReportRequest:
      type: object
      required: [reportType, periodStart, periodEnd]
      properties:
        reportType: { $ref: "#/components/schemas/ReportType" }
        format: { type: string, enum: [CSV, JSON], default: CSV }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        unitId:
          type: string
          pattern: '^ou_[0-9A-HJKMNP-TV-Z]{26}$'
          description: |
            Narrow to one operating unit. A scoped caller is confined to its own
            whether or not this is supplied.
        status: { type: string }

    ReportRun:
      type: object
      properties:
        id: { type: string, pattern: '^rpt_[0-9A-HJKMNP-TV-Z]{26}$' }
        reportType: { $ref: "#/components/schemas/ReportType" }
        format: { type: string }
        status: { $ref: "#/components/schemas/ReportStatus" }
        rowCount: { type: integer, format: int64 }
        byteSize: { type: integer, format: int64 }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        durationMs: { type: integer, nullable: true }
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: After this the file is deleted and the download refused.
        errorMessage: { type: string, nullable: true }
        requestedBy: { type: string, nullable: true }
        downloadUrl:
          type: string
          description: Present only once the run is COMPLETED.
        createdAt: { type: string, format: date-time }

    AdjustmentStatus:
      type: string
      enum: [PENDING_APPROVAL, APPROVED, REJECTED, APPLIED]

    AdjustmentType:
      type: string
      enum: [CORRECTION, PENALTY, INCENTIVE, WAIVER, RECOVERY, GOODWILL, OTHER]

    RaiseAdjustmentRequest:
      type: object
      required: [adjustmentType, amountMinor, reason]
      properties:
        adjustmentType: { $ref: "#/components/schemas/AdjustmentType" }
        amountMinor:
          type: integer
          format: int64
          description: |
            Signed minor units. Positive increases what the network owes the
            franchise; negative reduces it. Zero is refused — that is a note,
            not a correction.
        reason: { type: string, minLength: 10 }

    SettlementAdjustment:
      type: object
      properties:
        id: { type: string, pattern: '^sad_[0-9A-HJKMNP-TV-Z]{26}$' }
        settlementNumber: { type: string }
        settlementStatus: { $ref: "#/components/schemas/SettlementStatus" }
        adjustmentType: { $ref: "#/components/schemas/AdjustmentType" }
        amountMinor: { type: integer, format: int64 }
        currency: { type: string }
        reason: { type: string }
        status: { $ref: "#/components/schemas/AdjustmentStatus" }
        requestedBy: { type: string, nullable: true }
        requestedAt: { type: string, format: date-time }
        approvedBy: { type: string, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }
        rejectionReason: { type: string, nullable: true }
        posted:
          type: boolean
          description: |
            True once the adjustment has posted its own journal, which happens
            only when the settlement it corrects was already frozen.

    PortalSubject:
      type: object
      description: |
        Who this session *is*, as opposed to what it may do.

        Roles and permissions answer "what am I allowed to do"; this answers
        "which accounts do I represent". Without it a portal client has to infer
        its franchise from a list of operating unit ids, which is backend
        authorization logic running in a browser.
      properties:
        isCustomerUser:
          type: boolean
          description: |
            True when the login is linked to customer accounts and may use
            `/api/v1/portal/customer`. A staff login is false even if its role
            happens to carry `portal.customer` — the portal refuses it.
        customers:
          type: array
          description: The accounts a customer login may act for. Empty for staff.
          items: { $ref: "#/components/schemas/PortalCustomerRef" }
        franchise:
          allOf: [{ $ref: "#/components/schemas/PortalFranchiseRef" }]
          nullable: true
          description: |
            The franchise this login's operating units belong to, when there is
            exactly one. Null for head office, and null when the units span
            several franchises — a configuration error the franchise portal
            reports rather than resolving arbitrarily.

    PortalCustomerRef:
      type: object
      properties:
        id: { type: string, pattern: '^cus_[0-9A-HJKMNP-TV-Z]{26}$' }
        code: { type: string }
        name: { type: string }

    PortalFranchiseRef:
      type: object
      properties:
        id: { type: string, pattern: '^frn_[0-9A-HJKMNP-TV-Z]{26}$' }
        code: { type: string }
        name: { type: string }
        operatingUnitCode: { type: string }

    OffsetPagination:
      type: object
      description: |
        Metadata for an offset listing. Without a total a client has to request
        the maximum page and guess whether there is another.
      properties:
        limit: { type: integer }
        offset: { type: integer }
        totalItems: { type: integer, format: int64 }
        hasMore: { type: boolean }
