  /api/v1/exceptions/{exceptionId}/resolve:
    post:
      tags: [Hub operations]
      summary: Resolve or reassign an exception
      operationId: resolveException
      description: |
        Closing an exception requires both an action and a note. "Resolved" with no explanation is exactly the record that makes a later dispute unwinnable, and the database refuses it regardless of what the API does.

        Requires the `exception.resolve` permission.
      parameters:
        - { name: exceptionId, in: path, required: true, schema: { type: string } }
