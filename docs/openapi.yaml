openapi: 3.1.0

info:
  title: Courier Operating System API
  version: "1.0.0"
  summary: Release 1 — foundation, configuration and shipment booking.
  description: |
    The authoritative contract between the Courier OS backend and any client.
    The backend owns every business and financial rule; a client must not
    recompute prices, decide routes, or infer state transitions.

    ## Authentication

    All endpoints except `/livez`, `/readyz`, `/version` and the four
    `/api/v1/auth` credential endpoints require a bearer access token.

    Access tokens are JWTs valid for 15 minutes. Refresh tokens are opaque,
    valid for 30 days, and **rotate on every use**: each call to
    `/auth/refresh` returns a new refresh token and invalidates the one
    presented. Presenting an already-rotated refresh token is treated as a
    leak — every session descended from that login is revoked immediately and
    the user must sign in again.

    ## Identifiers

    Every object is addressed by an opaque, prefixed public identifier
    (`shp_...`, `cus_...`, `ou_...`). Internal database keys are never exposed
    and must never be inferred. The AWB is a separate, human-readable business
    identifier with its own format.

    ## Money

    All monetary amounts are integers in the currency's **minor units**:
    `12550` is ₹125.50. Percentages are integer **basis points**: `1850` is
    18.50%. Never use floating-point arithmetic on these values, and never
    recompute a total client-side — the server's figure is authoritative.

    ## Pagination

    High-volume collections (shipments, audit events) use **cursor**
    pagination: pass the `nextCursor` from the previous response. Configuration
    collections use **page/pageSize** offset pagination and report a total.

    ## Idempotency

    `POST /shipments` accepts an `Idempotency-Key` header. A retry with the
    same key and the same body returns the original response with
    `Idempotent-Replay: true` instead of creating a second shipment. The same
    key with a *different* body is rejected with `IDEMPOTENCY_KEY_REUSED`.
    Clients on unreliable networks should always send one.

    ## Errors

    Every failure uses one envelope. Switch on `error.code`, not on the HTTP
    status alone, and show `error.message` to users.
  contact:
    name: Courier OS Backend
  license:
    name: Proprietary

servers:
  - url: https://api.example.com
    description: Production
  - url: http://localhost:8080
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Ledger
    description: |
      Double-entry accounting. Nothing here stores a balance — every figure is
      a SUM over immutable entries, and corrections are new postings.
  - name: Commission
    description: |
      Versioned commission rules with deterministic precedence, and an
      immutable record of every calculation including its arithmetic trace.
  - name: COD
    description: |
      Cash-on-delivery custody and liability, from the doorstep to the
      consignor, with two-sided hand-offs and counted reconciliation.
  - name: Settlement
    description: |
      Reproducible period statements between head office and a franchise,
      with line-level provenance and maker/checker approval.
  - name: Billing
    description: |
      Customer invoicing with snapshot lines, gapless statutory numbering and
      configurable tax, plus credit and debit notes.
  - name: Health
    description: Probes and build information. No authentication.
  - name: Authentication
    description: Sign-in, token lifecycle and self-service password management.
  - name: Users & Roles
    description: User administration and RBAC.
  - name: Organization
    description: Tenant profile and audit trail.
  - name: Network
    description: Regions, hubs, branches and franchises.
  - name: Geography
    description: Countries, states, cities, PIN codes, zones and bulk import.
  - name: Courier Services
    description: Configurable courier products.
  - name: Serviceability & Routing
    description: Coverage lookup, deterministic routing and its configuration.
  - name: Pricing
    description: Quotes, rate cards and tax rules.
  - name: Customers
    description: Retail and business customers, addresses, contacts and credit.
  - name: Shipments
    description: Booking, retrieval, cancellation and labels.

  - name: Pickup
    description: |
      Pickup requests, agent assignment, runs and attempts (M09). A pickup is
      the first physical touch of a shipment; the address is snapshotted onto
      the request so editing a customer address later cannot redirect a
      collection already dispatched.
  - name: Scanning
    description: |
      Scanner-grade operational scans (M10). Every scan is recorded, including
      rejected ones, and retries collapse on the device event id so a dropped
      connection never turns one physical scan into two events.
  - name: Bagging
    description: |
      Bags as first-class containers (M11). Closure freezes contents at the
      database level; a post-closure correction requires an exception record.
  - name: Manifest
    description: |
      The electronic handover document between two facilities (M12). Closure
      takes an immutable content snapshot and queues a printable document.
  - name: Line haul
    description: |
      Carriers, vehicles, drivers and trips (M13). A trip departing moves only
      the shipments on its manifests, never everything at the origin.
  - name: Hub operations
    description: |
      Facility workload, reconciliation and operational exceptions (M14).
      Every discrepancy between what was declared and what arrived becomes an
      exception with an owner.
  - name: Delivery
    description: |
      Delivery runs, the branch queue and delivery attempts (M15, M16). One
      agent per parcel and one success per parcel, both enforced by database
      constraints rather than by convention.
  - name: NDR
    description: |
      Non-delivery reports as a workflow (M17): a case, its attempts, and the
      instruction currently in force.
  - name: RTO
    description: |
      Return to sender as reverse movement over the same physical network
      (M18), tracked by legs rather than by a mirrored set of statuses.
  - name: Proof of delivery
    description: |
      Delivery evidence and its artifacts (M19). Files live in private object
      storage; the API stores the key, size, MIME type and SHA-256.
  - name: Public tracking
    description: |
      Unauthenticated shipment tracking by AWB (M20). Deliberately narrow: no
      internal identifiers, no employee names, no facility detail beyond a city.
  - name: Notifications
    description: |
      Message templates, recipient preferences and the outbox (M26).

      Raising a notification never fails the business operation that caused it:
      an unsendable message becomes a `SUPPRESSED` row carrying the reason. That
      makes this surface the only way to find out a customer was not told —
      without it the module is a black box that swallows problems quietly.
  - name: Customer portal
    description: |
      What a customer sees of their own account (M27), under
      `/api/v1/portal/customer`.

      Scoped by the `customer_users` link, not by the tenant. A staff login is
      refused outright rather than shown everything: an unrestricted scope means
      "no restriction" for staff and would mean "the whole book" here.
  - name: Franchise portal
    description: |
      What a franchise sees of its own operation (M28), under
      `/api/v1/portal/franchise`: volume, commission earned, COD held and its
      own settlements.

      The franchise is derived from the caller's operating-unit grants, never
      from a parameter. Naming somebody else's franchise is a 404.
  - name: Console
    description: |
      The hub and branch console (M29), under `/api/v1/console`.

      The surface a handheld scanner talks to, and the only one where response
      *size* is a design constraint. A lookup returns ten fields, not the
      shipment's forty: a branch runs this on a phone over a mobile connection,
      thousands of times a day.
  - name: Reports
    description: |
      The export engine (M31).

      A report is a job, not a request. `POST` queues it and returns **202**;
      a worker reads with a cursor and streams CSV straight into object storage;
      the download is a short-lived signed URL. Nothing is ever built in RAM or
      inside an HTTP request, and a finished export expires — it is customer
      data sitting in a bucket.
  - name: Command centre
    description: |
      The operations dashboard (M30).

      Two kinds of figure, and the response says which is which. **Period
      totals** read an incrementally maintained rollup that is updated in the
      same transaction as each status change, so they are exact — there is no
      staleness window. **Live backlog** is counted at request time over an
      indexed status. **Snapshots** are the one sampled series, and every point
      carries its own `capturedAt`.

      Read-only. Every action it surfaces is taken through the module that owns
      it.
  - name: Partner API
    description: |
      The outward-facing surface for partner integrations (M32), under
      `/api/v1/partner`. Authenticated by an **API key**, authorized by
      **scopes**, and rate limited **per key**.

      Scopes are not permissions. A user carries permissions derived from their
      roles; a partner carries scopes carried on its key. The two systems never
      mix, so a key can never acquire a person's rights and a role can never be
      granted a partner scope by accident. A session token is not accepted here,
      and an API key is not accepted anywhere else.

      Every endpoint calls the same service the internal API calls — the same
      rate card, the same routing, the same state machine — so an external
      booking and an internal one cannot diverge.
  - name: API keys
    description: |
      Issuing and revoking partner credentials (M32). A user act, governed by
      `apikey.manage`; no API key can reach these endpoints however many scopes
      it holds.

      The secret is returned exactly once, at creation, and stored only as an
      Argon2id hash. There is no recovery path: a lost key is replaced.
      Revocation is one-way and enforced by a database trigger, because a leaked
      credential must never come back.
  - name: Webhooks
    description: |
      Outbound event delivery to partner endpoints (M32).

      Deliveries are queued inside the transaction that caused them and sent
      later by a worker, so a partner's outage costs a retry rather than a
      shipment. Each request is signed; a consumer verifies the signature to
      know the call really came from us.
paths:
  # ---------------------------------------------------------------- Health --
  /livez:
    get:
      tags: [Health]
      summary: Liveness probe
      description: |
        Reports whether the process is running. It never touches a dependency,
        so a database outage does not cause a restart loop.
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: alive }
                  uptimeSeconds: { type: integer }
              example: { status: alive, uptimeSeconds: 3600 }

  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      description: |
        Reports whether this instance can serve traffic. Redis is a cache, not a
        system of record, so a Redis outage reports `degraded` and readiness
        still passes unless the deployment declared Redis required.
      security: []
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessResponse" }
        "503":
          description: Not ready; a required dependency is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessResponse" }

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Sign in
      description: |
        Authenticates a user and opens a session. The tenant is derived from the
        matched account; a client never supplies an organization.

        Repeated failures lock the account for 15 minutes. Every failure
        response is identical regardless of whether the address exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 1, maxLength: 256 }
            example:
              email: admin@demo.test
              password: "DemoPassw0rd!2026"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401":
          description: |
            Credentials rejected. `INVALID_CREDENTIALS` covers unknown address
            and wrong password alike; `ACCOUNT_LOCKED` and `ACCOUNT_INACTIVE`
            are returned only once the password itself was correct.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                invalid:
                  value:
                    error:
                      code: INVALID_CREDENTIALS
                      message: Email or password is incorrect.
                      requestId: req_01KZG...
                locked:
                  value:
                    error:
                      code: ACCOUNT_LOCKED
                      message: This account is temporarily locked after repeated failed sign-in attempts. Try again later.
                      requestId: req_01KZG...
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate the refresh token
      description: |
        Exchanges a refresh token for a new access/refresh pair. The presented
        token is invalidated. Presenting one that was already rotated revokes
        every session from that login and returns `TOKEN_REVOKED`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: A new token pair.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401":
          description: The token is invalid, expired or revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Sign out
      description: |
        Revokes the current session. Supplying `refreshToken` also revokes the
        whole rotation chain; `allDevices` revokes every session for the user.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
                allDevices: { type: boolean, default: false }
      responses:
        "204": { description: Signed out. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request a password reset
      description: |
        Always returns 200 with the same message whether or not the address
        exists, so this endpoint cannot be used to discover accounts. Outside
        production the response also carries `resetToken` for local testing.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Accepted (regardless of whether the address matched).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  resetToken:
                    type: string
                    description: Returned only outside production.
                  expiresAt: { type: string, format: date-time }

        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/auth/reset-password:
    post:
      tags: [Authentication]
      summary: Complete a password reset
      description: |
        Consumes a single-use token, sets the new password and revokes every
        existing session. A token cannot be redeemed twice.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { $ref: "#/components/schemas/Password" }
      responses:
        "200":
          description: Password updated.
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        "401":
          description: The link is invalid, expired or already used.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/auth/change-password:
    post:
      tags: [Authentication]
      summary: Change your own password
      description: Revokes every other session on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { $ref: "#/components/schemas/Password" }
      responses:
        "200":
          description: Password updated.
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: The signed-in user
      description: |
        Returns the profile, the tenant, and the effective permission and
        operating-unit scope. Drive menu and button visibility from
        `permissions`; the server enforces them regardless.
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/sessions:
    get:
      tags: [Authentication]
      summary: List your active sessions
      description: No token material is ever returned.
      responses:
        "200":
          description: Active sessions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SessionSummary" }

  # ----------------------------------------------------------- Users/Roles --
  /api/v1/users:
    get:
      tags: [Users & Roles]
      summary: List users
      description: "Requires `user.read`."
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE, LOCKED] }
        - name: search
          in: query
          description: Matches email or full name.
          schema: { type: string }
        - name: roleCode
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of users.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OffsetPage"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Users & Roles]
      summary: Create a user
      description: |
        Requires `user.create`. `isSuperAdmin` is not accepted: platform
        operators are provisioned out of band. Granting `SUPER_ADMIN` requires
        the caller to be a platform operator, and no role may carry a permission
        the caller does not hold.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/users/{userId}:
    parameters:
      - { $ref: "#/components/parameters/UserId" }
    get:
      tags: [Users & Roles]
      summary: Get a user
      responses:
        "200":
          description: The user, including role assignments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Users & Roles]
      summary: Update a user
      description: "Requires `user.update`. Only the listed fields are editable."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string, minLength: 1, maxLength: 160 }
                phone: { type: string }
                email: { type: string, format: email }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/users/{userId}/status:
    parameters:
      - { $ref: "#/components/parameters/UserId" }
    post:
      tags: [Users & Roles]
      summary: Activate or deactivate a user
      description: |
        Requires `user.deactivate`. Deactivation revokes every session
        immediately. You cannot deactivate yourself, nor the last active
        administrator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACTIVE, INACTIVE] }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/users/{userId}/roles:
    parameters:
      - { $ref: "#/components/parameters/UserId" }
    get:
      tags: [Users & Roles]
      summary: List a user's role assignments
      responses:
        "200":
          description: Role assignments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/RoleAssignment" }
    post:
      tags: [Users & Roles]
      summary: Grant a role
      description: |
        Requires `user.assign_role`. Roles whose `scopeRequired` is true must
        name an operating unit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleGrant" }
      responses:
        "200":
          description: The user's role assignments after the grant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/RoleAssignment" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Users & Roles]
      summary: Revoke a role
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleGrant" }
      responses:
        "204": { description: Revoked. }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/roles:
    get:
      tags: [Users & Roles]
      summary: List roles
      description: |
        Returns the twelve shared system roles plus any custom roles this
        tenant has defined. System roles cannot be modified.
      responses:
        "200":
          description: Roles.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Role" }
    post:
      tags: [Users & Roles]
      summary: Create a custom role
      description: |
        Requires `role.create`. A role may only be given permissions the caller
        already holds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { $ref: "#/components/schemas/Code" }
                name: { type: string, minLength: 2, maxLength: 120 }
                description: { type: string, maxLength: 500 }
                scopeRequired: { type: boolean, default: false }
                permissions:
                  type: array
                  items: { type: string }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/roles/{roleId}/permissions:
    parameters:
      - name: roleId
        in: path
        required: true
        schema: { type: string, pattern: "^rol_[0-9A-HJKMNP-TV-Z]{26}$" }
    put:
      tags: [Users & Roles]
      summary: Replace a custom role's permissions
      description: |
        Requires `role.update`. Everyone holding the role has their cached
        authorization rebuilt immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: array
                  maxItems: 200
                  items: { type: string }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "409":
          description: System roles are immutable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/permissions:
    get:
      tags: [Users & Roles]
      summary: The permission catalogue
      responses:
        "200":
          description: All permissions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Permission" }

  # ---------------------------------------------------------- Organization --
  /api/v1/organization:
    get:
      tags: [Organization]
      summary: Get the tenant profile
      responses:
        "200":
          description: The organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
    patch:
      tags: [Organization]
      summary: Update the tenant profile
      description: |
        Requires `organization.update`. `code`, `currency`, `awbPrefix` and
        `status` are immutable: changing the AWB prefix would break the
        uniqueness assumption behind existing AWBs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                legalName: { type: string }
                timezone: { type: string, examples: ["Asia/Kolkata"] }
                contactEmail: { type: string, format: email }
                contactPhone: { type: string }
                gstNumber: { $ref: "#/components/schemas/GSTIN" }
                settings: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }

        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/audit-events:
    get:
      tags: [Organization]
      summary: The audit trail
      description: |
        Requires `audit.read`. Cursor paginated, newest first. Audit records are
        append-only and cannot be edited or deleted through any API.
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - name: action
          in: query
          schema: { type: string, examples: ["shipment.booked"] }
        - name: resourceType
          in: query
          schema: { type: string, examples: ["shipment"] }
        - name: resourceId
          in: query
          schema: { type: string }
        - name: actorId
          in: query
          schema: { type: string }
        - name: occurredFrom
          in: query
          schema: { type: string, format: date-time }
        - name: occurredTo
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: A page of audit events.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AuditEvent" }

  # -------------------------------------------------------------- Network --
  /api/v1/network/operating-units:
    get:
      tags: [Network]
      summary: List hubs and branches
      description: |
        Hubs and branches are one entity discriminated by `unitType`. A
        principal whose roles are all unit-scoped sees only its own facilities.
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
        - name: unitType
          in: query
          description: Comma-separated list.
          schema: { type: string, examples: ["DELIVERY_HUB,COMPANY_BRANCH"] }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE, SUSPENDED] }
        - name: pincode
          in: query
          schema: { $ref: "#/components/schemas/Pincode" }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of operating units.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OffsetPage"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/OperatingUnit" }
    post:
      tags: [Network]
      summary: Create a hub or branch
      description: "Requires `operating_unit.manage`."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOperatingUnitRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatingUnitSummary" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/network/operating-units/{unitId}:
    parameters:
      - { $ref: "#/components/parameters/UnitId" }
    get:
      tags: [Network]
      summary: Get an operating unit
      responses:
        "200":
          description: The unit, with its capabilities.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatingUnit" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Network]
      summary: Update an operating unit
      description: |
        Requires `operating_unit.manage`. `expectedVersion` must be the
        `version` you last read; a mismatch returns
        `CONCURRENT_MODIFICATION`. `code` and `unitType` are immutable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOperatingUnitRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatingUnitSummary" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/network/operating-units/{unitId}/deactivate:
    parameters:
      - { $ref: "#/components/parameters/UnitId" }
    post:
      tags: [Network]
      summary: Deactivate an operating unit
      description: |
        Units referenced by shipments are never deleted, only deactivated.
        Deactivation is refused while the unit has child units or is referenced
        by active service areas or routes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        "200":
          description: Deactivated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string }
                  retainedShipments: { type: integer }
        "409":
          description: The unit is still referenced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/network/operating-units/hierarchy:
    get:
      tags: [Network]
      summary: The network tree
      parameters:
        - name: rootId
          in: query
          description: Defaults to every root unit.
          schema: { type: string }
        - name: maxDepth
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        "200":
          description: A flattened tree, depth-first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        code: { type: string }
                        name: { type: string }
                        unitType: { $ref: "#/components/schemas/UnitType" }
                        status: { type: string }
                        depth: { type: integer }
                        path: { type: array, items: { type: string } }

  /api/v1/network/hubs:
    get:
      tags: [Network]
      summary: List hubs
      description: A filtered view of operating units where `unitType` is a hub type.
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A page of hubs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OffsetPage"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/OperatingUnit" }

  /api/v1/network/branches:
    get:
      tags: [Network]
      summary: List branches
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A page of branches.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OffsetPage"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/OperatingUnit" }

  /api/v1/network/franchises:
    get:
      tags: [Network]
      summary: List franchises
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
        - name: status
          in: query
          schema: { type: string, enum: [ONBOARDING, ACTIVE, SUSPENDED, TERMINATED] }
        - name: category
          in: query
          schema: { type: string, enum: [PLATINUM, GOLD, SILVER, STANDARD] }
      responses:
        "200":
          description: A page of franchises.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OffsetPage" }
    post:
      tags: [Network]
      summary: Create a franchise
      description: |
        Requires `franchise.manage`. A franchise must attach to a
        `FRANCHISE_BRANCH` operating unit, and each unit may host only one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFranchiseRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FranchiseSummary" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ------------------------------------------------------------ Geography --
  /api/v1/geography/pincodes/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Pincode" }
    get:
      tags: [Geography]
      summary: Look up a PIN code
      description: |
        Returns the shared PIN code record plus this tenant's zone assignment
        and the effective remote-area flag (the tenant override where present,
        otherwise the platform default).
      responses:
        "200":
          description: The PIN code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pincode: { $ref: "#/components/schemas/PincodeRecord" }
                  zone: { $ref: "#/components/schemas/ZoneAssignment" }
                  effectiveRemote: { type: boolean }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/geography/places:
    get:
      tags: [Geography]
      summary: Find a postcode from an area, city or LGA name
      description: |
        Resolves free text to postcode candidates, ranked by how strong the
        match is.

        This is the lookup a booking form calls. Serviceability, routing, zones
        and pricing are all keyed on postcode, but postcode adoption varies by
        market — a Nigerian sender gives an area, an LGA and a landmark, and may
        not know their six digits at all. Search here, let the sender pick, then
        submit the returned `code` as the address `pincode`. The booking
        contract is unchanged.

        Results are deduplicated by postcode: a code matched as an area, an
        office and an LGA at once appears once, classified by its strongest
        match. `matchedOn` says which field produced the hit so a picker can
        show the sender why a row is in the list.

        Requires `geography.read`.
      parameters:
        - name: q
          in: query
          required: true
          description: |
            The fragment to search for, minimum two characters. Matched against
            area name, city, LGA/district, post office name, and postcode
            prefix. LIKE wildcards are treated as literal text.
          schema: { type: string, minLength: 2, maxLength: 64 }
          example: "Ikeja GRA"
        - name: country
          in: query
          description: ISO-3166 alpha-2. Defaults to the caller's organization country.
          schema: { type: string, default: "NG" }
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: Ranked postcode candidates.
          content:
            application/json:
              schema:
                type: object
                required: [data, districtLabel]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Place" }
                  districtLabel:
                    type: string
                    description: |
                      What this market calls the level between state and city,
                      for the UI to label the field with. "LGA" in Nigeria,
                      "District" in India.
                    example: "LGA"
              example:
                data:
                  - id: "pin_01J8Z0000000000000000000"
                    code: "100001"
                    label: "Ikeja GRA, Ikeja, Lagos"
                    matchedOn: "AREA"
                    area: "Ikeja GRA"
                    city: "Lagos"
                    district: "Ikeja"
                    state: "Lagos"
                    stateCode: "LA"
                    isRemote: false
                districtLabel: "LGA"
        "422":
          description: The search term is missing, too short or too long.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/geography/districts:
    get:
      tags: [Geography]
      summary: List a state's districts (LGAs in Nigeria)
      description: |
        Lists the administrative level between state and city. Nigeria calls it
        a Local Government Area; India calls it a district. The `label` field
        carries the market's own word so a UI does not have to hardcode one.

        Requires `geography.read`.
      parameters:
        - name: state
          in: query
          required: true
          description: State code, as returned by /api/v1/geography/states.
          schema: { type: string, maxLength: 16 }
          example: "LA"
        - name: country
          in: query
          description: ISO-3166 alpha-2. Defaults to the caller's organization country.
          schema: { type: string, default: "NG" }
      responses:
        "200":
          description: The state's districts.
          content:
            application/json:
              schema:
                type: object
                required: [data, label]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, code, name, stateCode, stateName]
                      properties:
                        id: { type: string, example: "dst_01J8Z0000000000000000000" }
                        code: { type: string, example: "IKEJA" }
                        name: { type: string, example: "Ikeja" }
                        stateCode: { type: string, example: "LA" }
                        stateName: { type: string, example: "Lagos" }
                  label:
                    type: string
                    example: "LGA"
        "422":
          description: A state code is required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/geography/pincodes:
    get:
      tags: [Geography]
      summary: Search PIN codes
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
        - name: code
          in: query
          description: Prefix match.
          schema: { type: string, maxLength: 12 }
        - name: isRemote
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: A page of PIN codes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OffsetPage" }

  /api/v1/geography/states:
    get:
      tags: [Geography]
      summary: List states
      parameters:
        - name: country
          in: query
          schema: { type: string, default: "NG" }
      responses:
        "200":
          description: States.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        code: { type: string }
                        name: { type: string }
                        gstStateCode: { type: string }

  /api/v1/geography/zones:
    get:
      tags: [Geography]
      summary: List pricing zones
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE] }
      responses:
        "200":
          description: A page of zones.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OffsetPage" }
    post:
      tags: [Geography]
      summary: Create a zone
      description: "Requires `zone.manage`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, type]
              properties:
                code: { $ref: "#/components/schemas/Code" }
                name: { type: string }
                type: { $ref: "#/components/schemas/ZoneType" }
                description: { type: string }
                sortOrder: { type: integer }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zone" }

        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/geography/zone-mappings:
    get:
      tags: [Geography]
      summary: List PIN code to zone mappings
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
        - name: pincode
          in: query
          description: Prefix match.
          schema: { type: string }
        - name: zoneCode
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of mappings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OffsetPage" }
    put:
      tags: [Geography]
      summary: Map a PIN code to a zone
      description: |
        Requires `zone.manage`. Upserts the tenant's single active mapping for
        the PIN code and invalidates the cached zone decision immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pincode, zoneCode]
              properties:
                pincode: { $ref: "#/components/schemas/Pincode" }
                zoneCode: { type: string }
                isRemote:
                  type: boolean
                  description: Overrides the platform default for this tenant.
      responses:
        "200":
          description: Mapped.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  pincode: { type: string }
                  zoneCode: { type: string }

        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/geography/imports/pincodes:
    post:
      tags: [Geography]
      summary: Bulk import PIN codes
      description: |
        Platform operators only (`pincode.manage`). Upload a CSV with at least
        `pincode` and `state` columns; `city`, `district`, `latitude`,
        `longitude` and `is_remote` are optional.

        The upload is staged and processed asynchronously. Poll the returned
        `statusUrl`; rejected rows are retrievable as JSON or CSV.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "202":
          description: Accepted for processing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJobAccepted" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/geography/imports/zone-mappings:
    post:
      tags: [Geography]
      summary: Bulk import zone mappings
      description: |
        Requires `zone.manage`. CSV columns: `pincode`, `zone_code` and the
        optional `is_remote`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "202":
          description: Accepted for processing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJobAccepted" }

        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/geography/imports/{importId}:
    parameters:
      - name: importId
        in: path
        required: true
        schema: { type: string, pattern: "^imp_[0-9A-HJKMNP-TV-Z]{26}$" }
    get:
      tags: [Geography]
      summary: Import job status
      responses:
        "200":
          description: Progress and error summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/geography/imports/{importId}/errors:
    parameters:
      - name: importId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Geography]
      summary: Rejected rows
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Rejected rows with their reasons.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        rowNumber: { type: integer }
                        errorCode: { type: string }
                        errorMessage: { type: string }
                        row: { type: object, additionalProperties: { type: string } }

  # ----------------------------------------------------- Courier Services --
  /api/v1/courier-services:
    get:
      tags: [Courier Services]
      summary: List courier products
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE] }
        - name: mode
          in: query
          schema: { $ref: "#/components/schemas/TransportMode" }
        - name: codAllowed
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: A page of products.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OffsetPage"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/CourierService" }
    post:
      tags: [Courier Services]
      summary: Create a courier product
      description: |
        Requires `courier_service.manage`. Every behavioural difference between
        products is configuration: weight and dimension envelope, volumetric
        divisor, COD and insurance eligibility, SLA and cut-off.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCourierServiceRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourierService" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/courier-services/{serviceId}:
    parameters:
      - name: serviceId
        in: path
        required: true
        schema: { type: string, pattern: "^svc_[0-9A-HJKMNP-TV-Z]{26}$" }
    get:
      tags: [Courier Services]
      summary: Get a courier product
      responses:
        "200":
          description: The product.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourierService" }
    patch:
      tags: [Courier Services]
      summary: Update a courier product
      description: "Requires `courier_service.manage` and `expectedVersion`. `code` is immutable."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
                name: { type: string }
                description: { type: string }
                mode: { $ref: "#/components/schemas/TransportMode" }
                maxWeightGrams: { type: integer }
                slaTransitHours: { type: integer }
                codAllowed: { type: boolean }
                status: { type: string, enum: [ACTIVE, INACTIVE] }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourierService" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ------------------------------------------- Serviceability and Routing --
  /api/v1/serviceability/check:
    post:
      tags: [Serviceability & Routing]
      summary: Check coverage and resolve a route
      description: |
        Requires `serviceability.check`. Answers whether a lane can be carried,
        by which facilities and path, and by when.

        Resolution is deterministic: the same inputs against the same
        configuration always produce the same answer. Precedence is
        `OVERRIDE` > service-specific route > generic route > fallback route >
        local delivery.

        A refusal always carries a `reasonCode` you can map to guidance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [originPincode, destinationPincode, serviceCode]
              properties:
                originPincode: { $ref: "#/components/schemas/Pincode" }
                destinationPincode: { $ref: "#/components/schemas/Pincode" }
                serviceCode: { type: string }
                at:
                  type: string
                  format: date-time
                  description: Defaults to now. Effective dating and cut-offs are evaluated at this instant.
            example:
              originPincode: "560001"
              destinationPincode: "110001"
              serviceCode: EXPRESS
      responses:
        "200":
          description: |
            The answer. Note that an unserviceable lane is still a 200 — it is a
            valid answer to the question, not a request error.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceabilityResult" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/serviceability/debug:
    post:
      tags: [Serviceability & Routing]
      summary: Resolve with a full decision trace
      description: |
        Requires `routing.debug`. Identical to `/check` but returns the complete
        `explanation`: every candidate considered at each step and why it won or
        lost. Intended for administrators diagnosing configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [originPincode, destinationPincode, serviceCode]
              properties:
                originPincode: { $ref: "#/components/schemas/Pincode" }
                destinationPincode: { $ref: "#/components/schemas/Pincode" }
                serviceCode: { type: string }
                at: { type: string, format: date-time }
      responses:
        "200":
          description: The answer with its decision trace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceabilityResult" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/serviceability/explanations/{explanationId}:
    parameters:
      - name: explanationId
        in: path
        required: true
        schema: { type: string, pattern: "^exp_[0-9A-HJKMNP-TV-Z]{26}$" }
    get:
      tags: [Serviceability & Routing]
      summary: Retrieve a stored decision trace
      description: |
        Requires `routing.debug`. Traces are retained for a limited period; a
        shipment's trace is also stored permanently on its route snapshot.
      responses:
        "200":
          description: The decision trace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutingExplanation" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/serviceability/service-areas:
    get:
      tags: [Serviceability & Routing]
      summary: List service areas
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
        - name: pincode
          in: query
          schema: { $ref: "#/components/schemas/Pincode" }
        - name: areaType
          in: query
          schema: { type: string, enum: [PICKUP, DELIVERY, BOTH] }
      responses:
        "200":
          description: A page of service areas.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OffsetPage" }
    post:
      tags: [Serviceability & Routing]
      summary: Declare coverage
      description: |
        Requires `service_area.manage`. When several units cover the same PIN
        code, the highest `priority` wins; ties break towards the more specific
        `areaType` and then the oldest record, so the outcome is stable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operatingUnitId, pincode, areaType]
              properties:
                operatingUnitId: { type: string }
                pincode: { $ref: "#/components/schemas/Pincode" }
                areaType: { type: string, enum: [PICKUP, DELIVERY, BOTH] }
                priority: { type: integer, minimum: 0, maximum: 1000, default: 100 }
                isRemote: { type: boolean, default: false }
                cutoffTime: { $ref: "#/components/schemas/TimeOfDay" }
                effectiveFrom: { type: string, format: date-time }
                effectiveTo: { type: string, format: date-time }
      responses:
        "201":
          description: Created.
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/serviceability/closures:
    get:
      tags: [Serviceability & Routing]
      summary: List temporary closures
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
        - name: activeOnly
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: A page of closures.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OffsetPage" }
    post:
      tags: [Serviceability & Routing]
      summary: Declare a temporary closure
      description: |
        Requires `closure.manage`. Supply exactly one of `operatingUnitCode` or
        `pincode`. While a closure is in force, affected bookings are refused
        with `ORIGIN_TEMPORARILY_CLOSED` or `DESTINATION_TEMPORARILY_CLOSED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [closureType, reasonCode, reason, startsAt, endsAt]
              properties:
                operatingUnitCode: { type: string }
                pincode: { $ref: "#/components/schemas/Pincode" }
                closureType: { type: string, enum: [FULL, PICKUP_ONLY, DELIVERY_ONLY] }
                reasonCode:
                  type: string
                  enum: [WEATHER, STRIKE, HOLIDAY, LAW_AND_ORDER, INFRASTRUCTURE, OTHER]
                reason: { type: string, minLength: 5, maxLength: 500 }
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time }
      responses:
        "201":
          description: Declared.
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/routes:
    get:
      tags: [Serviceability & Routing]
      summary: List routes
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
        - name: originUnitCode
          in: query
          schema: { type: string }
        - name: destinationUnitCode
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of routes with their legs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OffsetPage" }
    post:
      tags: [Serviceability & Routing]
      summary: Create a route
      description: |
        Requires `route.manage`. Routes connect facilities, usually hub to hub;
        branches attach through their parent hub. At least one leg is required
        so the physical path is explicit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRouteRequest" }
      responses:
        "201":
          description: Created.
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/routes/overrides:
    post:
      tags: [Serviceability & Routing]
      summary: Create a routing override
      description: |
        Requires `route.manage`. An override sits above every other routing
        source for its exact lane. A substantive `reason` is mandatory and is
        copied into the audit trail and into every affected shipment's route
        snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [originPincode, destinationPincode, routeCode, reason]
              properties:
                originPincode: { $ref: "#/components/schemas/Pincode" }
                destinationPincode: { $ref: "#/components/schemas/Pincode" }
                serviceCode: { type: string }
                routeCode: { type: string }
                priority: { type: integer, default: 500 }
                reason: { type: string, minLength: 5, maxLength: 500 }
                effectiveFrom: { type: string, format: date-time }
                effectiveTo: { type: string, format: date-time }
      responses:
        "201":
          description: Created.

        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  # -------------------------------------------------------------- Pricing --
  /api/v1/pricing/quote:
    post:
      tags: [Pricing]
      summary: Price a shipment
      description: |
        Requires `pricing.quote`. Uses exactly the same engine, rate card and
        zone resolution as booking, so a quote and the price actually charged
        cannot drift.

        The response is a line-by-line breakdown. Every amount is in minor
        units and every line carries a plain-language `explanation` you can show
        to a customer. **Do not recompute the total client-side.**
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteRequest" }
      responses:
        "200":
          description: The price with its full breakdown.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
        "422":
          description: |
            Validation failed, or pricing is not configured for this lane.
            `details.code` is `RATE_CARD_NOT_FOUND` or `RATE_NOT_CONFIGURED`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/rate-cards:
    get:
      tags: [Pricing]
      summary: List rate cards
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
        - name: scope
          in: query
          schema: { type: string, enum: [RETAIL, BUSINESS, FRANCHISE] }
      responses:
        "200":
          description: A page of rate cards.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OffsetPage" }
    post:
      tags: [Pricing]
      summary: Create a rate card
      description: |
        Requires `rate_card.manage`. A `BUSINESS` card names a customer, a
        `FRANCHISE` card names a franchise, and exactly one `RETAIL` card may be
        the tenant default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, scope]
              properties:
                code: { $ref: "#/components/schemas/Code" }
                name: { type: string }
                description: { type: string }
                scope: { type: string, enum: [RETAIL, BUSINESS, FRANCHISE] }
                customerId: { type: string }
                franchiseId: { type: string }
                isDefault: { type: boolean }
      responses:
        "201":
          description: Created.
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/rate-cards/{cardId}/versions:
    parameters:
      - name: cardId
        in: path
        required: true
        schema: { type: string, pattern: "^rc_[0-9A-HJKMNP-TV-Z]{26}$" }
    get:
      tags: [Pricing]
      summary: List versions of a rate card
      responses:
        "200":
          description: A page of versions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OffsetPage" }
    post:
      tags: [Pricing]
      summary: Create a draft version
      description: |
        Requires `rate_card.manage`. Prices are edited only while a version is
        `DRAFT`. Changing published prices means creating a new version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                effectiveFrom: { type: string, format: date-time }
                effectiveTo: { type: string, format: date-time }
                notes: { type: string }
      responses:
        "201":
          description: Created as DRAFT.

        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/rate-cards/versions/{versionId}:
    parameters:
      - { $ref: "#/components/parameters/VersionId" }
    get:
      tags: [Pricing]
      summary: Get a rate card version
      description: Includes its zone rates and surcharges, and whether it is still editable.
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RateCardVersion" }

  /api/v1/rate-cards/versions/{versionId}/zone-rates:
    parameters:
      - { $ref: "#/components/parameters/VersionId" }
    put:
      tags: [Pricing]
      summary: Set a lane's rate
      description: |
        Requires `rate_card.manage`. Only a `DRAFT` version accepts writes;
        editing an activated version returns `IMMUTABLE_RESOURCE`.

        The linear model is: `basePriceMinor` covers everything up to
        `baseWeightGrams`, then each started `additionalStepGrams` costs
        `additionalPriceMinor`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceCode, originZoneCode, destinationZoneCode, baseWeightGrams, basePriceMinor]
              properties:
                serviceCode: { type: string }
                originZoneCode: { type: string }
                destinationZoneCode: { type: string }
                baseWeightGrams: { type: integer, minimum: 1 }
                basePriceMinor: { $ref: "#/components/schemas/MinorAmount" }
                additionalStepGrams: { type: integer, minimum: 1 }
                additionalPriceMinor: { $ref: "#/components/schemas/MinorAmount" }
                minChargeableWeightGrams: { type: integer, minimum: 0 }
            example:
              serviceCode: EXPRESS
              originZoneCode: LOCAL
              destinationZoneCode: NATIONAL
              baseWeightGrams: 500
              basePriceMinor: 5000
              additionalStepGrams: 500
              additionalPriceMinor: 2500
      responses:
        "200":
          description: Set.
        "409":
          description: The version is activated and immutable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/rate-cards/versions/{versionId}/surcharges:
    parameters:
      - { $ref: "#/components/parameters/VersionId" }
    post:
      tags: [Pricing]
      summary: Add a surcharge rule
      description: |
        Requires `rate_card.manage` and a `DRAFT` version. Surcharges apply in
        ascending `priority`, so a percentage rule based on
        `FREIGHT_PLUS_SURCHARGES` sees a deterministic running total.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSurchargeRequest" }
      responses:
        "201":
          description: Created.

        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/rate-cards/versions/{versionId}/activate:
    parameters:
      - { $ref: "#/components/parameters/VersionId" }
    post:
      tags: [Pricing]
      summary: Activate a version
      description: |
        Requires `rate_card.activate`. Supersedes the currently active version
        atomically, so a card is never left with two active versions or none.
        From this moment the version's prices are immutable.
      responses:
        "200":
          description: Activated.
        "409":
          description: Not a draft, or it has no rates.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/tax-rules:
    get:
      tags: [Pricing]
      summary: List tax rules
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A page of tax rules.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OffsetPage" }
    post:
      tags: [Pricing]
      summary: Create a tax rule
      description: |
        Requires `tax_rule.manage`. Tax rules are tenant-wide rather than
        per-rate-card: GST rates are statutory, not commercial. Set
        `intraStateOnly` to `true` for CGST/SGST and `false` for IGST.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, taxType, percentageBp]
              properties:
                code: { $ref: "#/components/schemas/Code" }
                name: { type: string }
                taxType: { type: string, enum: [CGST, SGST, IGST, UTGST, CESS, CUSTOM] }
                percentageBp: { $ref: "#/components/schemas/BasisPoints" }
                intraStateOnly: { type: boolean, nullable: true }
                hsnSacCode: { type: string }
                priority: { type: integer }
      responses:
        "201":
          description: Created.

        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  # ------------------------------------------------------------ Customers --
  /api/v1/customers:
    get:
      tags: [Customers]
      summary: List customers
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
        - name: customerType
          in: query
          schema: { type: string, enum: [RETAIL, BUSINESS] }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, SUSPENDED, CLOSED] }
        - name: search
          in: query
          description: Matches name, code, phone or email.
          schema: { type: string }
      responses:
        "200":
          description: A page of customers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OffsetPage" }
    post:
      tags: [Customers]
      summary: Create a customer
      description: |
        Requires `customer.create`. A `BUSINESS` customer must include a
        `businessAccount` block; creating one also creates its credit profile.
        `code` is generated when omitted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCustomerRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerSummary" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/customers/{customerId}:
    parameters:
      - { $ref: "#/components/parameters/CustomerId" }
    get:
      tags: [Customers]
      summary: Get a customer
      responses:
        "200":
          description: The customer, with business account and credit where present.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Customers]
      summary: Update a customer
      description: "Requires `customer.update` and `expectedVersion`. `code` and `customerType` are immutable."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
                name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                gstNumber: { $ref: "#/components/schemas/GSTIN" }
                panNumber: { $ref: "#/components/schemas/PAN" }
      responses:
        "200":
          description: Updated.
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/customers/{customerId}/addresses:
    parameters:
      - { $ref: "#/components/parameters/CustomerId" }
    get:
      tags: [Customers]
      summary: List a customer's addresses
      responses:
        "200":
          description: Addresses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CustomerAddress" }
    post:
      tags: [Customers]
      summary: Add an address
      description: |
        Requires `customer.update`. The PIN code must exist in the platform
        dataset. Editing an address later never changes a past shipment: booking
        copies the address onto the shipment.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAddressRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerAddress" }

        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/customers/{customerId}/credit:
    parameters:
      - { $ref: "#/components/parameters/CustomerId" }
    get:
      tags: [Customers]
      summary: Credit profile and history
      responses:
        "200":
          description: The credit profile with its append-only entry history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditProfile" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Customers]
      summary: Set credit terms
      description: |
        Requires `customer_credit.manage`. `creditUsedMinor` is not settable: it
        is maintained by booking and cancellation and is reproducible from the
        entry history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [creditLimitMinor, paymentTermsDays]
              properties:
                creditLimitMinor: { $ref: "#/components/schemas/MinorAmount" }
                paymentTermsDays: { type: integer, minimum: 0, maximum: 180 }
                creditStatus: { type: string, enum: [GOOD, WARNING, ON_HOLD, BLOCKED] }
                blockedReason: { type: string }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditProfile" }

        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  # ------------------------------------------------------------ Shipments --
  /api/v1/shipments:
    get:
      tags: [Shipments]
      summary: List shipments
      description: |
        Requires `shipment.read`. Cursor paginated, newest first. Branch-scoped
        principals see only their own branch's shipments; `shipment.read_all`
        lifts that restriction. Customer-portal users see only their own.
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - name: status
          in: query
          description: Comma-separated list of statuses.
          schema: { type: string, examples: ["BOOKED,IN_TRANSIT"] }
        - name: search
          in: query
          description: AWB prefix or exact customer reference.
          schema: { type: string }
        - name: customerId
          in: query
          schema: { type: string }
        - name: serviceCode
          in: query
          schema: { type: string }
        - name: paymentMode
          in: query
          schema: { $ref: "#/components/schemas/PaymentMode" }
        - name: bookedFrom
          in: query
          schema: { type: string, format: date-time }
        - name: bookedTo
          in: query
          schema: { type: string, format: date-time }
        - name: originPincode
          in: query
          schema: { $ref: "#/components/schemas/Pincode" }
        - name: destinationPincode
          in: query
          schema: { $ref: "#/components/schemas/Pincode" }
      responses:
        "200":
          description: A page of shipments.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ShipmentListItem" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Shipments]
      summary: Book a shipment
      description: |
        Requires `shipment.create`. The single most important call in the API.

        In one atomic transaction the server validates the customer, sender,
        recipient and packages; checks serviceability; resolves the route;
        prices the shipment; verifies credit; allocates a unique AWB; and
        persists the shipment, its packages, immutable address, price and route
        snapshots, the `BOOKED` event and an audit record. Either all of that
        lands or none of it does.

        **Always send an `Idempotency-Key`.** A retry with the same key and body
        returns the original shipment with `Idempotent-Replay: true`. Without a
        key, a retried request creates a second shipment.

        Server-owned fields (`awb`, `status`, `totalAmountMinor`,
        `organizationId`) are rejected if present in the body.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingRequest" }
      responses:
        "201":
          description: Booked.
          headers:
            Location:
              schema: { type: string }
            Idempotent-Replay:
              description: "`true` when this response replays an earlier identical request."
              schema: { type: string, enum: ["true"] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: The customer does not exist or is not accessible.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: |
            The booking cannot proceed. Codes: `SHIPMENT_NOT_SERVICEABLE`
            (see `details.reasonCode`), `CONFLICT` (credit limit, inactive
            customer), `DUPLICATE_RESOURCE` (customer reference already used),
            `IDEMPOTENCY_KEY_REUSED`, `IDEMPOTENCY_IN_PROGRESS`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                notServiceable:
                  value:
                    error:
                      code: SHIPMENT_NOT_SERVICEABLE
                      message: No branch currently serves pickups at the origin PIN code.
                      details:
                        reasonCode: ORIGIN_NOT_SERVICEABLE
                        originPincode: "560001"
                        destinationPincode: "110001"
                        explanationId: exp_01KZG...
                      requestId: req_01KZG...
                creditExceeded:
                  value:
                    error:
                      code: CONFLICT
                      message: This booking exceeds the customer's available credit.
                      details:
                        creditLimitMinor: 5000000
                        creditUsedMinor: 4950000
                        requiredMinor: 104880
                      requestId: req_01KZG...
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/shipments/{shipmentId}:
    parameters:
      - { $ref: "#/components/parameters/ShipmentId" }
    get:
      tags: [Shipments]
      summary: Get a shipment
      description: |
        Returns the shipment with its packages and its immutable address, price
        and route snapshots. `allowedTransitions` tells you which state changes
        this build permits from the current status.
      responses:
        "200":
          description: The shipment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/shipments/{shipmentId}/events:
    parameters:
      - { $ref: "#/components/parameters/ShipmentId" }
    get:
      tags: [Shipments]
      summary: Shipment history
      description: |
        The append-only event log, oldest first. Events cannot be edited or
        deleted through any API; corrections are new events.
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: The event history.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ShipmentEvent" }

  /api/v1/shipments/{shipmentId}/cancel:
    parameters:
      - { $ref: "#/components/parameters/ShipmentId" }
    post:
      tags: [Shipments]
      summary: Cancel a shipment
      description: |
        Requires `shipment.cancel`. Legal only from `BOOKED` in Release 1.
        `CANCELLED` is terminal. A credit booking releases its reserved credit.
        A `reason` of at least five characters is mandatory and is recorded on
        the event and the audit trail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }
        "409":
          description: |
            The transition is not legal. `SHIPMENT_INVALID_STATE` carries
            `details.allowedTransitions`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/shipments/{shipmentId}/label:
    parameters:
      - { $ref: "#/components/parameters/ShipmentId" }
    get:
      tags: [Shipments]
      summary: Generate a label
      description: |
        Requires `shipment.label`. Returns a barcode/QR-ready payload
        synchronously; PDF rendering is a later release.

        `barcodePayload` is the AWB itself, so a scan anywhere in the network
        yields a value the API accepts. `qrPayload` is a version-prefixed
        pipe-delimited record for handheld scanners. `format=ZPL` returns a
        ready-to-print 4x6 inch label as `text/plain`.

        A cancelled shipment produces no label.
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [JSON, ZPL], default: JSON }
      responses:
        "200":
          description: The label payload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
            text/plain:
              schema: { type: string, description: A ZPL II document. }
        "409":
          description: The shipment is cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/pickups:
    get:
      tags: [Pickup]
      summary: List pickup requests
      operationId: listPickups
      description: |
        The dispatcher queue, keyset paginated and scoped to the branches your role covers.

        Requires the `pickup.read` permission.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: status, in: query, schema: { type: string }, description: Filter by status. }
        - { name: pickupType, in: query, schema: { type: string, enum: [SCHEDULED, ON_DEMAND, BULK, RECURRING] } }
        - { name: scheduledDate, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Pickup]
      summary: Raise a pickup request
      operationId: createPickup
      description: |
        Creates a pickup request and, when shipments are named, links them and moves them to PICKUP_SCHEDULED.

        The branch is resolved from the pickup PIN code by the routing engine, so the request lands in the queue of the facility that actually serves that area. The address is snapshotted: editing the customer's address later does not redirect a pickup already dispatched.

        Requires the `pickup.create` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePickupRequest' }
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/pickups/{pickupId}:
    get:
      tags: [Pickup]
      summary: Get a pickup request
      operationId: getPickup
      description: |
        Returns the request with its linked shipments, current assignment and every recorded attempt.

        Requires the `pickup.read` permission.
      parameters:
        - { name: pickupId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/pickups/{pickupId}/assign:
    post:
      tags: [Pickup]
      summary: Assign a pickup to an agent
      operationId: assignPickup
      description: |
        Replaces any live assignment. A partial unique index guarantees only one assignment is live at a time, so two dispatchers racing produce one winner and one 409 rather than two agents sent to the same address.

        Requires the `pickup.assign` permission.
      parameters:
        - { name: pickupId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignPickupRequest' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/pickups/{pickupId}/complete:
    post:
      tags: [Pickup]
      summary: Record a pickup visit
      operationId: completePickup
      description: |
        Records the outcome of a visit and moves the shipments actually handed over to PICKED_UP.

        Anything on the request that was not handed over is marked NOT_AVAILABLE rather than silently collected. Supply `X-Device-Id` and `X-Device-Event-Id` so an offline retry returns the original attempt instead of collecting twice.

        Requires the `pickup.complete` permission.
      parameters:
        - { name: pickupId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/DeviceId' }
        - { $ref: '#/components/parameters/DeviceEventId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompletePickupRequest' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/pickups/{pickupId}/cancel:
    post:
      tags: [Pickup]
      summary: Cancel a pickup request
      operationId: cancelPickup
      description: |
        Withdraws the request. Linked shipments return to BOOKED: cancelling the collection does not cancel the shipment.

        Requires the `pickup.cancel` permission.
      parameters:
        - { name: pickupId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/pickups/my-stops:
    get:
      tags: [Pickup]
      summary: A field agent's pickup stops
      operationId: listAgentPickupStops
      description: |
        The agent's ordered work list for a day. A dispatcher may pass `agentId` to see somebody else's, which requires `pickup.assign`.

        Requires the `pickup.read` permission.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: onlyOpen, in: query, schema: { type: boolean, default: true } }
        - { name: agentId, in: query, schema: { type: string } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentStopList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/pickups/assignments/{assignmentId}/respond:
    post:
      tags: [Pickup]
      summary: Accept or reject an assignment
      operationId: respondToPickupAssignment
      description: |
        The field agent's answer. A rejection returns the request to the scheduling pool rather than failing it: the parcel still needs collecting.

        Requires the `pickup.respond` permission.
      parameters:
        - { name: assignmentId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RespondPickupRequest' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/pickups/assignments/{assignmentId}/arrive:
    post:
      tags: [Pickup]
      summary: Record arrival at the pickup address
      operationId: arriveAtPickup
      description: |
        Marks the agent on site.

        Requires the `pickup.complete` permission.
      parameters:
        - { name: assignmentId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArrivePickupRequest' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/pickup-runs:
    get:
      tags: [Pickup]
      summary: List pickup runs
      operationId: listPickupRuns
      description: |
        An agent's planned route for a day.

        Requires the `pickup.read` permission.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { name: status, in: query, schema: { type: string }, description: Filter by status. }
        - { name: runDate, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupRunList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Pickup]
      summary: Create a pickup run
      operationId: createPickupRun
      description: |
        Opens a run an agent's stops can be attached to.

        Requires the `pickup.assign` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePickupRunRequest' }
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/scans:
    get:
      tags: [Scanning]
      summary: Operational scan history
      operationId: listScans
      description: |
        Every scan recorded at your facilities, including refusals. A device scanning parcels into the wrong facility is invisible if failures are only returned to the handset, so rejections are recorded here too.

        Requires the `scan.read` permission.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: operatingUnitId, in: query, schema: { type: string }, description: The operating unit you are working at. Optional when your role covers exactly one. }
        - { name: scanType, in: query, schema: { $ref: '#/components/schemas/ScanType' } }
        - { name: outcome, in: query, schema: { type: string, enum: [ACCEPTED, DUPLICATE, REJECTED] } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanHistoryPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Scanning]
      summary: Perform an operational scan
      operationId: performScan
      description: |
        The hot path. One barcode, one scan.

        **Always returns 200 when the scan was recorded**, including when the parcel could not move: the `outcome` field carries `ACCEPTED`, `DUPLICATE` or `REJECTED`, and a rejection includes a `rejectionCode` the handset can act on. A 4xx here means the request itself was malformed or you lack the permission, not that the parcel refused to move.

        Supply `X-Device-Id` and `X-Device-Event-Id` for offline safety: a replayed event returns the original outcome rather than scanning twice.

        Requires the `one of scan.inbound, scan.outbound, scan.sort, scan.hold or scan.exception, depending on the scan type` permission.
      parameters:
        - { name: operatingUnitId, in: query, schema: { type: string }, description: The operating unit you are working at. Optional when your role covers exactly one. }
        - { $ref: '#/components/parameters/DeviceId' }
        - { $ref: '#/components/parameters/DeviceEventId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScanRequest' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/scans/bulk:
    post:
      tags: [Scanning]
      summary: Perform a batch of scans
      operationId: performBulkScan
      description: |
        Applies up to 200 barcodes at one facility. Each barcode is its own transaction, so one bad parcel in a trolley of two hundred does not lose the other one hundred and ninety-nine. The response reports every barcode's individual outcome.

        Requires the `the same permission as a single scan of that type` permission.
      parameters:
        - { $ref: '#/components/parameters/DeviceId' }
        - { $ref: '#/components/parameters/DeviceEventId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkScanRequest' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkScanResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/bags:
    get:
      tags: [Bagging]
      summary: List bags
      operationId: listBags
      description: |
        Bags at the facilities your role covers.

        Requires the `bag.read` permission.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: status, in: query, schema: { type: string }, description: Filter by status. }
        - { name: originUnitId, in: query, schema: { type: string } }
        - { name: destinationUnitId, in: query, schema: { type: string } }
        - { name: direction, in: query, schema: { type: string, enum: [FORWARD, REVERSE] } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BagPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Bagging]
      summary: Open a bag
      operationId: createBag
      description: |
        Opens a bag at your facility addressed to another. Contents are mutable only while the bag is OPEN.

        Requires the `bag.manage` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBagRequest' }
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bag' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/bags/{bagId}:
    get:
      tags: [Bagging]
      summary: Get a bag
      operationId: getBag
      description: |
        Returns contents, seals, history and — once closed — the frozen declaration reconciliation is measured against.

        Requires the `bag.read` permission.
      parameters:
        - { name: bagId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bag' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/bags/by-barcode/{barcode}:
    get:
      tags: [Bagging]
      summary: Find a bag by its tag
      operationId: getBagByBarcode
      description: |
        Resolves a scanned bag tag.

        Requires the `bag.read` permission.
      parameters:
        - { name: barcode, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bag' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/bags/{bagId}/items:
    post:
      tags: [Bagging]
      summary: Add shipments to an open bag
      operationId: addBagItems
      description: |
        Each barcode succeeds or fails on its own; the response reports per-item outcomes and the call returns 200 even when some were refused.

        A shipment is refused when it is in another bag, held, routed elsewhere, travelling in the other direction, or not physically at this facility.

        Requires the `bag.manage` permission.
      parameters:
        - { name: bagId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/DeviceId' }
        - { $ref: '#/components/parameters/DeviceEventId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BarcodeListRequest' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddBagItemsResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/bags/{bagId}/items/{barcode}:
    delete:
      tags: [Bagging]
      summary: Remove a shipment from an open bag
      operationId: removeBagItem
      description: |
        Only while the bag is OPEN. After closure this returns 409 and the exception-correction endpoint must be used instead.

        Requires the `bag.manage` permission.
      parameters:
        - { name: bagId, in: path, required: true, schema: { type: string } }
        - { name: barcode, in: path, required: true, schema: { type: string } }
        - { name: reason, in: query, schema: { type: string } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bag' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/bags/{bagId}/close:
    post:
      tags: [Bagging]
      summary: Close and seal a bag
      operationId: closeBag
      description: |
        Freezes the contents and records the seals. The closure snapshot is what the receiving facility reconciles against, and it is never rewritten — a later correction is layered on top rather than editing the declaration.

        Requires the `bag.close` permission.
      parameters:
        - { name: bagId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseBagRequest' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bag' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/bags/{bagId}/dispatch:
    post:
      tags: [Bagging]
      summary: Dispatch a closed bag
      operationId: dispatchBag
      description: |
        Normally driven by manifest dispatch; this exists for a single bag moving between nearby branches.

        Requires the `bag.dispatch` permission.
      parameters:
        - { name: bagId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bag' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/bags/{bagId}/receive:
    post:
      tags: [Bagging]
      summary: Receive an inbound bag
      operationId: receiveBag
      description: |
        A bag must be received where it was addressed. Receiving it elsewhere returns 409 with `BAG_WRONG_DESTINATION`, which is far cheaper than discovering the misroute during reconciliation.

        Requires the `bag.receive` permission.
      parameters:
        - { name: bagId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/OperatingUnitHeader' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bag' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/bags/{bagId}/open:
    post:
      tags: [Bagging]
      summary: Open a received bag
      operationId: openBag
      description: |
        Breaks the seals and makes the contents available for sorting.

        Requires the `bag.open` permission.
      parameters:
        - { name: bagId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/OperatingUnitHeader' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bag' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/bags/{bagId}/verify-seal:
    post:
      tags: [Bagging]
      summary: Verify a seal
      operationId: verifyBagSeal
      description: |
        Records whether the seal arrived intact. Anything other than INTACT is a chain-of-custody event and is audited.

        Requires the `bag.receive` permission.
      parameters:
        - { name: bagId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/OperatingUnitHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifySealRequest' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bag' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/bags/{bagId}/exception-correction:
    post:
      tags: [Bagging]
      summary: Correct a closed bag
      operationId: correctBag
      description: |
        The privileged post-closure correction. It demands a written reason and a linked exception record, and it never rewrites the closure declaration: the original stands and the correction is a separate fact.

        Requires the `bag.exception_edit` permission.
      parameters:
        - { name: bagId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BagCorrectionRequest' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bag' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/manifests:
    get:
      tags: [Manifest]
      summary: List manifests
      operationId: listManifests
      description: |
        Manifests at the facilities your role covers.

        Requires the `manifest.read` permission.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: status, in: query, schema: { type: string }, description: Filter by status. }
        - { name: originUnitId, in: query, schema: { type: string } }
        - { name: destinationUnitId, in: query, schema: { type: string } }
      responses:
        '200':
          description: Success
