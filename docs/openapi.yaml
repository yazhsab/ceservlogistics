  /api/v1/hub/inbound:
    get:
      tags: [Hub operations]
      summary: Expected inbound
      operationId: getHubInbound
      description: |
        Manifests dispatched towards this facility and trips on the road to it, oldest first because that is what is most overdue.

        Requires the `hub.dashboard` permission.
      parameters:
