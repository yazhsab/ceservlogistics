      operationId: getHubSummary
      description: |
        The whole dashboard in one round trip: what is in custody, open and closed bags, inbound bags, manifests and trips, the delivery queue, NDR backlog, open exceptions and pending pickups. Every figure is an index-served count.

        Requires the `hub.dashboard` permission.
      parameters:
        - { name: operatingUnitId, in: query, schema: { type: string }, description: The operating unit you are working at. Optional when your role covers exactly one. }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HubWorkloadSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
