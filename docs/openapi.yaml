        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Manifest]
      summary: Open a draft manifest
      operationId: createManifest
      description: |
        Opens the handover document between two facilities.

        Requires the `manifest.manage` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateManifestRequest' }
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Manifest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/manifests/{manifestId}:
    get:
      tags: [Manifest]
      summary: Get a manifest
      operationId: getManifest
      description: |
        Contents, history and — once closed — the frozen declaration.

        Requires the `manifest.read` permission.
      parameters:
        - { name: manifestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Manifest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/manifests/{manifestId}/contents:
    post:
      tags: [Manifest]
      summary: Load bags and loose shipments
      operationId: addManifestContent
      description: |
        Only closed bags may be loaded: an open bag has no frozen declaration, so loading one would put a manifest into the world describing contents that can still change.

        A shipment already inside a bag cannot also be manifested loose.

        Requires the `manifest.manage` permission.
      parameters:
        - { name: manifestId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManifestContentRequest' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddManifestContentResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Manifest]
      summary: Remove an item from a draft manifest
      operationId: removeManifestContent
      description: |
        Only while the manifest is DRAFT.

        Requires the `manifest.manage` permission.
      parameters:
        - { name: manifestId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RemoveManifestContentRequest' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Manifest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/manifests/{manifestId}/close:
    post:
      tags: [Manifest]
      summary: Close a manifest
      operationId: closeManifest
      description: |
        Freezes the contents and queues the printable document, which is generated in the background from the frozen snapshot rather than assembled in the request.

        Requires the `manifest.close` permission.
      parameters:
        - { name: manifestId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseManifestRequest' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Manifest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/manifests/{manifestId}/dispatch:
    post:
      tags: [Manifest]
      summary: Dispatch a closed manifest
      operationId: dispatchManifest
      description: |
        Every shipment on it — bagged and loose — moves in the same transaction, so the manifest and the parcels it describes can never disagree about whether they left.

        Requires the `manifest.dispatch` permission.
      parameters:
        - { name: manifestId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/DeviceId' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Manifest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/manifests/{manifestId}/receive:
    post:
      tags: [Manifest]
      summary: Receive an inbound manifest
      operationId: receiveManifest
      description: |
        Takes the manifest, its bags and its shipments into your facility. A manifest addressed elsewhere is refused with `MANIFEST_WRONG_DESTINATION`.

        Requires the `manifest.receive` permission.
      parameters:
        - { name: manifestId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/OperatingUnitHeader' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Manifest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/carriers:
    get:
      tags: [Line haul]
      summary: List carriers
      operationId: listCarriers
      description: |
        Own fleet and contracted carriers.

        Requires the `carrier.read` permission.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
        - { name: carrierType, in: query, schema: { type: string, enum: [OWN, CONTRACTED, PARTNER, COURIER_PARTNER] } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarrierList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Line haul]
      summary: Register a carrier
      operationId: createCarrier
      description: |
        A trip's mode must be one this carrier operates.

        Requires the `carrier.manage` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CarrierRequest' }
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Carrier' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/vehicles:
    get:
      tags: [Line haul]
      summary: List vehicles
      operationId: listVehicles
      description: |
        Vehicles available for line haul.

        Requires the `vehicle.read` permission.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
        - { name: vehicleType, in: query, schema: { type: string } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Line haul]
      summary: Register a vehicle
      operationId: createVehicle
      description: |
        A vehicle can be on only one live trip at a time.

        Requires the `vehicle.manage` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleRequest' }
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/drivers:
    get:
      tags: [Line haul]
      summary: List drivers
      operationId: listDrivers
      description: |
        Drivers, whether or not they are system users.

        Requires the `driver.read` permission.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Line haul]
      summary: Register a driver
      operationId: createDriver
      description: |
        A contracted carrier's driver may have no login, so `userId` is optional.

        Requires the `driver.manage` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriverRequest' }
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Driver' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/trips:
    get:
      tags: [Line haul]
      summary: List trips
      operationId: listTrips
      description: |
        Planned and in-flight trips.

        Requires the `trip.read` permission.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: status, in: query, schema: { type: string }, description: Filter by status. }
        - { name: mode, in: query, schema: { type: string, enum: [ROAD, AIR, RAIL, PARTNER] } }
        - { name: originUnitId, in: query, schema: { type: string } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Line haul]
      summary: Plan a trip
      operationId: createTrip
      description: |
        A single-hop trip gets one implicit leg. A multi-leg trip has its legs validated as a chain: each must start where the previous ended, and the chain must run from the trip's origin to its destination.

        Requires the `trip.manage` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTripRequest' }
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trip' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/trips/{tripId}:
    get:
      tags: [Line haul]
      summary: Get a trip
      operationId: getTrip
      description: |
        Legs, crew, manifests and history.

        Requires the `trip.read` permission.
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trip' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/trips/{tripId}/assign:
    post:
      tags: [Line haul]
      summary: Assign a vehicle and driver
      operationId: assignTrip
      description: |
        Only before departure. A vehicle or driver already on a live trip is refused with `VEHICLE_IN_USE` or `DRIVER_IN_USE`.

        Requires the `trip.manage` permission.
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignTripRequest' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trip' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/trips/{tripId}/manifests:
    post:
      tags: [Line haul]
      summary: Attach a manifest to a trip
      operationId: attachManifestToTrip
      description: |
        For a multi-leg trip, name the leg the manifest travels on so a parcel for an intermediate stop is unloaded there rather than carried past it.

        Requires the `trip.manage` permission.
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttachManifestRequest' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trip' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/trips/{tripId}/depart:
    post:
      tags: [Line haul]
      summary: Depart a trip
      operationId: departTrip
      description: |
        Validates before it moves anything:

        - every manifest on the trip is CLOSED (`TRIP_HAS_DRAFT_MANIFEST`)
        - a road trip has a vehicle and a driver (`TRIP_NO_VEHICLE`, `TRIP_NO_DRIVER`)
        - an air, rail or partner trip has its carrier reference (`TRIP_NO_REFERENCE`)
        - the trip is carrying something (`TRIP_EMPTY`)

        Only then does it dispatch the manifests and put their shipments in transit.

        Requires the `linehaul.depart` permission.
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/DeviceId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartTripRequest' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trip' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/trips/{tripId}/arrive:
    post:
      tags: [Line haul]
      summary: Record a trip arrival
      operationId: arriveTrip
      description: |
        Arrival marks the trip and the leg. It deliberately does **not** receive the parcels: a vehicle reaching the gate is not the same event as the hub counting what came off it, and conflating them is how shipments end up marked received at a facility that never saw them. Receipt happens through manifest receipt or inbound scans.

        Requires the `linehaul.arrive` permission.
      parameters:
