      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationalException' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/reconciliations:
    get:
      tags: [Hub operations]
      summary: List reconciliations
      operationId: listReconciliations
      description: |
        Counts started at your facilities.

        Requires the `reconciliation.manage` permission.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: status, in: query, schema: { type: string }, description: Filter by status. }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Hub operations]
      summary: Start a reconciliation
      operationId: startReconciliation
      description: |
        Materialises the expected list from the closure declaration, not from a live read: the receiving facility is checking what the sending facility declared, and a later correction must not be able to rewrite the declaration to match what turned up.

        Only one count per subject can be live, so two clerks cannot both be counting.

        Requires the `reconciliation.manage` permission.
      parameters:
        - { name: operatingUnitId, in: query, schema: { type: string }, description: The operating unit you are working at. Optional when your role covers exactly one. }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartReconciliationRequest' }
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reconciliation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/reconciliations/{reconciliationId}:
    get:
      tags: [Hub operations]
      summary: Get a reconciliation
      operationId: getReconciliation
      description: |
        The count with every expected and scanned item.

        Requires the `reconciliation.manage` permission.
      parameters:
        - { name: reconciliationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reconciliation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/reconciliations/{reconciliationId}/scan:
    post:
      tags: [Hub operations]
      summary: Scan items against a count
      operationId: scanReconciliation
      description: |
        A declared barcode becomes MATCHED. One that was not declared becomes EXCESS and raises an exception immediately, because an unexpected parcel at a hub is somebody else's problem arriving early.

        Requires the `reconciliation.manage` permission.
      parameters:
        - { name: reconciliationId, in: path, required: true, schema: { type: string } }
        - { name: operatingUnitId, in: query, schema: { type: string }, description: The operating unit you are working at. Optional when your role covers exactly one. }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReconciliationScanRequest' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationScanResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/reconciliations/{reconciliationId}/complete:
    post:
      tags: [Hub operations]
      summary: Complete a reconciliation
      operationId: completeReconciliation
      description: |
        Converts everything still unscanned to MISSING and raises an exception for each. A shortage without an owner is how parcels quietly disappear from a network, so the count cannot close silently.

        Requires the `reconciliation.manage` permission.
      parameters:
        - { name: reconciliationId, in: path, required: true, schema: { type: string } }
        - { name: operatingUnitId, in: query, schema: { type: string }, description: The operating unit you are working at. Optional when your role covers exactly one. }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RemarksRequest' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reconciliation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/delivery-runs:
    get:
      tags: [Delivery]
      summary: List delivery runs
      operationId: listDeliveryRuns
      description: |
        Pass `mine=true` for the calling agent's own runs.

        Requires the `delivery.read` permission.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: status, in: query, schema: { type: string }, description: Filter by status. }
        - { name: runDate, in: query, schema: { type: string, format: date } }
        - { name: mine, in: query, schema: { type: boolean }, description: Return only the calling agent's runs. }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryRunPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Delivery]
      summary: Create a delivery run
      operationId: createDeliveryRun
      description: |
        Plans a run and loads its stops. A shipment already out with another agent is refused with `SHIPMENT_ALREADY_ASSIGNED`, which is a database guarantee rather than a check: a partial unique index allows only one live run item per shipment.

        Requires the `delivery.manage` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDeliveryRunRequest' }
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/delivery-runs/{runId}:
    get:
      tags: [Delivery]
      summary: Get a delivery run
      operationId: getDeliveryRun
      description: |
        The run with its ordered stops and recipient details.

        Requires the `delivery.read` permission.
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Success
          content:
            application/json:
