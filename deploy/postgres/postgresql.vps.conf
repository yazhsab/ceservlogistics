# PostgreSQL tuning for a VPS SHARED with another application.
#
# deploy/postgres/postgresql.prod.conf assumes this database owns the machine.
# On this host it does not: wesafinv.com runs its own PostgreSQL 17, a Next.js
# app, and PHP-FPM alongside. Two changes follow from that, and only two.
#
#   shared_buffers        2GB -> 1536MB
#     This memory is reserved, not shared. Taking a quarter of a machine that
#     is no longer ours is not defensible; the measured working set is far
#     smaller and the saturation run never produced a slow query.
#
#   effective_cache_size  6GB -> 3GB
#     A planner hint about how much OS page cache this database can expect to
#     find its data in. With another PostgreSQL and a Node app competing for
#     the same cache, 6GB would make the planner over-confident about index
#     scans on cold data. Wrong here is worse than conservative.
#
# Everything else is unchanged from the production file, including the WAL,
# checkpoint and autovacuum settings.

# PostgreSQL 16 configuration for the Hostinger VPS KVM 4 target.
#
# 4 vCPU / 16 GB / NVMe, sharing the box with two API replicas, one worker,
# Redis and Nginx. PostgreSQL is budgeted ~4 GB (Constitution §28).

listen_addresses = '*'
port = 5432

# ---------------------------------------------------------------------------
# Connections
# ---------------------------------------------------------------------------
# Two API replicas at 20 plus one worker at 8 is 48. The remainder covers
# migrations, backups and an operator psql session. More would not help: the
# box has 4 cores, and pgx already queues within each pool.
max_connections = 100
superuser_reserved_connections = 5

# ---------------------------------------------------------------------------
# Memory
# ---------------------------------------------------------------------------
shared_buffers = 1536MB                 # shared host: see the header
effective_cache_size = 3GB              # shared host: see the header
maintenance_work_mem = 512MB            # index builds and VACUUM
work_mem = 8MB                          # x max_connections worst case = 800 MB
huge_pages = try

# ---------------------------------------------------------------------------
# Write-ahead log and checkpoints
# ---------------------------------------------------------------------------
wal_level = replica                     # enough for physical backup and PITR
max_wal_size = 2GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9      # spread checkpoint I/O
wal_compression = on
wal_buffers = 16MB
archive_mode = off                      # enable with archive_command for PITR

# ---------------------------------------------------------------------------
# Planner: NVMe storage
# ---------------------------------------------------------------------------
random_page_cost = 1.1                  # random reads are nearly sequential
effective_io_concurrency = 200
default_statistics_target = 100

# ---------------------------------------------------------------------------
# Parallelism
# ---------------------------------------------------------------------------
# Bounded deliberately: this workload is many small OLTP queries, not few large
# scans, and parallel workers would compete with the application for the four
# cores.
max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 2

# ---------------------------------------------------------------------------
# Autovacuum
# ---------------------------------------------------------------------------
# shipment_events and audit_events are append-only and grow quickly, so
# autovacuum runs more eagerly than the default to keep visibility maps fresh
# for index-only scans.
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.025
autovacuum_vacuum_cost_limit = 1000

# ---------------------------------------------------------------------------
# Statement safety
# ---------------------------------------------------------------------------
# The application also sets these per connection; the server-side values are the
# backstop for psql sessions and ad-hoc tooling.
statement_timeout = 30s
idle_in_transaction_session_timeout = 60s
lock_timeout = 10s

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
log_destination = 'stderr'
logging_collector = off                 # the container runtime collects stderr
log_min_duration_statement = 500ms      # slow-query log
log_checkpoints = on
log_connections = off                   # too noisy with pooling
log_lock_waits = on
log_temp_files = 4MB
log_autovacuum_min_duration = 1000
log_line_prefix = '%m [%p] %q%u@%d '

# ---------------------------------------------------------------------------
# Locale
# ---------------------------------------------------------------------------
timezone = 'UTC'                        # storage is UTC; display uses the tenant zone
datestyle = 'iso, mdy'
lc_messages = 'C'
