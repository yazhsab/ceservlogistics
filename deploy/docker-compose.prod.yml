# Production stack for the Hostinger VPS KVM 4 target (4 vCPU / 16 GB / 200 GB).
#
# Memory budget, deliberately leaving roughly 3 GB of headroom for the OS, page
# cache and backups:
#
#   PostgreSQL   4 GB   (2 GB shared_buffers + work_mem + connections)
#   API x2       1.5 GB
#   Worker       512 MB
#   Redis        512 MB (capped, eviction enabled)
#   Nginx        128 MB
#   ------------------
#   Total       ~6.6 GB of 16 GB
#
# Secrets come from a .env file next to this compose file; nothing sensitive is
# written here.

name: courier-os

x-app-env: &app-env
  APP_ENV: production
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
  TRUSTED_PROXY_CIDRS: 172.16.0.0/12
  LOG_FORMAT: json
  LOG_LEVEL: info
  SERVICE_VERSION: ${VERSION:-dev}
  GIT_COMMIT: ${GIT_COMMIT:-unknown}
  # Object storage for POD photos, signatures and exports (Release 2).
  #
  # The application refuses to start in production with the filesystem driver:
  # these containers run read-only, and POD evidence written to a container
  # layer would vanish on the next deploy. All four values are therefore
  # required rather than defaulted — a stack that cannot store proof of
  # delivery should fail at `compose up`, not at the first delivery.
  STORAGE_DRIVER: s3
  STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?STORAGE_ENDPOINT is required}
  STORAGE_BUCKET: ${STORAGE_BUCKET:?STORAGE_BUCKET is required}
  STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}
  STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}
  STORAGE_REGION: ${STORAGE_REGION:-us-east-1}

x-logging: &logging
  # Without this a chatty container can fill the 200 GB disk and take the
  # database down with it.
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 128M
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    logging: *logging
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-courier_os}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/postgresql.prod.conf:/etc/postgresql/postgresql.conf:ro
      - ./backups:/backups
    # Not published: the database is reachable only on the compose network.
    expose:
      - "5432"
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-courier_os}"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --maxmemory
      - 384mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    expose:
      - "6379"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
    logging: *logging
    restart: unless-stopped

  migrate:
    image: ${IMAGE:?IMAGE is required}
    entrypoint: ["/app/migrate", "up"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging
    restart: "no"

  api:
    image: ${IMAGE:?IMAGE is required}
    environment:
      <<: *app-env
      HTTP_ADDR: :8080
      METRICS_ADDR: 0.0.0.0:9090
      DATABASE_MAX_CONNS: "20"
    expose:
      - "8080"
      - "9090"
    # Two replicas so a rolling restart never drops the listener. Combined with
    # the worker that is 48 database connections against max_connections=100.
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 768M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging: *logging
    restart: unless-stopped

  worker:
    image: ${IMAGE:?IMAGE is required}
    entrypoint: ["/app/worker"]
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: "4"
      DATABASE_MAX_CONNS: "8"
      # The worker serves its own /livez, /readyz and /metrics. Every
      # courier_jobs_* metric is recorded by the process that runs the job,
      # which is this one, so without this endpoint queue depth and worker
      # failures are invisible.
      ENABLE_METRICS: "true"
      WORKER_HEALTH_ADDR: 0.0.0.0:8090
    expose:
      - "8090"
    # The image's default healthcheck probes :8080/livez, which is the API.
    # Left inherited, a working worker reports unhealthy forever.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/readyz >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging: *logging
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # nginx.conf includes this file. Without the mount nginx refuses to start
      # at all — "open() /etc/nginx/proxy_params_courier failed" — which takes
      # the entire ingress down, not just one route. Found by the deployment
      # simulation; it had never been started as a stack before.
      - ./nginx/proxy_params_courier:/etc/nginx/proxy_params_courier:ro
      - ./nginx/tls_courier:/etc/nginx/tls_courier:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - api
      - web
    deploy:
      resources:
        limits:
          memory: 128M
    logging: *logging
    restart: unless-stopped

volumes:
  postgres-data:
  certbot-webroot:
