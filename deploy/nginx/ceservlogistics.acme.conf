# Temporary HTTP-only Ceserv host used while obtaining the first TLS
# certificate. It is deliberately not a default_server and cannot capture
# Ahiabekee or Wesaf traffic.

upstream ceserv_api_acme_backend {
    least_conn;
    server 127.0.0.1:8080 max_fails=2 fail_timeout=5s;
    server 127.0.0.1:8081 max_fails=2 fail_timeout=5s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.ceservlogistics.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://ceserv_api_acme_backend;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name app.ceservlogistics.com customer.ceservlogistics.com track.ceservlogistics.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        default_type text/plain;
        return 503 "Ceserv Logistics deployment in progress\n";
    }
}
