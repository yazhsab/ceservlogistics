# Host-Nginx configuration for the shared production VPS.
#
# This file is intentionally scoped to Ceserv hostnames and loopback upstreams.
# It does not define a default_server and cannot receive traffic for Wesaf or
# Ahiabekee. Validate with `nginx -t` before a graceful reload.

upstream ceserv_api_backend {
    least_conn;
    server 127.0.0.1:8080 max_fails=2 fail_timeout=5s;
    server 127.0.0.1:8081 max_fails=2 fail_timeout=5s;
    keepalive 32;
}

upstream ceserv_web_backend {
    server 127.0.0.1:8082 max_fails=2 fail_timeout=5s;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=ceserv_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ceserv_api:10m rate=600r/m;

server {
    listen 80;
    listen [::]:80;
    server_name api.ceservlogistics.com app.ceservlogistics.com customer.ceservlogistics.com track.ceservlogistics.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.ceservlogistics.com;

    ssl_certificate /etc/letsencrypt/live/ceservlogistics.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ceservlogistics.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 26m;
    location = /livez { proxy_pass http://ceserv_api_backend; access_log off; }
    location = /readyz { proxy_pass http://ceserv_api_backend; access_log off; }
    location /metrics { return 404; }
    location ~ ^/api/v1/auth/(login|forgot-password|reset-password)$ {
        limit_req zone=ceserv_login burst=5 nodelay;
        include proxy_params;
        proxy_pass http://ceserv_api_backend;
    }
    location / {
        limit_req zone=ceserv_api burst=120 nodelay;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Request-Id $request_id;
        proxy_pass http://ceserv_api_backend;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.ceservlogistics.com;

    ssl_certificate /etc/letsencrypt/live/ceservlogistics.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ceservlogistics.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://ceserv_web_backend;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name customer.ceservlogistics.com;

    ssl_certificate /etc/letsencrypt/live/ceservlogistics.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ceservlogistics.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = / { return 302 /login; }
    location / {
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://ceserv_web_backend;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name track.ceservlogistics.com;

    ssl_certificate /etc/letsencrypt/live/ceservlogistics.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ceservlogistics.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ~ ^/([A-Za-z0-9_-]+)$ { return 302 /?awb=$1; }
    location / {
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://ceserv_web_backend/tracking.html;
    }
}
