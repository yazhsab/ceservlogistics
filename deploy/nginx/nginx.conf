# Nginx front door for the Courier OS API.
#
# It terminates TLS, enforces transport-level limits, and forwards to the API
# replicas. Application concerns — authentication, authorization, per-tenant
# rate limits — stay in the application; Nginx handles only what belongs at the
# edge.

user  nginx;
worker_processes  auto;          # 4 on the target VPS
worker_rlimit_nofile 8192;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # The request id is generated here when absent so a request can be traced
    # from the edge through the application logs.
    map $http_x_request_id $request_id_final {
        default   $http_x_request_id;
        ""        $request_id;
    }

    log_format json_combined escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"request_id":"$request_id_final","method":"$request_method",'
        '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"referrer":"$http_referer","user_agent":"$http_user_agent",'
        '"upstream_time":"$upstream_response_time","request_time":$request_time}';

    access_log  /var/log/nginx/access.log json_combined;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;           # do not advertise the Nginx version

    client_max_body_size 26m;      # matches HTTP_MAX_UPLOAD_BYTES
    client_body_timeout  30s;
    client_header_timeout 15s;
    send_timeout          30s;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        application/json text/plain text/csv;
    gzip_vary         on;

    # Coarse edge limits. They exist to absorb a flood before it reaches Go,
    # not to replace the application's per-principal limiter.
    limit_req_zone  $binary_remote_addr zone=api:10m   rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=login:10m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    upstream courier_api {
        # Compose DNS resolves this to every api replica.
        server api:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ---- HTTP: redirect everything except the ACME challenge ----------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS -------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # TLS 1.2 and 1.3 only; 1.0/1.1 are deprecated and 1.3 is preferred.
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;
        ssl_stapling              on;
        ssl_stapling_verify       on;

        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        # The application sets the rest of the security headers; they are not
        # duplicated here so there is one source of truth.

        limit_conn conn 64;

        # Probes are cheap, unauthenticated and must not be rate limited: the
        # load balancer depends on them.
        location = /livez  { proxy_pass http://courier_api; access_log off; }
        location = /readyz { proxy_pass http://courier_api; access_log off; }

        # The metrics port is never exposed publicly; scrape it over the private
        # network instead.
        location /metrics { return 404; }

        # Credential endpoints get their own, much tighter bucket.
        location ~ ^/api/v1/auth/(login|forgot-password|reset-password)$ {
            limit_req zone=login burst=5 nodelay;
            include /etc/nginx/proxy_params_courier;
            proxy_pass http://courier_api;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            include /etc/nginx/proxy_params_courier;
            proxy_pass http://courier_api;
        }

        location / {
            return 404 '{"error":{"code":"NOT_FOUND","message":"The requested endpoint does not exist."}}';
        }
    }
}
